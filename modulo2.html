<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Módulo 2 - Matriz Anual de DDS | Portal Vale v03</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f0f4f8; color: #1e293b; min-height: 100vh; padding: 16px; }

/* PAINEL DE CONTROLO COM VERDE-VALE */
.painel-controle { background: #ffffff; padding: 18px 22px; margin: 0 auto 16px auto; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; max-width: 100%; }
.topo-modulo-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; border-bottom: 2px solid #007e7a; padding-bottom: 10px; }
.badge-modulo { background: linear-gradient(135deg, #007e7a, #005a57); color: #fff; font-size: 11.5px; font-weight: 800; padding: 5px 12px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
.tag-v03 { background-color: #f59e0b; color: #fff; font-weight: 800; font-size: 10px; padding: 2px 7px; border-radius: 4px; margin-left: 6px; }

.campos-painel { display: grid; gap: 12px; margin-bottom: 12px; grid-template-columns: 2fr 1fr 1fr 1fr; }
.campo-grupo label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 10.5px; color: #475569; text-transform: uppercase; }
.painel-controle input[type="text"] { width: 100%; font-family: inherit; font-size: 12px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; outline: none; }
.painel-controle textarea { width: 100%; height: 70px; font-family: inherit; font-size: 12px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; resize: vertical; text-transform: uppercase; background: #f8fafc; outline: none; }

.painel-meses-toggle { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
.titulo-meses-toggle { font-size: 10.5px; font-weight: 800; text-transform: uppercase; color: #334155; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.container-meses-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn-mes-tag { border: 1px solid #007e7a; background-color: #e6f4f4; color: #005a57; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 5px; cursor: pointer; user-select: none; transition: 0.15s; }
.btn-mes-tag:hover { filter: brightness(0.95); }
.btn-mes-tag.inativo { background-color: #f1f5f9; border-color: #cbd5e1; color: #94a3b8; text-decoration: line-through; }
.links-rapidos-meses { display: flex; gap: 8px; }
.link-rapido { font-size: 9.5px; font-weight: 700; color: #1e40af; cursor: pointer; text-decoration: underline; background: none; border: none; }

.botoes-painel { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { cursor: pointer; padding: 7px 14px; font-size: 11px; font-weight: 700; border: none; border-radius: 6px; color: #fff; display: inline-flex; align-items: center; gap: 5px; }
.btn-verde { background-color: #007e7a; } .btn-azul { background-color: #0284c7; } .btn-salvar { background-color: #2563eb; } .btn-carregar { background-color: #0284c7; } .btn-limpar { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; } .btn-voltar { background-color: #475569; text-decoration: none; } .btn-imprimir { background-color: #0f172a; margin-left: auto; }

/* CONTENTOR NATURAL (TAMANHO NORMAL NO ECRÃ) */
.wrapper-tabela { width: 100%; overflow-x: auto; margin-bottom: 20px; }
.folha-a4 { display: inline-block; min-width: max-content; background: #fff; padding: 14px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border-radius: 10px; border: 1px solid #e2e8f0; }

.barra-controle-folha { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; background: #f8fafc; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 6px; }
.grupo-acoes-linhas { display: flex; align-items: center; gap: 6px; }
.btn-linha-topo { border: 1px solid #007e7a; border-radius: 4px; font-size: 9px; font-weight: 700; padding: 3px 8px; cursor: pointer; background: #fff; color: #007e7a; }
.btn-remover-folha { background: #fff; color: #ef4444; border: 1px solid #fca5a5; border-radius: 4px; font-size: 9px; font-weight: 700; padding: 3px 8px; cursor: pointer; }

.cabecalho-container, table.tabela-matriz { border-collapse: collapse; border: 1.2px solid #0f172a; margin-bottom: 4px; }
.cabecalho-container td { border: 1px solid #334155; padding: 3px 6px; vertical-align: middle; text-align: center; }
.logo-box { width: 90px; font-weight: 900; font-size: 14px; color: #007e7a; background-color: #f8fafc; }
.titulo-box { font-size: 10.5px; font-weight: 800; text-transform: uppercase; color: #0f172a; padding: 0 10px; }
.meta-box { width: 110px; font-size: 8.5px; text-align: left !important; padding-left: 6px !important; background-color: #f8fafc; }

table.tabela-matriz th, table.tabela-matriz td { border: 1px solid #475569; text-align: center; vertical-align: middle; font-size: 9px; }
.th-matriz-id { width: 35px; background-color: #f1f5f9; font-weight: 800; }
.th-matriz-colab { width: 220px; background-color: #007e7a; color: #fff; font-size: 10px; font-weight: 800; padding: 5px; text-align: left; padding-left: 8px; }
.th-mes-anual { width: 45px; background-color: #007e7a; color: #fff; font-size: 9.5px; font-weight: 800; padding: 5px 2px; }

table.tabela-matriz tbody tr { height: 26px; }
table.tabela-matriz tbody tr:nth-child(even) { background-color: #fafbfc; }

/* NÚMEROS EDITÁVEIS */
.td-matriz-id { background-color: #f8fafc; font-weight: 800; padding: 0 1px; }
.col-id-texto { outline: none; font-size: 9px; font-weight: 800; color: #0f172a; background: #e2e8f0; padding: 1px 4px; border-radius: 3px; display: inline-block; width: 100%; text-align: center; }
.col-id-texto:focus { background: #fef3c7; }

.celula-data { width: 45px; outline: none; font-size: 9px; font-weight: 700; color: #0f172a; background-color: #fff; padding: 0 2px; }
.celula-data:focus { background-color: #e6f4f4; box-shadow: inset 0 0 0 1.5px #007e7a; }

.botoes-acoes { display: flex; align-items: center; gap: 2px; opacity: 0.3; transition: opacity 0.2s; }
tr:hover .botoes-acoes { opacity: 1; }
.btn-acao { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 3px; cursor: pointer; padding: 1px 3px; font-size: 8px; }
.btn-mais-linha { color: #10b981; border-color: #6ee7b7; font-weight: 900; }
.btn-menos-linha { color: #f59e0b; border-color: #fcd34d; font-weight: 900; }
.btn-lixeira { color: #ef4444; border-color: #fca5a5; }

.col-nome-container { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; gap: 4px; width: 100%; }
.col-nome-texto { flex-grow: 1; text-align: left; outline: none; white-space: nowrap; overflow: hidden; font-size: 9.5px; font-weight: 700; color: #000; text-transform: uppercase; }
.mes-oculto { display: none !important; }

/* IMPRESSÃO PERFEITA COM CORES E AJUSTE AUTOMÁTICO */
@media print {
    @page { size: A4 landscape; margin: 5mm; }
    body { background: #fff !important; padding: 0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .painel-controle, .botoes-acoes, .barra-controle-folha { display: none !important; }
    .wrapper-tabela { overflow: visible !important; width: 100% !important; }
    .folha-a4 { box-shadow: none !important; border: none !important; width: 100% !important; padding: 0 !important; margin: 0 !important; }
}
</style>
</head>
<body>

    <div class="painel-controle">
        <div class="topo-modulo-info">
            <span class="badge-modulo">Módulo 2: Matriz Anual de DDS <span class="tag-v03">v03</span></span>
            <a href="index.html" class="btn btn-voltar">⬅ Voltar ao Menu</a>
        </div>
        <div class="campos-painel">
            <div class="campo-grupo"><label>Área:</label><input type="text" id="areaInputMatriz" placeholder="Operação"></div>
            <div class="campo-grupo"><label>Ano:</label><input type="text" id="anoInputMatriz" value="2026"></div>
            <div class="campo-grupo"><label>Turno:</label><input type="text" id="turnoInputMatriz" placeholder="Turno A"></div>
            <div class="campo-grupo"><label>Facilitador:</label><input type="text" id="facilitadorInputMatriz" placeholder="Mariana"></div>
        </div>
        <div class="painel-meses-toggle">
            <div class="titulo-meses-toggle"><span>👁️ Visibilidade dos Meses (Ajuste Automático de Largura):</span>
                <div class="links-rapidos-meses">
                    <button type="button" class="link-rapido" onclick="definirTodosMeses(true)">Exibir Todos</button>
                    <button type="button" class="link-rapido" onclick="definirTodosMeses(false)">Ocultar Todos</button>
                </div>
            </div>
            <div class="container-meses-btns">
                <button type="button" class="btn-mes-tag" data-mes="0" onclick="alternarMes(0)">JAN</button>
                <button type="button" class="btn-mes-tag" data-mes="1" onclick="alternarMes(1)">FEV</button>
                <button type="button" class="btn-mes-tag" data-mes="2" onclick="alternarMes(2)">MAR</button>
                <button type="button" class="btn-mes-tag" data-mes="3" onclick="alternarMes(3)">ABR</button>
                <button type="button" class="btn-mes-tag" data-mes="4" onclick="alternarMes(4)">MAI</button>
                <button type="button" class="btn-mes-tag" data-mes="5" onclick="alternarMes(5)">JUN</button>
                <button type="button" class="btn-mes-tag" data-mes="6" onclick="alternarMes(6)">JUL</button>
                <button type="button" class="btn-mes-tag" data-mes="7" onclick="alternarMes(7)">AGO</button>
                <button type="button" class="btn-mes-tag" data-mes="8" onclick="alternarMes(8)">SET</button>
                <button type="button" class="btn-mes-tag" data-mes="9" onclick="alternarMes(9)">OUT</button>
                <button type="button" class="btn-mes-tag" data-mes="10" onclick="alternarMes(10)">NOV</button>
                <button type="button" class="btn-mes-tag" data-mes="11" onclick="alternarMes(11)">DEZ</button>
            </div>
        </div>
        <div class="campo-grupo"><label>Colaboradores (Ordenação A-Z automática):</label><textarea id="nomesInputMatriz" oninput="this.value=this.value.toUpperCase()" placeholder="COLE OS NOMES AQUI..."></textarea></div>
        <div class="botoes-painel">
            <button type="button" class="btn btn-verde" onclick="gerarTabelaMatriz()">Atualizar Grelha (A-Z)</button>
            <button type="button" class="btn btn-azul" onclick="adicionarFolhaMatriz()">📄➕ Folha Extra</button>
            <button type="button" class="btn btn-salvar" onclick="salvarTudoMatriz()">💾 Guardar</button>
            <button type="button" class="btn btn-carregar" onclick="carregarTudoMatriz()">📂 Carregar</button>
            <button type="button" class="btn btn-limpar" onclick="limparTudoMatriz()">Limpar</button>
            <button type="button" class="btn btn-imprimir" onclick="window.print()">🖨️ Imprimir</button>
        </div>
    </div>

    <div id="contentorFolhasMatriz"></div>

    <script>
        let visMeses = [true,true,true,true,true,true,true,true,true,true,true,true];

        function aplicarVisMeses() {
            for(let i=0; i<12; i++) {
                const vis = visMeses[i];
                document.querySelector(`.btn-mes-tag[data-mes="${i}"]`).classList.toggle('inativo', !vis);
                document.querySelectorAll(`.col-mes-${i}`).forEach(el => el.classList.toggle('mes-oculto', !vis));
            }
        }
        function alternarMes(i) { visMeses[i] = !visMeses[i]; aplicarVisMeses(); }
        function definirTodosMeses(st) { for(let i=0; i<12; i++) visMeses[i] = st; aplicarVisMeses(); }

        function criarLinhaMatriz(numStr, nome='') {
            let tds = ''; for(let i=0; i<12; i++) tds += `<td class="celula-data col-mes-${i} ${visMeses[i]?'':'mes-oculto'}" contenteditable="true" title="Preencher DDS"></td>`;
            return `<td class="td-matriz-id"><div class="col-id-container"><span class="col-id-texto" contenteditable="true" title="Editar número">${numStr}</span></div></td>` +
                   `<td><div class="col-nome-container"><span class="col-nome-texto" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()" title="Nome do colaborador">${nome}</span>` +
                   `<div class="botoes-acoes"><button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaAbaixoMatriz(this)" title="Adicionar linha abaixo">➕</button><button type="button" class="btn-acao btn-menos-linha" onclick="removerLinhaMatriz(this)" title="Remover linha">➖</button><button type="button" class="btn-acao btn-lixeira" onclick="apagarLinhaMatriz(this)" title="Apagar nome">🗑️</button></div></div></td>${tds}`;
        }

        function apagarLinhaMatriz(b) { b.closest('tr').querySelector('.col-nome-texto').innerText = ''; }
        function adicionarLinhaAbaixoMatriz(btn) { const tr = document.createElement('tr'); tr.innerHTML = criarLinhaMatriz('00',''); btn.closest('tr').after(tr); }
        function adicionarLinhaFimMatriz(btn) { const corpo = btn.closest('.folha-a4').querySelector('.corpo-tabela-matriz'); const tr = document.createElement('tr'); tr.innerHTML = criarLinhaMatriz('00',''); corpo.appendChild(tr); }
        function removerLinhaMatriz(b) { const tr = b.closest('tr'); if(tr.parentNode.querySelectorAll('tr').length > 1) tr.remove(); }
        function removerFolhaMatriz(b) { b.closest('.wrapper-tabela').remove(); atualizarPaginacaoMatriz(); }

        function criarEstruturaFolhaMatriz(nomesArr, tot) {
            let linhas = ''; 
            for(let i=0; i<tot; i++) { 
                let n = nomesArr[i] ? nomesArr[i].trim().toUpperCase() : ''; 
                let numStr = (i+1 < 10 ? '0'+(i+1) : (i+1)); 
                linhas += `<tr>${criarLinhaMatriz(numStr, n)}</tr>`; 
            }
            const wrapper = document.createElement('div'); wrapper.className = 'wrapper-tabela';
            wrapper.innerHTML = `<div class="folha-a4">
                <div class="barra-controle-folha">
                    <div class="grupo-acoes-linhas"><button type="button" class="btn-linha-topo" onclick="adicionarLinhaFimMatriz(this)">➕ Linha no Fim</button></div>
                    <button type="button" class="btn-remover-folha" onclick="removerFolhaMatriz(this)">Remover Folha ✕</button>
                </div>
                <table class="cabecalho-container">
                    <tr>
                        <td class="logo-box">VALE</td>
                        <td class="titulo-box">MATRIZ DE REGISTO DE DIÁLOGO DIÁRIO DE SEGURANÇA (DDS)</td>
                        <td class="meta-box"><strong>Ano:</strong> <span class="campo-editavel" contenteditable="true">${document.getElementById('anoInputMatriz').value}</span><br><span class="indicador-folha"><strong>Folha:</strong> 01 / 01</span></td>
                    </tr>
                </table>
                <table class="tabela-matriz">
                    <thead>
                        <tr>
                            <th class="th-matriz-id">Nº</th>
                            <th class="th-matriz-colab">DDS (Colaboradores)</th>
                            <th class="th-mes-anual col-mes-0">JAN</th><th class="th-mes-anual col-mes-1">FEV</th>
                            <th class="th-mes-anual col-mes-2">MAR</th><th class="th-mes-anual col-mes-3">ABR</th>
                            <th class="th-mes-anual col-mes-4">MAI</th><th class="th-mes-anual col-mes-5">JUN</th>
                            <th class="th-mes-anual col-mes-6">JUL</th><th class="th-mes-anual col-mes-7">AGO</th>
                            <th class="th-mes-anual col-mes-8">SET</th><th class="th-mes-anual col-mes-9">OUT</th>
                            <th class="th-mes-anual col-mes-10">NOV</th><th class="th-mes-anual col-mes-11">DEZ</th>
                        </tr>
                    </thead>
                    <tbody class="corpo-tabela-matriz">${linhas}</tbody>
                </table>
            </div>`;
            return wrapper;
        }

        function atualizarPaginacaoMatriz() { const f = document.querySelectorAll('#contentorFolhasMatriz .wrapper-tabela'); f.forEach((folha, idx) => { const ind = folha.querySelector('.indicador-folha'); if(ind) ind.innerHTML = `<strong>Folha:</strong> 0${idx+1} / 0${f.length}`; }); }
        function adicionarFolhaMatriz() { document.getElementById('contentorFolhasMatriz').appendChild(criarEstruturaFolhaMatriz([], 24)); atualizarPaginacaoMatriz(); aplicarVisMeses(); }

        function gerarTabelaMatriz() {
            const box = document.getElementById('contentorFolhasMatriz'); box.innerHTML = '';
            const nomes = document.getElementById('nomesInputMatriz').value.toUpperCase().split('\n').map(l=>l.trim()).filter(l=>l.length>0).sort((a,b)=>a.localeCompare(b,'pt'));
            document.getElementById('nomesInputMatriz').value = nomes.join('\n');
            let blocos = []; if(nomes.length === 0) blocos.push([]); else for(let i=0; i<nomes.length; i+=24) blocos.push(nomes.slice(i, i+24));
            blocos.forEach(b => box.appendChild(criarEstruturaFolhaMatriz(b, 24)));
            aplicarVisMeses(); atualizarPaginacaoMatriz();
        }

        function salvarTudoMatriz() { localStorage.setItem('valematriz_v03', JSON.stringify({html: document.getElementById('contentorFolhasMatriz').innerHTML})); alert('Matriz Guardada com sucesso! (v03)'); }
        function carregarTudoMatriz() { const s = localStorage.getItem('valematriz_v03'); if(s) { document.getElementById('contentorFolhasMatriz').innerHTML = JSON.parse(s).html; aplicarVisMeses(); alert('Matriz Carregada!'); } }
        function limparTudoMatriz() { document.getElementById('contentorFolhasMatriz').innerHTML = ''; adicionarFolhaMatriz(); }

        window.onload = function() { adicionarFolhaMatriz(); };
    </script>
</body>
</html>
