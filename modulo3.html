<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Módulo 3 - Cronograma de Férias | Portal Vale v06</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #fff0f5; color: #1e293b; min-height: 100vh; padding: 16px; }

.painel-controle { background: #ffffff; padding: 18px 22px; margin: 0 auto 16px auto; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(219, 39, 119, 0.1); border: 1px solid #fbcfe8; max-width: 1200px; }
.topo-modulo-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; border-bottom: 2px solid #db2777; padding-bottom: 8px; }
.badge-modulo { background: linear-gradient(135deg, #db2777, #be185d); color: #fff; font-size: 11.5px; font-weight: 800; padding: 5px 12px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
.tag-v06 { background-color: #f59e0b; color: #fff; font-weight: 800; font-size: 10px; padding: 2px 7px; border-radius: 4px; margin-left: 6px; }

.campos-painel { display: grid; gap: 12px; margin-bottom: 12px; grid-template-columns: 200px 1fr; }
.campo-grupo label { display: block; font-weight: 700; margin-bottom: 4px; font-size: 10px; color: #9d174d; text-transform: uppercase; }
.painel-controle input[type="text"] { width: 100%; font-family: inherit; font-size: 12px; padding: 8px 10px; border: 1px solid #f472b6; border-radius: 6px; background: #fff1f2; outline: none; }
.painel-controle textarea { width: 100%; height: 60px; font-family: inherit; font-size: 12px; padding: 8px 10px; border: 1px solid #f472b6; border-radius: 6px; resize: vertical; text-transform: uppercase; background: #fff1f2; outline: none; }

.botoes-painel { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.btn { cursor: pointer; padding: 7px 14px; font-size: 11px; font-weight: 700; border: none; border-radius: 6px; color: #fff; display: inline-flex; align-items: center; gap: 5px; }
.btn-pink { background-color: #db2777; } 
.btn-add-folha { background-color: #7c3aed; }
.btn-voltar { background-color: #475569; text-decoration: none; } 
.btn-imprimir { background-color: #0f172a; margin-left: auto; }

.barra-zoom { background: #fce7f3; padding: 6px 14px; max-width: 1200px; margin: 0 auto 8px auto; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 11px; font-weight: 700; color: #9d174d; border: 1px solid #fbcfe8; }
.btn-zoom { background: #fff; border: 1px solid #f472b6; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-weight: 800; color: #db2777; }
.btn-zoom:hover { background: #fce7f3; }

.folha-a4 { width: 100%; max-width: 1200px; background: #fff; padding: 16px; margin: 0 auto 20px auto; box-shadow: 0 10px 30px rgba(219, 39, 119, 0.08); border-radius: 10px; border: 1px solid #f472b6; transform-origin: top center; transition: transform 0.1s ease; position: relative; }

.barra-controle-folha { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #fff1f2; padding: 6px 10px; border: 1px solid #fbcfe8; border-radius: 6px; }
.btn-remover-folha { background: #fff; color: #ef4444; border: 1px solid #fca5a5; border-radius: 4px; font-size: 9px; font-weight: 700; padding: 3px 8px; cursor: pointer; }

table.tabela-ferias { width: 100%; border-collapse: collapse; border: 1.5px solid #db2777; table-layout: fixed; }
table.tabela-ferias th, table.tabela-ferias td { border: 1px solid #f472b6; text-align: center; vertical-align: middle; font-size: 8px; height: 26px; padding: 1px; }
table.tabela-ferias th { background-color: #db2777; color: #fff; font-weight: 800; text-transform: uppercase; }

.col-id { width: 40px; background: #fff1f2; font-weight: 800; color: #831843; }
.col-nome { background: #fce7f3 !important; }
.col-nome-container { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; width: 100%; }
.col-nome-texto { flex-grow: 1; text-align: left; outline: none; white-space: nowrap; overflow: hidden; font-size: 9px; font-weight: 700; color: #831843; text-transform: uppercase; }
.col-saldo { width: 45px; font-weight: 800; background: #fff1f2; }

.botoes-acoes { display: flex; align-items: center; gap: 2px; opacity: 0.3; transition: opacity 0.2s; }
tr:hover .botoes-acoes { opacity: 1; }
.btn-acao { background: rgba(219,39,119,0.1); border: 1px solid rgba(219,39,119,0.3); border-radius: 3px; cursor: pointer; padding: 1px 4px; font-size: 8px; color: #831843; }
.btn-lixeira { color: #ef4444; }

/* REGRAS RÍGIDAS DE IMPRESSÃO LIMPA */
@media print {
    @page { size: A4 landscape; margin: 0; }
    body { background: #ffffff !important; margin: 0 !important; padding: 5mm !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .painel-controle, .barra-zoom, .botoes-acoes, .barra-controle-folha, title, script { display: none !important; }
    .folha-a4 { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; transform: none !important; margin: 0 !important; padding: 0 !important; }
    table.tabela-ferias th { background-color: #db2777 !important; color: #fff !important; }
    .col-nome { background-color: #fce7f3 !important; }
    .col-id, .col-saldo { background-color: #fff1f2 !important; }
}
</style>
</head>
<body>

    <div class="painel-controle">
        <div class="topo-modulo-info">
            <span class="badge-modulo">Módulo 3: Cronograma de Férias <span class="tag-v06">v06</span></span>
            <a href="index.html" class="btn btn-voltar">⬅ Voltar ao Menu</a>
        </div>
        <div class="campos-painel">
            <div class="campo-grupo"><label>Ano do Cronograma:</label><input type="text" id="anoInputFerias" value="2026" oninput="atualizarAnoTitulo()"></div>
            <div class="campo-grupo"><label>Lista de Colaboradores (Um por linha):</label><textarea id="nomesInputFerias" oninput="this.value=this.value.toUpperCase()" placeholder="COLE OS NOMES AQUI..."></textarea></div>
        </div>
        <div class="botoes-painel">
            <button type="button" class="btn btn-pink" onclick="gerarTabelaPorNomes()">Gerar com Nomes (A-Z)</button>
            <button type="button" class="btn btn-pink" onclick="addLinhaFeriasAtiva()">➕ Adicionar Linha</button>
            <button type="button" class="btn btn-add-folha" onclick="adicionarFolhaFerias()">📄➕ Folha Extra</button>
            <button type="button" class="btn btn-salvar" onclick="salvarTudoFerias()">💾 Guardar</button>
            <button type="button" class="btn btn-carregar" onclick="carregarTudoFerias()">📂 Carregar</button>
            <button type="button" class="btn btn-imprimir" onclick="window.print()">🖨️ Imprimir</button>
        </div>
    </div>

    <div class="barra-zoom">
        <span>Ajustar Tamanho (Zoom):</span>
        <button class="btn-zoom" onclick="mudarZoom(-0.1)">➖ Reduzir</button>
        <button class="btn-zoom" onclick="resetZoom()">100%</button>
        <button class="btn-zoom" onclick="mudarZoom(0.1)">➕ Ampliar</button>
    </div>

    <div id="contentorFolhasFerias"></div>

    <script>
        let nivelZoom = 1.0;
        function mudarZoom(valor) {
            nivelZoom = Math.min(Math.max(nivelZoom + valor, 0.6), 1.4);
            document.querySelectorAll('.folha-a4').forEach(f => f.style.transform = `scale(${nivelZoom})`);
        }
        function resetZoom() {
            nivelZoom = 1.0;
            document.querySelectorAll('.folha-a4').forEach(f => f.style.transform = `scale(1)`);
        }

        const DADOS_F_INICIAIS = [
            "MARIANA PEREIRA CRUZ", "RICARDO GONCALVES DE MELLO LEITE",
            "JOAO SILVA RAMOS", "ALFREDO AUGUSTO RAMOS NETO",
            "MARCOS AURELIO CATALLARES MATTOS", "VANDERSON TEIXEIRA",
            "BRUNO RICARDO", "GABRIEL CARNEIRO",
            "GLEIVSTON SILVA MENDES", "ROBSON DE SOUZA MENDONCA",
            "PAULO HENRIQUE", "BRUNO GOMES FIDELIS",
            "ATMISTO SILVA", "CAIO HENRIQUE",
            "PABLO MESQUITA", "DAVID MARCELO DELGADO DOS SANTOS",
            "DOMINIQUE SILVA", "RICHARD SILVA",
            "EMERSON RIBEIRO DOS SANTOS", "ALLAN SOUZA DE CARVALHO",
            "TITO DACAL"
        ];

        function atualizarAnoTitulo() {
            const ano = document.getElementById('anoInputFerias').value;
            document.querySelectorAll('.titulo-ano-txt').forEach(el => el.innerText = ano);
        }

        function criarTabelaFeriasHTML(nomesArr) {
            let linhas = '';
            const lista = nomesArr.length > 0 ? nomesArr : Array(21).fill('');
            lista.forEach((n, idx) => {
                let numStr = (idx+1 < 10 ? '0'+(idx+1) : (idx+1));
                let tds = ''; for(let i=0; i<24; i++) tds += `<td contenteditable="true" title="Clique para editar"></td>`;
                linhas += `<tr>` +
                    `<td class="col-id">${numStr}</td>` +
                    `<td class="col-nome"><div class="col-nome-container"><span class="col-nome-texto" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()">${n}</span><div class="botoes-acoes"><button type="button" class="btn-acao btn-lixeira" onclick="removerLinhaFerias(this)" title="Remover linha">🗑️</button></div></div></td>` +
                    tds + `<td class="col-saldo" contenteditable="true">-</td>` +
                `</tr>`;
            });

            const anoAtual = document.getElementById('anoInputFerias').value;
            const f = document.createElement('div'); f.className = 'folha-a4'; f.style.transform = `scale(${nivelZoom})`;
            f.innerHTML = `
                <div class="barra-controle-folha">
                    <div class="grupo-acoes-linhas"><span><strong>Módulo 3: Cronograma de Férias (v06)</strong></span></div>
                    <button type="button" class="btn-remover-folha" onclick="removerFolhaFerias(this)">Remover Folha ✕</button>
                </div>
                <div style="background: linear-gradient(135deg, #db2777, #be185d); color: #fff; text-align: center; font-weight: 900; font-size: 11px; padding: 6px; border-radius: 6px; margin-bottom: 6px; letter-spacing: 0.5px;">CONTROLO ANUAL DE FÉRIAS DA EQUIPA - <span class="titulo-ano-txt">${anoAtual}</span></div>
                <table class="tabela-ferias">
                    <thead>
                        <tr>
                            <th rowspan="2" style="width:40px;">Nº</th>
                            <th rowspan="2" style="width:230px;">COLABORADOR</th>
                            <th colspan="2">Jan</th><th colspan="2">Fev</th><th colspan="2">Mar</th><th colspan="2">Abr</th><th colspan="2">Mai</th><th colspan="2">Jun</th>
                            <th colspan="2">Jul</th><th colspan="2">Ago</th><th colspan="2">Set</th><th colspan="2">Out</th><th colspan="2">Nov</th><th colspan="2">Dez</th>
                            <th rowspan="2" style="width:45px;">Saldo</th>
                        </tr>
                        <tr style="font-size:6.5px;">
                            <th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th>
                            <th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th>
                        </tr>
                    </thead>
                    <tbody>${linhas}</tbody>
                </table>`;
            return f;
        }

        function gerarTabelaPorNomes() {
            const txt = document.getElementById('nomesInputFerias').value;
            let nomes = txt.split('\n').map(l => l.trim()).filter(l => l.length > 0).sort((a,b)=>a.localeCompare(b,'pt'));
            if(nomes.length === 0) nomes = DADOS_F_INICIAIS;
            document.getElementById('nomesInputFerias').value = nomes.join('\n');
            
            const box = document.getElementById('contentorFolhasFerias'); box.innerHTML = '';
            let blocos = []; for(let i=0; i<nomes.length; i+=21) blocos.push(nomes.slice(i, i+21));
            blocos.forEach(b => box.appendChild(criarTabelaFeriasHTML(b)));
        }

        function addLinhaFeriasAtiva() {
            const ultimaFolha = document.querySelector('#contentorFolhasFerias .folha-a4:last-child tbody');
            if(ultimaFolha) {
                const qtd = ultimaFolha.querySelectorAll('tr').length + 1;
                const tr = document.createElement('tr');
                let tds = ''; for(let i=0; i<24; i++) tds += `<td contenteditable="true" title="Clique para editar"></td>`;
                tr.innerHTML = `<td class="col-id">${qtd < 10 ? '0'+qtd : qtd}</td>` +
                    `<td class="col-nome"><div class="col-nome-container"><span class="col-nome-texto" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()"></span><div class="botoes-acoes"><button type="button" class="btn-acao btn-lixeira" onclick="removerLinhaFerias(this)" title="Remover linha">🗑️</button></div></div></td>` +
                    tds + `<td class="col-saldo" contenteditable="true">-</td>`;
                ultimaFolha.appendChild(tr);
            }
        }

        function adicionarFolhaFerias() {
            document.getElementById('contentorFolhasFerias').appendChild(criarTabelaFeriasHTML([]));
        }

        function removerFolhaFerias(btn) {
            const folhas = document.querySelectorAll('#contentorFolhasFerias .folha-a4');
            if(folhas.length > 1) btn.closest('.folha-a4').remove();
        }

        function removerLinhaFerias(btn) {
            const tr = btn.closest('tr');
            const tbody = tr.parentNode;
            if(tbody.querySelectorAll('tr').length > 1) {
                tr.remove();
                tbody.querySelectorAll('tr').forEach((row, idx) => {
                    const n = idx + 1;
                    row.querySelector('.col-id').innerText = n < 10 ? '0'+n : n;
                });
            }
        }

        function salvarTudoFerias() {
            localStorage.setItem('valeferias_v06', JSON.stringify({html: document.getElementById('contentorFolhasFerias').innerHTML, ano: document.getElementById('anoInputFerias').value}));
            alert('Cronograma de Férias Guardado com sucesso! (v06)');
        }

        function carregarTudoFerias() {
            const s = localStorage.getItem('valeferias_v06');
            if(s) {
                const dados = JSON.parse(s);
                if(dados.ano) document.getElementById('anoInputFerias').value = dados.ano;
                document.getElementById('contentorFolhasFerias').innerHTML = dados.html;
                alert('Cronograma Carregado!');
            }
        }

        window.onload = function() { 
            document.getElementById('nomesInputFerias').value = DADOS_F_INICIAIS.join('\n');
            gerarTabelaPorNomes(); 
        };
    </script>
</body>
</html>
