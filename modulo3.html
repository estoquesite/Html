<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo 3 - Cronograma de Férias | Portal Vale v07</title>
<style>
:root{--primary:#db2777;--primary-dark:#be185d;--primary-light:#fce7f3;--primary-border:#f472b6;--primary-bg:#fff1f2;--accent:#f59e0b;--danger:#ef4444;--success:#10b981;--s900:#0f172a;--s700:#334155;--s600:#475569;--s300:#cbd5e1;--s200:#e2e8f0;--s100:#f1f5f9;--s50:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#fff5f7;color:var(--s900);min-height:100vh;padding:16px}
#toastNotificacao{position:fixed;bottom:24px;right:24px;background:var(--s900);color:#fff;padding:10px 18px;border-radius:6px;font-size:12px;font-weight:600;box-shadow:0 10px 25px -5px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;transform:translateY(12px);z-index:9999}
#toastNotificacao.ativo{opacity:1;transform:none}
.painel-controle{background:#fff;padding:18px 22px;margin:0 auto 16px;border-radius:12px;box-shadow:0 10px 25px -5px rgba(219,39,119,.08);border:1px solid #fbcfe8;max-width:1200px}
.topo-modulo-info{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;border-bottom:2px solid var(--primary);padding-bottom:8px;gap:8px;flex-wrap:wrap}
.badge-modulo{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:6px;text-transform:uppercase;letter-spacing:.8px}
.tag-v06{background:var(--accent);color:#fff;font-weight:800;font-size:10px;padding:2px 7px;border-radius:4px;margin-left:6px}
.campos-painel{display:grid;gap:12px;margin-bottom:12px;grid-template-columns:140px 1.5fr 1.5fr}
.campo-grupo label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px;font-size:10.5px;color:#9d174d;text-transform:uppercase}
.painel-controle input[type=text],.painel-controle textarea{width:100%;font-family:inherit;font-size:12px;padding:8px 10px;border:1px solid var(--primary-border);border-radius:6px;background:var(--primary-bg);outline:none;transition:.2s}
.painel-controle textarea{height:90px;resize:vertical;text-transform:uppercase}
.painel-controle input:focus,.painel-controle textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(219,39,119,.12)}
.contador-colaboradores{font-size:10px;font-weight:700;color:var(--primary);text-transform:none}
.contador-colaboradores.aviso{color:var(--danger)}
.acoes-textarea{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.botoes-painel{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{cursor:pointer;padding:7px 14px;font-size:11px;font-weight:700;border:none;border-radius:6px;color:#fff;display:inline-flex;align-items:center;gap:5px;transition:filter .15s,transform .05s;text-decoration:none}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn-sm{padding:4px 9px;font-size:10px;border-radius:4px}
.btn-pink{background:var(--primary)}.btn-renumerar{background:#ea580c}.btn-salvar{background:#2563eb}.btn-carregar{background:#0891b2}.btn-exportar{background:#4f46e5}
.btn-copia-cola{background:#db2777}
.btn-subir{background:#059669}
.btn-baixar{background:#0d9488}
.btn-limpar{background:var(--s100);color:var(--s600);border:1px solid var(--s300)}
.btn-voltar{background:var(--s600)}.btn-imprimir{background:var(--s900);margin-left:auto}
.dica{font-size:10px;color:var(--s600);margin-top:8px}
.barra-zoom{background:var(--primary-light);padding:6px 14px;max-width:1200px;margin:0 auto 10px;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:11px;font-weight:700;color:#9d174d;border:1px solid #fbcfe8}
.btn-zoom{background:#fff;border:1px solid var(--primary-border);padding:3px 10px;border-radius:4px;cursor:pointer;font-weight:800;color:var(--primary)}
.btn-zoom:hover{background:#fdf2f8}
.folha-a4{width:100%;max-width:1200px;background:#fff;padding:14px 16px;margin:0 auto 20px;box-shadow:0 10px 30px rgba(219,39,119,.08);border-radius:10px;border:1px solid var(--primary-border)}
.rolagem{overflow-x:auto}
.rolagem>table{min-width:1000px}
.barra-controle-folha{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;background:var(--primary-bg);padding:5px 10px;border:1px solid #fbcfe8;border-radius:6px}
.btn-linha-topo{border-radius:4px;font-size:10px;font-weight:700;padding:3px 8px;cursor:pointer;background:#fff;border:1px solid var(--primary);color:var(--primary)}
.cabecalho-container,.info-ferias-bar,table.tabela-ferias{width:100%;border-collapse:collapse;border:1.2px solid var(--s900);margin-bottom:4px;table-layout:fixed}
.cabecalho-container td,.info-ferias-bar td{border:1px solid var(--s700);padding:3px 8px;vertical-align:middle;text-align:center}
.logo-box{width:90px;font-weight:900;font-size:16px;color:#007e7a;letter-spacing:1.5px;background:var(--s50)}
.titulo-box{font-size:11px;font-weight:800;text-transform:uppercase;padding:0 10px}
.meta-box{width:130px;font-size:8.5px;text-align:left!important;padding-left:8px!important;background:var(--s50);line-height:1.35}
.info-ferias-bar{font-size:8.5px;font-weight:700;background:var(--s50)}
.info-ferias-bar td{text-align:left;padding:2px 8px}
.campo-editavel{outline:none;display:inline-block;min-width:25px;font-weight:600}
table.tabela-ferias{border:1.5px solid var(--primary)}
table.tabela-ferias th,table.tabela-ferias td{border:1px solid var(--primary-border);text-align:center;vertical-align:middle;font-size:8.5px;height:24px;padding:1px}
table.tabela-ferias th{background:var(--primary);color:#fff;font-weight:800;text-transform:uppercase}
table.tabela-ferias tbody tr:hover{background:#fff7fa}
.col-id{width:38px;background:var(--primary-bg);font-weight:800;color:#831843}
.col-id-texto{outline:none;font-size:9px;font-weight:800;color:#831843;display:inline-block;width:100%;text-align:center}
.col-nome{background:var(--primary-light)!important;width:220px}
.col-nome-container{display:flex;align-items:center;justify-content:space-between;padding:0 6px;width:100%;gap:4px}
.col-nome-texto{flex-grow:1;text-align:left;outline:none;white-space:nowrap;overflow:hidden;font-size:9px;font-weight:700;color:#831843;text-transform:uppercase;min-height:11px}
.celula-ferias{outline:none;font-size:8px;font-weight:700;background:#fff}
.celula-ferias:focus{background:#fdf2f8;box-shadow:inset 0 0 0 1.5px var(--primary)}
.celula-ferias.invalida{background:#fee2e2;color:var(--danger)}
.col-saldo{width:45px;font-weight:800;background:var(--primary-bg);outline:none;color:#831843;font-size:9px}
.col-saldo:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--primary)}
.botoes-acoes{display:flex;gap:2px;opacity:.3;transition:opacity .2s}
tr:hover .botoes-acoes,tr:focus-within .botoes-acoes{opacity:1}
.btn-acao{background:rgba(219,39,119,.1);border:1px solid rgba(219,39,119,.3);border-radius:3px;cursor:pointer;padding:1px 3px;font-size:8px;color:#831843}
.btn-mais-linha{color:var(--success);font-weight:900}.btn-menos-linha{color:var(--accent);font-weight:900}.btn-lixeira{color:var(--danger)}
@media(max-width:800px){.campos-painel{grid-template-columns:1fr}.btn-imprimir{margin-left:0}}

/* ========================================================
   IMPRESSÃO: OCUPAR 100% DA FOLHA A4 PAISAGEM SEM CORTES
   ======================================================== */
@media print {
  @page {
    size: 297mm 210mm landscape;
    margin: 4mm 5mm 3mm 5mm !important;
  }
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: #fff !important;
    width: 287mm !important;
    height: 203mm !important;
    max-height: 203mm !important;
    overflow: hidden !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  .painel-controle, .barra-zoom, .barra-controle-folha, .botoes-acoes, #toastNotificacao, input[type=file] {
    display: none !important;
  }
  #contentorFolhasFerias {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
  }
  .folha-a4 {
    box-shadow: none !important;
    border: none !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
    height: 100% !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: flex-start !important;
    page-break-inside: avoid !important;
    break-inside: avoid !important;
    page-break-after: avoid !important;
    break-after: avoid !important;
  }
  .rolagem {
    overflow: visible !important;
    width: 100% !important;
    flex-grow: 1 !important;
    display: flex !important;
    flex-direction: column !important;
  }
  .rolagem > table {
    min-width: 100% !important;
    width: 100% !important;
  }
  .cabecalho-container {
    height: 28px !important;
    margin-bottom: 2px !important;
    width: 100% !important;
  }
  .cabecalho-container td {
    padding: 1px 4px !important;
    line-height: 1.1 !important;
  }
  .info-ferias-bar {
    height: 20px !important;
    margin-bottom: 2px !important;
    width: 100% !important;
  }
  .info-ferias-bar td {
    padding: 1px 4px !important;
    font-size: 7.5px !important;
  }
  .logo-box { font-size: 13px !important; width: 70px !important; }
  .titulo-box { font-size: 9.5px !important; }
  .meta-box { font-size: 7.5px !important; width: 105px !important; }
  
  table.tabela-ferias {
    width: 100% !important;
    border-collapse: collapse !important;
    table-layout: fixed !important;
    margin-bottom: 0 !important;
  }
  table.tabela-ferias thead tr:first-child th {
    height: 14px !important;
    font-size: 7.5px !important;
    padding: 0.5px !important;
  }
  table.tabela-ferias thead tr:nth-child(2) th {
    height: 11px !important;
    font-size: 6.5px !important;
    padding: 0.5px !important;
  }
  
  /* Altura dinâmica calculada pelo script via variável CSS */
  table.tabela-ferias tbody tr {
    height: var(--altura-linha-print, 18px) !important;
  }
  table.tabela-ferias td {
    font-size: var(--fonte-print, 7.5px) !important;
    padding: 0 1px !important;
    line-height: 1 !important;
  }
  .col-id { width: 24px !important; }
  .col-id-texto { font-size: var(--fonte-print, 7.5px) !important; }
  .col-nome { width: 180px !important; }
  .col-nome-container { padding: 0 2px !important; }
  .col-nome-texto { font-size: var(--fonte-print, 7.5px) !important; }
  .celula-ferias { font-size: var(--fonte-print, 7px) !important; }
  .col-saldo { width: 32px !important; font-size: var(--fonte-print, 7.5px) !important; }
  table.tabela-ferias tbody tr:hover { background: inherit !important; }
}
</style>
</head>
<body>
<div id="toastNotificacao" role="status" aria-live="polite">Mensagem</div>
<input type="file" id="arquivoBackupFerias" style="display:none" accept=".json" onchange="processarArquivoBackup(this)">
<input type="file" id="arquivoListaTxtFerias" style="display:none" accept=".txt,.csv" onchange="processarArquivoListaTxt(this)">

<div class="painel-controle">
  <div class="topo-modulo-info">
    <span class="badge-modulo">Módulo 3: Cronograma de Férias <span class="tag-v06">v07</span></span>
    <a href="index.html" class="btn btn-voltar">⬅ Voltar ao Menu</a>
  </div>
  <div class="campos-painel">
    <div class="campo-grupo"><label for="anoInputFerias">Ano:</label><input type="text" id="anoInputFerias" value="2026" inputmode="numeric" oninput="sincronizarCabecalhosFerias()"></div>
    <div class="campo-grupo"><label for="areaInputFerias">Área / Gerência:</label><input type="text" id="areaInputFerias" placeholder="Operação / Mina" oninput="sincronizarCabecalhosFerias()"></div>
    <div class="campo-grupo"><label for="turnoInputFerias">Setor / Turno:</label><input type="text" id="turnoInputFerias" placeholder="Turno A" oninput="sincronizarCabecalhosFerias()"></div>
  </div>
  <div class="campo-grupo">
    <label for="nomesInputFerias"><span>Lista de Colaboradores (Sequência Única 1 ao Fim):</span><span id="contadorColaboradores" class="contador-colaboradores">0 colaborador(es)</span></label>
    <textarea id="nomesInputFerias" oninput="atualizarContadorNomes()" placeholder="COLE OS NOMES AQUI (UM POR LINHA)..."></textarea>
    
    <div class="acoes-textarea">
      <button type="button" class="btn btn-copia-cola btn-sm" onclick="colarDaAreaDeTransferencia()">📋 Colar</button>
      <button type="button" class="btn btn-limpar btn-sm" onclick="copiarListaNomes()">📄 Copiar</button>
      <button type="button" class="btn btn-baixar btn-sm" onclick="baixarListaNomesTxt()">📥 Baixar Nomes (.txt)</button>
      <button type="button" class="btn btn-subir btn-sm" onclick="document.getElementById('arquivoListaTxtFerias').click()">📂 Carregar (.txt)</button>
      <button type="button" class="btn btn-limpar btn-sm" onclick="limparApenasListaNomes()">✕ Limpar Campo</button>
    </div>
  </div>
  <div class="botoes-painel">
    <button type="button" class="btn btn-pink" onclick="gerarTabelaPorNomes()">Atualizar Tabela Única (A-Z)</button>
    <button type="button" class="btn btn-renumerar" onclick="reordenarNumFerias(true)">🔢 Renumerar</button>
    <button type="button" class="btn btn-salvar" onclick="salvarTudoFerias()">💾 Salvar</button>
    <button type="button" class="btn btn-carregar" onclick="carregarTudoFerias()">📂 Carregar</button>
    <button type="button" class="btn btn-exportar" onclick="exportarBackupJSON()">⬇️ Backup</button>
    <button type="button" class="btn btn-exportar" onclick="document.getElementById('arquivoBackupFerias').click()">⬆️ Restaurar</button>
    <button type="button" class="btn btn-limpar" onclick="limparTudoFerias()">Limpar</button>
    <button type="button" class="btn btn-imprimir" onclick="prepararEImprimir()">🖨️ Imprimir</button>
  </div>
  <p class="dica">💡 A altura das linhas se ajusta automaticamente para preencher 1 folha inteira sem cortar, independente da quantidade de colaboradores.</p>
</div>

<div class="barra-zoom">
  <span>Zoom na tela:</span>
  <button class="btn-zoom" onclick="mudarZoom(-0.05)">➖ Reduzir</button>
  <button class="btn-zoom" onclick="resetZoom()">100%</button>
  <button class="btn-zoom" onclick="mudarZoom(0.05)">➕ Ampliar</button>
</div>

<div id="contentorFolhasFerias"></div>

<script>
const CHAVE = 'valeferias_v07_single';
const DADOS_F_INICIAIS = [
  "MARIANA PEREIRA CRUZ","RICARDO GONCALVES DE MELLO LEITE","JOAO SILVA RAMOS","ALFREDO AUGUSTO RAMOS NETO",
  "MARCOS AURELIO CATALLARES MATTOS","VANDERSON TEIXEIRA","BRUNO RICARDO","GABRIEL CARNEIRO",
  "GLEIVSTON SILVA MENDES","ROBSON DE SOUZA MENDONCA","PAULO HENRIQUE","BRUNO GOMES FIDELIS",
  "ATMISTO SILVA","CAIO HENRIQUE","PABLO MESQUITA","DAVID MARCELO DELGADO DOS SANTOS",
  "DOMINIQUE SILVA","RICHARD SILVA","EMERSON RIBEIRO DOS SANTOS","ALLAN SOUZA DE CARVALHO","TITO DACAL"];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const $ = id => document.getElementById(id);
const pad = n => n < 10 ? '0' + n : '' + n;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let nivelZoom = 1, _toast, _auto;

function mostrarToast(msg) {
  const t = $('toastNotificacao'); t.innerText = msg; t.classList.add('ativo');
  clearTimeout(_toast); _toast = setTimeout(() => t.classList.remove('ativo'), 2600);
}

function aplicarZoom() { document.querySelectorAll('.folha-a4').forEach(f => { f.style.zoom = nivelZoom; f.style.transform = ''; }); }
function mudarZoom(v) { nivelZoom = Math.round(Math.min(Math.max(nivelZoom + v, 0.7), 1.3) * 100) / 100; aplicarZoom(); }
function resetZoom() { nivelZoom = 1; aplicarZoom(); }

const valorCampo = (id, p) => $(id).value.trim() || p;
function sincronizarCabecalhosFerias() {
  const v = { '.val-ano': valorCampo('anoInputFerias','2026'), '.val-area': valorCampo('areaInputFerias','---'), '.val-turno': valorCampo('turnoInputFerias','---') };
  document.querySelectorAll('#contentorFolhasFerias .folha-a4').forEach(f => { for (const k in v) { const el = f.querySelector(k); if (el) el.innerText = v[k]; } });
  agendarAutoSave();
}

function normalizarLinhasTexto(txt) {
  return txt.split(/\r?\n/).map(l => l.replace(/[\t;]/g, ' ').trim().replace(/\s+/g, ' ')).filter(Boolean);
}

function lerNomes() {
  return normalizarLinhasTexto($('nomesInputFerias').value.toUpperCase());
}

function atualizarContadorNomes() {
  const ta = $('nomesInputFerias');
  const nomes = lerNomes(), total = nomes.length, dup = total - new Set(nomes).size;
  const c = $('contadorColaboradores');
  c.innerText = `${total} colaborador(es)` + (dup ? ` | ⚠ ${dup} repetido(s)` : '');
  c.classList.toggle('aviso', dup > 0);
}

/* Ajusta dinamicamente a altura e fonte das linhas para caber exatamente em 1 página antes de abrir o print */
function ajustarDimensoesParaPrint() {
  const totalLinhas = document.querySelectorAll('#contentorFolhasFerias .corpo-tabela-ferias tr').length;
  if (!totalLinhas) return;
  
  // Altura útil vertical da A4 (aproximadamente 145mm livres para o corpo da tabela)
  const alturaTotalMm = 146;
  const alturaLinhaMm = (alturaTotalMm / totalLinhas).toFixed(2);
  
  document.documentElement.style.setProperty('--altura-linha-print', `${alturaLinhaMm}mm`);
  
  // Reduz a fonte proporcionalmente se houver muitos colaboradores
  let fonte = '7.5px';
  if (totalLinhas > 30) fonte = '6.5px';
  if (totalLinhas > 38) fonte = '5.8px';
  document.documentElement.style.setProperty('--fonte-print', fonte);
}

function prepararEImprimir() {
  ajustarDimensoesParaPrint();
  window.print();
}

window.addEventListener('beforeprint', ajustarDimensoesParaPrint);

async function colarDaAreaDeTransferencia() {
  try {
    const texto = await navigator.clipboard.readText();
    if (!texto.trim()) { mostrarToast('Área de transferência vazia.'); return; }
    const linhas = normalizarLinhasTexto(texto.toUpperCase());
    $('nomesInputFerias').value = linhas.join('\n');
    atualizarContadorNomes();
    mostrarToast(`${linhas.length} nome(s) colado(s)!`);
    agendarAutoSave();
  } catch (err) { mostrarToast('Clique na caixa e use Ctrl+V.'); }
}

async function copiarListaNomes() {
  const nomes = lerNomes();
  if (!nomes.length) { mostrarToast('Nenhum nome para copiar.'); return; }
  try {
    await navigator.clipboard.writeText(nomes.join('\n'));
    mostrarToast(`${nomes.length} nome(s) copiado(s)!`);
  } catch (e) { mostrarToast('Falha ao copiar.'); }
}

function baixarListaNomesTxt() {
  const nomes = lerNomes();
  if (!nomes.length) { mostrarToast('Nenhum nome para baixar.'); return; }
  const blob = new Blob([nomes.join('\r\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url;
  a.download = `colaboradores_ferias_${$('anoInputFerias').value.trim() || '2026'}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  mostrarToast('Arquivo .txt baixado!');
}

function processarArquivoListaTxt(input) {
  const file = input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    const linhas = normalizarLinhasTexto(e.target.result.toUpperCase());
    if (!linhas.length) { mostrarToast('Arquivo vazio ou sem nomes válidos.'); return; }
    $('nomesInputFerias').value = linhas.join('\n');
    atualizarContadorNomes();
    mostrarToast(`${linhas.length} nome(s) carregado(s)!`);
    agendarAutoSave();
  };
  r.readAsText(file);
  input.value = '';
}

function limparApenasListaNomes() {
  $('nomesInputFerias').value = '';
  atualizarContadorNomes();
  agendarAutoSave();
  mostrarToast('Lista de nomes limpa.');
}

function criarLinhaFerias(numStr, nome = '') {
  const tds = '<td class="celula-ferias" contenteditable="true" title="Data (4 números = dd/mm)"></td>'.repeat(24);
  return `<td class="col-id"><span class="col-id-texto" contenteditable="true">${numStr}</span></td>` +
    `<td class="col-nome"><div class="col-nome-container"><span class="col-nome-texto" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()">${esc(nome)}</span>` +
    `<div class="botoes-acoes"><button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaAbaixoFerias(this)" title="Adicionar linha abaixo">➕</button><button type="button" class="btn-acao btn-menos-linha" onclick="removerLinhaFerias(this)" title="Remover linha">➖</button><button type="button" class="btn-acao btn-lixeira" onclick="apagarLinhaFerias(this)" title="Apagar nome">🗑️</button></div></div></td>` +
    tds + '<td class="col-saldo" contenteditable="true" title="Saldo de dias">-</td>';
}
function apagarLinhaFerias(b) { b.closest('tr').querySelector('.col-nome-texto').innerText = ''; agendarAutoSave(); }
function adicionarLinhaAbaixoFerias(b) { const tr = document.createElement('tr'); tr.innerHTML = criarLinhaFerias('00'); b.closest('tr').after(tr); reordenarNumFerias(); }
function adicionarLinhaFimFerias(b) { const tr = document.createElement('tr'); tr.innerHTML = criarLinhaFerias('00'); b.closest('.folha-a4').querySelector('.corpo-tabela-ferias').appendChild(tr); reordenarNumFerias(); }
function removerLinhaFerias(b) { const tr = b.closest('tr'); if (tr.parentNode.querySelectorAll('tr').length > 1) { tr.remove(); reordenarNumFerias(); } }

function reordenarNumFerias(notificar = false) {
  let contadorGeral = 1;
  document.querySelectorAll('#contentorFolhasFerias .corpo-tabela-ferias tr .col-id-texto').forEach(s => {
    s.innerText = pad(contadorGeral++);
  });
  if (notificar) mostrarToast('Numeração sequencial atualizada!');
  agendarAutoSave();
}

function criarTabelaFeriasHTML(nomes) {
  const lista = nomes.length ? nomes : [''];
  const linhas = lista.map((n, i) => `<tr>${criarLinhaFerias(pad(i + 1), n)}</tr>`).join('');
  const f = document.createElement('div'); f.className = 'folha-a4'; f.style.zoom = nivelZoom;
  f.innerHTML = `
  <div class="barra-controle-folha">
    <button type="button" class="btn-linha-topo" onclick="adicionarLinhaFimFerias(this)">➕ Adicionar Linha no Fim</button>
  </div>
  <div class="rolagem">
  <table class="cabecalho-container"><tr><td class="logo-box">VALE</td><td class="titulo-box">CRONOGRAMA ANUAL DE CONTROLE DE FÉRIAS DA EQUIPE</td>
    <td class="meta-box"><strong>Ano:</strong> <span class="val-ano">${esc(valorCampo('anoInputFerias','2026'))}</span><br><span><strong>Folha:</strong> 01 / 01</span></td></tr></table>
  <table class="info-ferias-bar"><tr>
    <td><strong>Área / Gerência:</strong> <span class="val-area campo-editavel" contenteditable="true">${esc(valorCampo('areaInputFerias','---'))}</span></td>
    <td><strong>Setor / Turno:</strong> <span class="val-turno campo-editavel" contenteditable="true">${esc(valorCampo('turnoInputFerias','---'))}</span></td></tr></table>
  <table class="tabela-ferias"><thead>
    <tr><th rowspan="2" style="width:38px">Nº</th><th rowspan="2" style="width:220px">COLABORADOR</th>${MESES.map(m => `<th colspan="2">${m}</th>`).join('')}<th rowspan="2" style="width:45px">Saldo</th></tr>
    <tr style="font-size:7px">${'<th>Ini</th><th>Fim</th>'.repeat(12)}</tr>
  </thead><tbody class="corpo-tabela-ferias">${linhas}</tbody></table></div>`;
  return f;
}

function temDadosPreenchidos() {
  return [...$('contentorFolhasFerias').querySelectorAll('.celula-ferias,.col-nome-texto')].some(e => e.innerText.trim()) ||
         [...$('contentorFolhasFerias').querySelectorAll('.col-saldo')].some(e => !['', '-'].includes(e.innerText.trim()));
}

function gerarTabelaPorNomes() {
  if (temDadosPreenchidos() && !confirm('Atualizar a tabela vai substituir os dados atuais. Continuar?')) return;
  const nomes = lerNomes().sort((a, b) => a.localeCompare(b, 'pt-BR'));
  $('nomesInputFerias').value = nomes.join('\n');
  atualizarContadorNomes();
  const box = $('contentorFolhasFerias');
  box.innerHTML = '';
  box.appendChild(criarTabelaFeriasHTML(nomes));
  reordenarNumFerias();
  agendarAutoSave();
  mostrarToast('Tabela única gerada com sucesso!');
}

function obterEstadoCompleto() {
  return { ano: $('anoInputFerias').value, area: $('areaInputFerias').value, turno:$('turnoInputFerias').value, nomes: $('nomesInputFerias').value, html:$('contentorFolhasFerias').innerHTML };
}
function gravar(silencioso) {
  try { localStorage.setItem(CHAVE, JSON.stringify(obterEstadoCompleto())); if (!silencioso) mostrarToast('Salvo com sucesso!'); }
  catch (e) { mostrarToast('Não foi possível salvar.'); }
}
function salvarTudoFerias() { gravar(false); }
function agendarAutoSave() { clearTimeout(_auto); _auto = setTimeout(() => gravar(true), 1200); }
function lerSalvo() { try { const s = localStorage.getItem(CHAVE); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function carregarTudoFerias() {
  const d = lerSalvo();
  if (!d) { mostrarToast('Nenhum dado salvo encontrado.'); return; }
  restaurarEstado(d); mostrarToast('Carregado com sucesso!');
}
function restaurarEstado(d) {
  const map = { ano:'anoInputFerias', area:'areaInputFerias', turno:'turnoInputFerias', nomes:'nomesInputFerias' };
  for (const k in map) if (d[k] !== undefined) $(map[k]).value = d[k];
  if (d.html !== undefined) $('contentorFolhasFerias').innerHTML = d.html;
  if (!document.querySelector('#contentorFolhasFerias .folha-a4')) {
    const box = $('contentorFolhasFerias'); box.innerHTML = '';
    box.appendChild(criarTabelaFeriasHTML([]));
  }
  aplicarZoom(); atualizarContadorNomes(); reordenarNumFerias();
}
function exportarBackupJSON() {
  const blob = new Blob([JSON.stringify(obterEstadoCompleto(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = `backup_ferias_${$('anoInputFerias').value.trim() || '2026'}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  mostrarToast('Backup exportado com sucesso!');
}
function processarArquivoBackup(input) {
  const file = input.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (typeof d !== 'object' || d === null || (d.html === undefined && d.nomes === undefined)) throw 0;
      restaurarEstado(d); mostrarToast('Backup restaurado com sucesso!');
    } catch (err) { mostrarToast('Arquivo inválido.'); }
  };
  r.readAsText(file); input.value = '';
}
function limparTudoFerias() {
  if (!confirm('Apagar tabela e dados?')) return;
  $('nomesInputFerias').value = ''; atualizarContadorNomes();
  const box = $('contentorFolhasFerias'); box.innerHTML = '';
  box.appendChild(criarTabelaFeriasHTML([]));
  reordenarNumFerias(); agendarAutoSave();
  mostrarToast('Área resetada.');
}

function validaData(t) {
  const m = t.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if (!m) return false;
  const d = +m[1], mes = +m[2];
  return mes >= 1 && mes <= 12 && d >= 1 && d <= new Date(2024, mes, 0).getDate();
}
const caixa = $('contentorFolhasFerias');
caixa.addEventListener('focusout', e => {
  const c = e.target;
  if (!c.classList || !c.classList.contains('celula-ferias')) return;
  let t = c.innerText.trim();
  if (/^\d{4}$/.test(t)) { t = t.slice(0, 2) + '/' + t.slice(2); c.innerText = t; agendarAutoSave(); }
  c.classList.toggle('invalida', !!t && !validaData(t));
});
caixa.addEventListener('paste', e => {
  if (!e.target.isContentEditable) return;
  e.preventDefault();
  document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text').replace(/\s*\n\s*/g, ' '));
});
caixa.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key !== 'Enter' || !t.isContentEditable) return;
  e.preventDefault();
  const tr = t.closest('tr'), prox = tr && tr.nextElementSibling;
  const cls = ['celula-ferias', 'col-nome-texto', 'col-saldo', 'col-id-texto'].find(c => t.classList.contains(c));
  if (prox && cls) {
    const alvo = prox.querySelectorAll('.' + cls)[[...tr.querySelectorAll('.' + cls)].indexOf(t)];
    if (alvo) { alvo.focus(); return; }
  }
  t.blur();
});
caixa.addEventListener('dblclick', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('celula-ferias') && !t.innerText.trim()) {
    const d = new Date(); t.innerText = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; agendarAutoSave();
  }
});
caixa.addEventListener('input', agendarAutoSave);
window.addEventListener('beforeunload', () => gravar(true));

window.onload = function () {
  const d = lerSalvo();
  if (d && d.html) { restaurarEstado(d); mostrarToast('Último trabalho recuperado.'); }
  else {
    const ordenados = [...DADOS_F_INICIAIS].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    $('nomesInputFerias').value = ordenados.join('\n');
    atualizarContadorNomes();
    const box = $('contentorFolhasFerias');
    box.innerHTML = '';
    box.appendChild(criarTabelaFeriasHTML(ordenados));
    reordenarNumFerias();
  }
};
</script>
</body>
</html>
