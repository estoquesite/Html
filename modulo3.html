<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Módulo 3 - Cronograma de Férias | Portal Vale v02</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f0f4f8; color: #1e293b; min-height: 100vh; padding: 16px; }

.painel-controle { background: #ffffff; padding: 18px 22px; margin: 0 auto 16px auto; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; }
.topo-modulo-info { display: flex; align-items: center; gap: 8px; }
.badge-modulo { background: linear-gradient(135deg, #b91c1c, #991b1b); color: #fff; font-size: 11.5px; font-weight: 800; padding: 5px 12px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
.tag-v02 { background-color: #f59e0b; color: #fff; font-weight: 800; font-size: 10px; padding: 2px 7px; border-radius: 4px; margin-left: 6px; }

.botoes-painel { display: flex; gap: 8px; align-items: center; }
.btn { cursor: pointer; padding: 7px 14px; font-size: 11px; font-weight: 700; border: none; border-radius: 6px; color: #fff; display: inline-flex; align-items: center; gap: 5px; }
.btn-vinho { background-color: #991b1b; } 
.btn-voltar { background-color: #475569; text-decoration: none; } 
.btn-imprimir { background-color: #0f172a; }

.barra-zoom { background: #e2e8f0; padding: 6px 14px; max-width: 1200px; margin: 0 auto 8px auto; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 11px; font-weight: 700; color: #475569; }
.btn-zoom { background: #fff; border: 1px solid #cbd5e1; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-weight: 800; color: #1e293b; }
.btn-zoom:hover { background: #f1f5f9; }

.folha-a4 { width: 100%; max-width: 1200px; background: #fff; padding: 16px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border-radius: 10px; border: 1px solid #e2e8f0; transform-origin: top center; transition: transform 0.1s ease; }

table.tabela-ferias { width: 100%; border-collapse: collapse; border: 1.5px solid #334155; table-layout: fixed; }
table.tabela-ferias th, table.tabela-ferias td { border: 1px solid #475569; text-align: center; vertical-align: middle; font-size: 8px; height: 26px; padding: 1px; }
table.tabela-ferias th { background-color: #f59e0b; color: #0f172a; font-weight: 800; text-transform: uppercase; }

.col-mes { width: 50px; background: #991b1b; color: #fff; font-weight: 800; }
.col-nome-container { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; width: 100%; }
.col-nome-texto { flex-grow: 1; text-align: left; outline: none; white-space: nowrap; overflow: hidden; font-size: 8.5px; font-weight: 700; color: #fff; text-transform: uppercase; }
.col-saldo { width: 45px; font-weight: 800; background: #f8fafc; }

.botoes-acoes { display: flex; align-items: center; gap: 2px; opacity: 0.3; transition: opacity 0.2s; }
tr:hover .botoes-acoes { opacity: 1; }
.btn-acao { background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5); border-radius: 3px; cursor: pointer; padding: 1px 4px; font-size: 8px; color: #fff; }
.btn-lixeira { color: #fecaca; }

@media print {
    @page { size: A4 landscape; margin: 3mm 4mm; }
    body { background: #fff !important; padding: 0 !important; }
    .painel-controle, .barra-zoom, .botoes-acoes { display: none !important; }
    .folha-a4 { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; transform: none !important; }
}
</style>
</head>
<body>

    <div class="painel-controle">
        <div class="topo-modulo-info">
            <span class="badge-modulo">Módulo 3: Cronograma de Férias <span class="tag-v02">v02</span></span>
        </div>
        <div class="botoes-painel">
            <button type="button" class="btn btn-vinho" onclick="addLinhaFerias()">➕ Adicionar</button>
            <button type="button" class="btn btn-imprimir" onclick="window.print()">🖨️ Imprimir</button>
            <a href="index.html" class="btn btn-voltar">⬅ Menu</a>
        </div>
    </div>

    <div class="barra-zoom">
        <span>Ajustar Tamanho (Zoom):</span>
        <button class="btn-zoom" onclick="mudarZoom(-0.1)">➖ Reduzir</button>
        <button class="btn-zoom" onclick="resetZoom()">100%</button>
        <button class="btn-zoom" onclick="mudarZoom(0.1)">➕ Ampliar</button>
    </div>

    <div class="folha-a4">
        <div style="background: linear-gradient(135deg, #007e7a, #005a57); color: #fff; text-align: center; font-weight: 900; font-size: 11px; padding: 6px; border-radius: 6px; margin-bottom: 6px; letter-spacing: 0.5px;">CRONOGRAMA ANUAL DE FÉRIAS 2026</div>
        
        <table class="tabela-ferias">
            <thead>
                <tr>
                    <th rowspan="2" style="width:55px;">MÊS</th>
                    <th rowspan="2" style="width:220px;">PESSOAS (COLABORADOR)</th>
                    <th colspan="2">Jan</th><th colspan="2">Fev</th><th colspan="2">Mar</th><th colspan="2">Abr</th><th colspan="2">Mai</th><th colspan="2">Jun</th>
                    <th colspan="2">Jul</th><th colspan="2">Ago</th><th colspan="2">Set</th><th colspan="2">Out</th><th colspan="2">Nov</th><th colspan="2">Dez</th>
                    <th rowspan="2" style="width:45px;">Saldo</th>
                </tr>
                <tr style="font-size:6.5px;">
                    <th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th>
                    <th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th><th>Ini</th><th>Fim</th>
                </tr>
            </thead>
            <tbody id="corpoFerias"></tbody>
        </table>
    </div>

    <script>
        let nivelZoom = 1.0;
        function mudarZoom(valor) {
            nivelZoom = Math.min(Math.max(nivelZoom + valor, 0.6), 1.4);
            document.querySelector('.folha-a4').style.transform = `scale(${nivelZoom})`;
        }
        function resetZoom() {
            nivelZoom = 1.0;
            document.querySelector('.folha-a4').style.transform = `scale(1)`;
        }

        const DADOS_F = [
            {m:"JAN", n:"MARIANA PEREIRA CRUZ"}, {m:"JAN", n:"RICARDO GONCALVES DE MELLO LEITE"},
            {m:"JAN", n:"JOAO SILVA RAMOS"}, {m:"JAN", n:"ALFREDO AUGUSTO RAMOS NETO"},
            {m:"FEV", n:"MARCOS AURELIO CATALLARES MATTOS"}, {m:"FEV", n:"VANDERSON TEIXEIRA"},
            {m:"FEV", n:"BRUNO RICARDO"}, {m:"FEV", n:"GABRIEL CARNEIRO"},
            {m:"MAR", n:"GLEIVSTON SILVA MENDES"}, {m:"JUN", n:"ROBSON DE SOUZA MENDONCA"},
            {m:"JUN", n:"PAULO HENRIQUE"}, {m:"JUL", n:"BRUNO GOMES FIDELIS"},
            {m:"JUL", n:"ATMISTO SILVA"}, {m:"AGOSTO", n:"CAIO HENRIQUE"},
            {m:"AGOSTO", n:"PABLO MESQUITA"}, {m:"AGOSTO", n:"DAVID MARCELO DELGADO DOS SANTOS"},
            {m:"NOV", n:"DOMINIQUE SILVA"}, {m:"NOV", n:"RICHARD SILVA"},
            {m:"DEZ", n:"EMERSON RIBEIRO DOS SANTOS"}, {m:"DEZ", n:"ALLAN SOUZA DE CARVALHO"},
            {m:"DEZ", n:"TITO DACAL"}
        ];

        function addLinhaFerias(m='', n='') {
            const corpo = document.getElementById('corpoFerias');
            const tr = document.createElement('tr');
            let tds = ''; for(let i=0; i<24; i++) tds += `<td contenteditable="true" title="Clique para editar"></td>`;
            tr.innerHTML = `<td class="col-mes" contenteditable="true">${m}</td>` +
                `<td class="col-nome" style="background:#991b1b;"><div class="col-nome-container"><span class="col-nome-texto" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()">${n}</span><div class="botoes-acoes"><button type="button" class="btn-acao btn-lixeira" onclick="removerLinhaFerias(this)" title="Remover linha">🗑️</button></div></div></td>` +
                tds + `<td class="col-saldo" contenteditable="true">-</td>`;
            corpo.appendChild(tr);
        }

        function removerLinhaFerias(btn) {
            const tr = btn.closest('tr');
            if(document.querySelectorAll('#corpoFerias tr').length > 1) tr.remove();
        }

        window.onload = function() { DADOS_F.forEach(d => addLinhaFerias(d.m, d.n)); };
    </script>
</body>
</html>
