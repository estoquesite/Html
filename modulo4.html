<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Módulo 4 - Aniversariantes da Equipa | Portal Vale v04</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #fff0f5; color: #1e293b; min-height: 100vh; padding: 16px; }

/* PAINEL DE CONTROLO */
.painel-controle { background: #ffffff; padding: 18px 22px; margin: 0 auto 16px auto; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(219, 39, 119, 0.1); border: 1px solid #fbcfe8; max-width: 1000px; }
.topo-modulo-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; border-bottom: 2px solid #db2777; padding-bottom: 8px; }
.badge-modulo { background: linear-gradient(135deg, #db2777, #be185d); color: #fff; font-size: 11.5px; font-weight: 800; padding: 5px 12px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
.tag-v04 { background-color: #f59e0b; color: #fff; font-weight: 800; font-size: 10px; padding: 2px 7px; border-radius: 4px; margin-left: 6px; }

.botoes-painel { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.btn { cursor: pointer; padding: 7px 14px; font-size: 11px; font-weight: 700; border: none; border-radius: 6px; color: #fff; display: inline-flex; align-items: center; gap: 5px; }
.btn-pink { background-color: #db2777; } 
.btn-azul { background-color: #007e7a; } 
.btn-salvar { background-color: #2563eb; } 
.btn-carregar { background-color: #0284c7; } 
.btn-limpar { background-color: #fdf2f8; color: #9d174d; border: 1px solid #f472b6; } 
.btn-voltar { background-color: #475569; text-decoration: none; } 
.btn-imprimir { background-color: #0f172a; margin-left: auto; }

/* FOLHA A4 */
.folha-a4 { width: 100%; max-width: 1000px; background: #fff; padding: 20px; margin: 0 auto 20px auto; box-shadow: 0 10px 30px rgba(219, 39, 119, 0.08); border-radius: 12px; border: 1px solid #f472b6; position: relative; }

.barra-controle-folha { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #fff1f2; padding: 6px 10px; border: 1px solid #fbcfe8; border-radius: 6px; }
.btn-remover-folha { background: #fff; color: #ef4444; border: 1px solid #fca5a5; border-radius: 4px; font-size: 9px; font-weight: 700; padding: 3px 8px; cursor: pointer; }

/* CABEÇALHO */
.cabecalho-aniver { display: flex; align-items: center; justify-content: space-between; border: 1.5px solid #db2777; background: #fff1f2; margin-bottom: 14px; border-radius: 6px; overflow: hidden; }
.cab-logo { width: 110px; background: #db2777; color: #fff; font-weight: 900; font-size: 16px; text-align: center; padding: 10px; letter-spacing: 1px; }
.cab-titulo { flex-grow: 1; text-align: center; font-weight: 800; font-size: 11px; text-transform: uppercase; color: #831843; padding: 0 10px; }
.cab-meta { width: 130px; font-size: 9px; padding: 6px 10px; text-align: left; background: #fff; border-left: 1.5px solid #db2777; line-height: 1.3; }

/* BLOCOS POR MÊS (ESTILO QUADRADOS SEPARADOS) */
.bloco-mes { margin-bottom: 12px; border: 1.2px solid #db2777; border-radius: 6px; overflow: hidden; }
.bloco-mes-titulo { background-color: #db2777; color: #fff; font-weight: 800; font-size: 10px; text-transform: uppercase; padding: 5px 10px; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }

table.tabela-mes { width: 100%; border-collapse: collapse; }
table.tabela-mes th, table.tabela-mes td { border-top: 1px solid #f472b6; border-bottom: 1px solid #f472b6; text-align: center; vertical-align: middle; font-size: 9.5px; height: 28px; padding: 3px 6px; }
table.tabela-mes th { background-color: #fdf2f8; color: #831843; font-weight: 700; font-size: 9px; text-transform: uppercase; border: 1px solid #f472b6; }
table.tabela-mes tbody tr:nth-child(even) { background-color: #fff1f2; }

.col-nome-aniver { text-align: left !important; font-weight: 700; text-transform: uppercase; padding-left: 12px; border-left: 1px solid #f472b6; border-right: 1px solid #f472b6; }
.col-data-aniver { width: 180px; font-weight: 700; background: #fff; border-left: 1px solid #f472b6; border-right: 1px solid #f472b6; }
.col-acoes-aniver { width: 80px; border-left: 1px solid #f472b6; }

.botoes-acoes { display: flex; align-items: center; justify-content: center; gap: 4px; opacity: 0.3; transition: opacity 0.2s; }
tr:hover .botoes-acoes { opacity: 1; }
.btn-acao { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; padding: 2px 5px; font-size: 9px; }
.btn-mais-linha { color: #10b981; border-color: #6ee7b7; font-weight: 900; }
.btn-lixeira { color: #ef4444; border-color: #fca5a5; }

/* IMPRESSÃO COM CORES FORÇADAS */
@media print {
    @page { size: A4 portrait; margin: 10mm; }
    body { background: #fff !important; padding: 0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .painel-controle, .botoes-acoes, .barra-controle-folha, .btn-add-linha-mes { display: none !important; }
    .folha-a4 { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
    .bloco-mes-titulo { background-color: #db2777 !important; color: #fff !important; }
    table.tabela-mes th { background-color: #fdf2f8 !important; color: #831843 !important; }
}
</style>
</head>
<body>

    <div class="painel-controle">
        <div class="topo-modulo-info">
            <span class="badge-modulo">Módulo 4: Aniversariantes do Ano <span class="tag-v04">v04</span></span>
            <a href="index.html" class="btn btn-voltar">⬅ Voltar ao Menu</a>
        </div>
        <div class="botoes-painel">
            <button type="button" class="btn btn-pink" onclick="gerarEstruturaAniversarios()">Atualizar Blocos</button>
            <button type="button" class="btn btn-azul" onclick="adicionarFolhaAniver()">📄➕ Folha Extra</button>
            <button type="button" class="btn btn-salvar" onclick="salvarTudoAniver()">💾 Guardar</button>
            <button type="button" class="btn btn-carregar" onclick="carregarTudoAniver()">📂 Carregar</button>
            <button type="button" class="btn btn-limpar" onclick="limparTudoAniver()">Limpar</button>
            <button type="button" class="btn btn-imprimir" onclick="window.print()">🖨️ Imprimir</button>
        </div>
    </div>

    <div id="contentorFolhasAniver"></div>

    <script>
        const MESES_ANO = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
        
        const DADOS_INICIAIS_A = {
            "JANEIRO": ["MARIANA PEREIRA CRUZ - 11/01", "RICARDO GONCALVES DE MELLO LEITE - 13/01", "JOAO SILVA RAMOS - 18/01", "ALFREDO AUGUSTO RAMOS NETO - 22/01"],
            "FEVEREIRO": ["MARCOS AURELIO CATALLARES MATTOS - 01/02", "VANDERSON TEIXEIRA - 04/02", "BRUNO RICARDO - 07/02", "GABRIEL CARNEIRO - 07/02"],
            "MARÇO": ["GLEIVSTON SILVA MENDES - 22/03"],
            "ABRIL": [], "MAIO": [],
            "JUNHO": ["ROBSON DE SOUZA MENDONCA - 04/06", "PAULO HENRIQUE - 08/06"],
            "JULHO": ["BRUNO GOMES FIDELIS - 02/07", "ATMISTO SILVA - 20/07"],
            "AGOSTO": ["CAIO HENRIQUE - 06/08", "PABLO MESQUITA - 25/08", "DAVID MARCELO DELGADO DOS SANTOS - 26/08"],
            "SETEMBRO": [], "OUTUBRO": [],
            "NOVEMBRO": ["DOMINIQUE SILVA - 02/11", "RICHARD SILVA - 24/11"],
            "DEZEMBRO": ["EMERSON RIBEIRO DOS SANTOS - 04/12", "ALLAN SOUZA DE CARVALHO - 15/12", "TITO DACAL - 27/12"]
        };

        function criarBlocoMes(mesNome, itens) {
            let linhas = '';
            if(!itens || itens.length === 0) itens = [" - "];
            
            itens.forEach(item => {
                let partes = item.split('-');
                let nome = partes[0] ? partes[0].trim() : '';
                let data = partes[1] ? partes[1].trim() : '';
                linhas += `<tr>` +
                    `<td class="col-nome-aniver" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()">${nome}</td>` +
                    `<td class="col-data-aniver" contenteditable="true">${data}</td>` +
                    `<td class="col-acoes-aniver"><div class="botoes-acoes"><button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaBloco(this)" title="Adicionar">➕</button><button type="button" class="btn-acao btn-lixeira" onclick="removerLinhaBloco(this)" title="Apagar">🗑️</button></div></td>` +
                `</tr>`;
            });

            return `<div class="bloco-mes">
                <div class="bloco-mes-titulo">
                    <span>📅 ${mesNome}</span>
                    <button type="button" class="btn-acao btn-mais-linha btn-add-linha-mes" onclick="adicionarLinhaBlocoPorCabecalho(this)" style="background:#fff; color:#db2777; border:none; padding:2px 6px; border-radius:3px; font-weight:800; cursor:pointer;">➕ Adicionar</button>
                </div>
                <table class="tabela-mes">
                    <thead><tr><th>Nome do Colaborador</th><th>Data de Aniversário</th><th>Ações</th></tr></thead>
                    <tbody>${linhas}</tbody>
                </table>
            </div>`;
        }

        function adicionarLinhaBloco(btn) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="col-nome-aniver" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()"></td>` +
                           `<td class="col-data-aniver" contenteditable="true"></td>` +
                           `<td class="col-acoes-aniver"><div class="botoes-acoes"><button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaBloco(this)" title="Adicionar">➕</button><button type="button" class="btn-acao btn-lixeira" onclick="removerLinhaBloco(this)" title="Apagar">🗑️</button></div></td>`;
            btn.closest('tr').after(tr);
        }

        function adicionarLinhaBlocoPorCabecalho(btn) {
            const tbody = btn.closest('.bloco-mes').querySelector('tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="col-nome-aniver" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()"></td>` +
                           `<td class="col-data-aniver" contenteditable="true"></td>` +
                           `<td class="col-acoes-aniver"><div class="botoes-acoes"><button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaBloco(this)" title="Adicionar">➕</button><button type="button" class="btn-acao btn-lixeira" onclick="removerLinhaBloco(this)" title="Apagar">🗑️</button></div></td>`;
            tbody.appendChild(tr);
        }

        function removerLinhaBloco(btn) {
            const tr = btn.closest('tr');
            const tbody = tr.parentNode;
            if(tbody.querySelectorAll('tr').length > 1) tr.remove();
            else {
                tr.querySelector('.col-nome-aniver').innerText = '';
                tr.querySelector('.col-data-aniver').innerText = '';
            }
        }

        function removerFolhaAniver(btn) { 
            const folhas = document.querySelectorAll('#contentorFolhasAniver .folha-a4');
            if(folhas.length > 1) {
                btn.closest('.folha-a4').remove(); 
                atualizarPaginacaoAniver(); 
            }
        }

        function criarEstruturaFolhaAniver(dadosObj) {
            let blocosHTML = '';
            MESES_ANO.forEach(m => {
                blocosHTML += criarBlocoMes(m, dadosObj[m] || []);
            });

            const f = document.createElement('div'); f.className = 'folha-a4';
            f.innerHTML = `
                <div class="barra-controle-folha">
                    <div class="grupo-acoes-linhas"><span><strong>Cronograma de Aniversários</strong></span></div>
                    <button type="button" class="btn-remover-folha" onclick="removerFolhaAniver(this)">Remover Folha ✕</button>
                </div>
                <div class="cabecalho-aniver">
                    <div class="cab-logo">VALE</div>
                    <div class="cab-titulo">🎂 CRONOGRAMA DE ANIVERSÁRIOS DA EQUIPA - 2026</div>
                    <div class="cab-meta"><span class="indicador-folha"><strong>Folha:</strong> 01 / 01</span></div>
                </div>
                ${blocosHTML}`;
            return f;
        }

        function atualizarPaginacaoAniver() { 
            const f = document.querySelectorAll('#contentorFolhasAniver .folha-a4'); 
            f.forEach((folha, idx) => { 
                const ind = folha.querySelector('.indicador-folha'); 
                if(ind) ind.innerHTML = `<strong>Folha:</strong> 0${idx+1} / 0${f.length}`; 
            }); 
        }

        function adicionarFolhaAniver() { 
            document.getElementById('contentorFolhasAniver').appendChild(criarEstruturaFolhaAniver({})); 
            atualizarPaginacaoAniver(); 
        }

        function gerarEstruturaAniversarios() {
            const box = document.getElementById('contentorFolhasAniver'); box.innerHTML = '';
            box.appendChild(criarEstruturaFolhaAniver(DADOS_INICIAIS_A));
            atualizarPaginacaoAniver();
        }

        function salvarTudoAniver() { 
            localStorage.setItem('valeaniversarios_v04', JSON.stringify({html: document.getElementById('contentorFolhasAniver').innerHTML})); 
            alert('Aniversários Guardados com sucesso! (v04)'); 
        }
        function carregarTudoAniver() { 
            const s = localStorage.getItem('valeaniversarios_v04'); 
            if(s) { 
                document.getElementById('contentorFolhasAniver').innerHTML = JSON.parse(s).html; 
                alert('Aniversários Carregados!'); 
            } 
        }
        function limparTudoAniver() { 
            document.getElementById('contentorFolhasAniver').innerHTML = ''; 
            adicionarFolhaAniver(); 
        }

        window.onload = function() { gerarEstruturaAniversarios(); };
    </script>
</body>
</html>
