<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Módulo 4 - Aniversariantes da Equipa | Portal Vale v02</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f0f4f8; color: #1e293b; min-height: 100vh; padding: 16px; }

.painel-controle { background: #ffffff; padding: 18px 22px; margin: 0 auto 16px auto; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; }
.topo-modulo-info { display: flex; align-items: center; gap: 8px; }
.badge-modulo { background: linear-gradient(135deg, #7c3aed, #5b21b6); color: #fff; font-size: 11.5px; font-weight: 800; padding: 5px 12px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
.tag-v02 { background-color: #f59e0b; color: #fff; font-weight: 800; font-size: 10px; padding: 2px 7px; border-radius: 4px; margin-left: 6px; }

.botoes-painel { display: flex; gap: 8px; align-items: center; }
.btn { cursor: pointer; padding: 7px 14px; font-size: 11px; font-weight: 700; border: none; border-radius: 6px; color: #fff; display: inline-flex; align-items: center; gap: 5px; }
.btn-roxo { background-color: #7c3aed; } 
.btn-voltar { background-color: #475569; text-decoration: none; } 
.btn-imprimir { background-color: #0f172a; }

.folha-a4 { width: 100%; max-width: 1000px; background: #fff; padding: 20px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border-radius: 10px; border: 1px solid #e2e8f0; }

table.tabela-aniversarios { width: 100%; border-collapse: collapse; border: 1.5px solid #334155; margin-top: 10px; }
table.tabela-aniversarios th, table.tabela-aniversarios td { border: 1px solid #475569; text-align: center; vertical-align: middle; font-size: 10px; height: 32px; padding: 4px 8px; }
table.tabela-aniversarios th { background-color: #7c3aed; color: #fff; font-weight: 800; text-transform: uppercase; }

.col-mes-aniver { width: 120px; background: #f3e8ff; font-weight: 800; color: #5b21b6; }
.col-nome-aniver { text-align: left !important; font-weight: 700; text-transform: uppercase; }
.col-data-aniver { width: 120px; font-weight: 700; background: #f8fafc; }
.col-acoes-aniver { width: 60px; }

.botoes-acoes { display: flex; align-items: center; justify-content: center; gap: 4px; }
.btn-acao { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; padding: 2px 6px; font-size: 10px; }
.btn-lixeira { color: #ef4444; border-color: #fca5a5; }

@media print {
    @page { size: A4 portrait; margin: 10mm; }
    body { background: #fff !important; padding: 0 !important; }
    .painel-controle, .botoes-acoes { display: none !important; }
    .folha-a4 { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; }
}
</style>
</head>
<body>

    <div class="painel-controle">
        <div class="topo-modulo-info">
            <span class="badge-modulo">Módulo 4: Aniversariantes do Ano <span class="tag-v02">v02</span></span>
        </div>
        <div class="botoes-painel">
            <button type="button" class="btn btn-roxo" onclick="addLinhaAniversario()">➕ Adicionar</button>
            <button type="button" class="btn btn-imprimir" onclick="window.print()">🖨️ Imprimir</button>
            <a href="index.html" class="btn btn-voltar">⬅ Menu</a>
        </div>
    </div>

    <div class="folha-a4">
        <div style="background: linear-gradient(135deg, #7c3aed, #5b21b6); color: #fff; text-align: center; font-weight: 900; font-size: 13px; padding: 10px; border-radius: 6px; margin-bottom: 10px; letter-spacing: 0.5px;">🎂 CRONOGRAMA DE ANIVERSÁRIOS DA EQUIPA - 2026</div>
        
        <table class="tabela-aniversarios">
            <thead>
                <tr>
                    <th>MÊS</th>
                    <th>NOME DO COLABORADOR</th>
                    <th>DATA DE ANIVERSÁRIO</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="corpoAniversarios"></tbody>
        </table>
    </div>

    <script>
        const DADOS_A = [
            {m:"JANEIRO", n:"MARIANA PEREIRA CRUZ", v:"11/01"},
            {m:"JANEIRO", n:"RICARDO GONCALVES DE MELLO LEITE", v:"13/01"},
            {m:"JANEIRO", n:"JOAO SILVA RAMOS", v:"18/01"},
            {m:"JANEIRO", n:"ALFREDO AUGUSTO RAMOS NETO", v:"22/01"},
            {m:"FEVEREIRO", n:"MARCOS AURELIO CATALLARES MATTOS", v:"01/02"},
            {m:"FEVEREIRO", n:"VANDERSON TEIXEIRA", v:"04/02"},
            {m:"FEVEREIRO", n:"BRUNO RICARDO", v:"07/02"},
            {m:"FEVEREIRO", n:"GABRIEL CARNEIRO", v:"07/02"},
            {m:"MARÇO", n:"GLEIVSTON SILVA MENDES", v:"22/03"},
            {m:"JUNHO", n:"ROBSON DE SOUZA MENDONCA", v:"04/06"},
            {m:"JUNHO", n:"PAULO HENRIQUE", v:"08/06"},
            {m:"JULHO", n:"BRUNO GOMES FIDELIS", v:"02/07"},
            {m:"JULHO", n:"ATMISTO SILVA", v:"20/07"},
            {m:"AGOSTO", n:"CAIO HENRIQUE", v:"06/08"},
            {m:"AGOSTO", n:"PABLO MESQUITA", v:"25/08"},
            {m:"AGOSTO", n:"DAVID MARCELO DELGADO DOS SANTOS", v:"26/08"},
            {m:"NOVEMBRO", n:"DOMINIQUE SILVA", v:"02/11"},
            {m:"NOVEMBRO", n:"RICHARD SILVA", v:"24/11"},
            {m:"DEZEMBRO", n:"EMERSON RIBEIRO DOS SANTOS", v:"04/12"},
            {m:"DEZEMBRO", n:"ALLAN SOUZA DE CARVALHO", v:"15/12"},
            {m:"DEZEMBRO", n:"TITO DACAL", v:"27/12"}
        ];

        function addLinhaAniversario(m='', n='', v='') {
            const corpo = document.getElementById('corpoAniversarios');
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="col-mes-aniver" contenteditable="true">${m}</td>` +
                `<td class="col-nome-aniver" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()">${n}</td>` +
                `<td class="col-data-aniver" contenteditable="true">${v}</td>` +
                `<td class="col-acoes-aniver"><div class="botoes-acoes"><button type="button" class="btn-acao btn-lixeira" onclick="removerLinhaAniver(this)" title="Remover">🗑️</button></div></td>`;
            corpo.appendChild(tr);
        }

        function removerLinhaAniver(btn) {
            const tr = btn.closest('tr');
            if(document.querySelectorAll('#corpoAniversarios tr').length > 1) tr.remove();
        }

        window.onload = function() { DADOS_A.forEach(d => addLinhaAniversario(d.m, d.n, d.v)); };
    </script>
</body>
</html>
