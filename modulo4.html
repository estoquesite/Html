<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo 4 - Aniversariantes da Equipe | Portal Vale v07</title>
<style>
:root {
    --primary: #db2777;
    --primary-dark: #be185d;
    --primary-light: #fce7f3;
    --primary-border: #f472b6;
    --primary-bg: #fff5f8;
    --accent: #f59e0b;
    --danger: #ef4444;
    --success: #10b981;
    --slate-900: #0f172a;
    --slate-700: #334155;
    --slate-600: #475569;
    --slate-300: #cbd5e1;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
    --slate-50: #f8fafc;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
    background: #fff5f8; 
    color: var(--slate-900); 
    min-height: 100vh; 
    padding: 8px; 
}

/* NOTIFICAÇÃO TOAST */
#toastNotificacao {
    position: fixed; 
    bottom: 24px; 
    right: 24px; 
    background: var(--slate-900); 
    color: #fff;
    padding: 10px 18px; 
    border-radius: 6px; 
    font-size: 12px; 
    font-weight: 700;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.25); 
    opacity: 0; 
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease; 
    transform: translateY(12px); 
    z-index: 9999;
}
#toastNotificacao.ativo { opacity: 1; transform: translateY(0); }

/* PAINEL DE CONTROLE */
.painel-controle { 
    background: #ffffff; 
    padding: 12px 16px; 
    margin: 0 auto 10px auto; 
    border-radius: 12px; 
    box-shadow: 0 10px 25px -5px rgba(219, 39, 119, 0.08); 
    border: 1px solid #fbcfe8; 
    max-width: 980px; 
}
.topo-modulo-info { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    margin-bottom: 8px; 
    border-bottom: 2px solid var(--primary); 
    padding-bottom: 6px; 
}
.badge-modulo { 
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
    color: #fff; 
    font-size: 11px; 
    font-weight: 800; 
    padding: 4px 10px; 
    border-radius: 6px; 
    text-transform: uppercase; 
    letter-spacing: 0.8px; 
}
.tag-v07 { 
    background-color: var(--accent); 
    color: #fff; 
    font-weight: 800; 
    font-size: 9px; 
    padding: 2px 6px; 
    border-radius: 4px; 
    margin-left: 6px; 
}

.campos-painel { 
    display: grid; 
    gap: 8px; 
    margin-bottom: 6px; 
    grid-template-columns: 130px 1.5fr; 
}
.campo-grupo label { 
    display: flex;
    justify-content: space-between;
    font-weight: 700; 
    margin-bottom: 2px; 
    font-size: 10px; 
    color: #9d174d; 
    text-transform: uppercase; 
}
.painel-controle input[type="text"] { 
    width: 100%; 
    font-family: inherit; 
    font-size: 11px; 
    padding: 6px 8px; 
    border: 1px solid var(--primary-border); 
    border-radius: 6px; 
    background: var(--primary-bg); 
    outline: none; 
}
.painel-controle input[type="text"]:focus, .painel-controle textarea:focus { 
    border-color: var(--primary); 
    background: #fff; 
}
.painel-controle textarea { 
    width: 100%; 
    height: 45px; 
    font-family: inherit; 
    font-size: 11px; 
    padding: 6px 8px; 
    border: 1px solid var(--primary-border); 
    border-radius: 6px; 
    resize: vertical; 
    text-transform: uppercase; 
    background: var(--primary-bg); 
    outline: none; 
}

.barra-metricas {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
}
.card-metrica {
    background: var(--primary-bg);
    border: 1px solid #fbcfe8;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 700;
    color: #9d174d;
}

.botoes-painel { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.btn { 
    cursor: pointer; 
    padding: 6px 10px; 
    font-size: 10.5px; 
    font-weight: 700; 
    border: none; 
    border-radius: 6px; 
    color: #fff; 
    display: inline-flex; 
    align-items: center; 
    gap: 4px; 
    transition: filter 0.15s ease, transform 0.05s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }

.btn-pink { background-color: var(--primary); } 
.btn-ordenar { background-color: #ea580c; }
.btn-salvar { background-color: #2563eb; } 
.btn-carregar { background-color: #0284c7; } 
.btn-exportar { background-color: #4f46e5; }
.btn-limpar { background-color: var(--slate-100); color: var(--slate-600); border: 1px solid var(--slate-300); } 
.btn-voltar { background-color: var(--slate-600); text-decoration: none; } 
.btn-imprimir { background-color: var(--slate-900); margin-left: auto; }

/* FOLHA A4 RETRATO RIGOROSA EM 1 PÁGINA */
.folha-a4 { 
    width: 100%; 
    max-width: 980px; 
    background: #fff; 
    padding: 8px 12px; 
    margin: 0 auto 10px auto; 
    box-shadow: 0 10px 30px rgba(219, 39, 119, 0.08); 
    border-radius: 10px; 
    border: 1.5px solid var(--primary-border); 
    position: relative; 
}

/* CABEÇALHO PADRÃO VALE */
.cabecalho-container, .info-aniver-bar { 
    width: 100%; 
    border-collapse: collapse; 
    border: 1.2px solid var(--slate-900); 
    margin-bottom: 2px; 
    table-layout: fixed; 
}
.cabecalho-container td, .info-aniver-bar td { 
    border: 1px solid var(--slate-700); 
    padding: 2px 5px; 
    vertical-align: middle; 
    text-align: center; 
}
.logo-box { 
    width: 75px; 
    font-weight: 900; 
    font-size: 13px; 
    color: #007e7a; 
    letter-spacing: 1.5px;
    background-color: var(--slate-50); 
}
.titulo-box { 
    font-size: 9.5px; 
    font-weight: 800; 
    text-transform: uppercase; 
    color: var(--slate-900); 
    padding: 0 5px; 
}
.meta-box { 
    width: 110px; 
    font-size: 7.5px; 
    text-align: left !important; 
    padding-left: 5px !important; 
    background-color: var(--slate-50); 
    line-height: 1.2; 
}

.info-aniver-bar { 
    font-size: 8px; 
    font-weight: 700; 
    background-color: var(--slate-50); 
}
.info-aniver-bar td { text-align: left; padding: 1.5px 5px; }
.campo-editavel { outline: none; display: inline-block; min-width: 25px; font-weight: 600; color: var(--slate-900); }

/* CONTENTOR DOS BLOCOS */
.contentor-blocos {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 2px;
    width: 100%;
}

.bloco-mes { 
    width: 100%; 
    border: 1px solid var(--primary-border); 
    border-radius: 4px; 
    overflow: hidden; 
    background: #fff;
}
.bloco-mes.mes-atual-destaque {
    border: 1.5px solid var(--accent);
}

table.tabela-mes { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; 
}

.td-mes-nome {
    width: 120px;
    text-align: center;
    font-weight: 900;
    font-size: 9px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    border: 1px solid var(--primary-border);
    padding: 1px 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}
.mes-atual-destaque .td-mes-nome {
    background: linear-gradient(135deg, #d97706, #b45309);
}

table.tabela-mes td { 
    border: 1px solid var(--primary-border); 
    vertical-align: middle; 
    font-size: 9px; 
    height: 16px; 
    padding: 1px 4px; 
}

/* CÉLULAS EDITÁVEIS */
.col-nome-aniver { 
    text-align: left !important; 
    font-weight: 700; 
    font-size: 9px !important;
    text-transform: uppercase; 
    padding-left: 6px !important; 
    outline: none; 
    cursor: text;
    background: #fff;
    color: #0f172a;
}
.col-nome-aniver:focus, .col-data-aniver:focus {
    background-color: #fce7f3 !important;
}
.col-data-aniver { 
    width: 75px; 
    text-align: center;
    font-weight: 800; 
    font-size: 9px !important;
    background: #fff; 
    outline: none; 
    cursor: text;
    color: #9d174d;
}
.col-acoes-aniver { 
    width: 40px; 
    text-align: center;
    background: #fff;
}

.botoes-acoes { display: flex; align-items: center; justify-content: center; gap: 2px; opacity: 0.35; transition: opacity 0.2s; }
tr:hover .botoes-acoes { opacity: 1; }
.btn-acao { 
    background: var(--slate-100); 
    border: 1px solid var(--slate-300); 
    border-radius: 3px; 
    cursor: pointer; 
    padding: 1px 2px; 
    font-size: 7px; 
}
.btn-mais-linha { color: var(--success); font-weight: 900; }
.btn-lixeira { color: var(--danger); font-weight: 900; }
.btn-wpp { color: #059669; font-weight: 900; }

.tr-linha-em-branco {
    background: #ffffff;
}

/* IMPRESSÃO A4 VERTICAL RÍGIDA EM 1 PÁGINA */
@media print {
    @page { 
        size: A4 portrait; 
        margin: 2mm 3mm !important; 
    }
    html, body { 
        background: #fff !important; 
        margin: 0 !important; 
        padding: 0 !important; 
        height: 100% !important;
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important; 
    }
    .painel-controle, .botoes-acoes, .col-acoes-aniver, #toastNotificacao { 
        display: none !important; 
    }
    .folha-a4 { 
        box-shadow: none !important; 
        border: none !important; 
        width: 100% !important; 
        max-width: 100% !important; 
        padding: 0 !important; 
        margin: 0 !important; 
        page-break-after: avoid !important;
        break-after: avoid !important;
    }
    .contentor-blocos {
        gap: 1px !important;
        margin-top: 1px !important;
    }
    .bloco-mes { 
        page-break-inside: avoid !important; 
        break-inside: avoid !important; 
        margin-bottom: 1px !important;
        border-width: 1px !important;
    }
    .td-mes-nome { 
        background-color: var(--primary) !important; 
        color: #fff !important; 
        font-size: 7.5px !important;
        padding: 1px 3px !important;
    }
    table.tabela-mes td { 
        border: 1px solid #f9a8d4 !important; 
        font-size: 8px !important;
        height: 14px !important;
        line-height: 14px !important;
        padding: 0 3px !important;
    }
    .col-data-aniver {
        font-size: 8px !important;
    }
    .cabecalho-container, .info-aniver-bar {
        margin-bottom: 1px !important;
    }
    .cabecalho-container td, .info-aniver-bar td {
        padding: 1px 3px !important;
        font-size: 7px !important;
    }
    .logo-box {
        font-size: 10px !important;
        width: 50px !important;
    }
    .titulo-box {
        font-size: 8px !important;
    }
}
</style>
</head>
<body>

    <div id="toastNotificacao">Mensagem</div>
    <input type="file" id="arquivoBackupAniver" style="display:none;" accept=".json" onchange="processarArquivoBackup(this)">

    <div class="painel-controle">
        <div class="topo-modulo-info">
            <span class="badge-modulo">Módulo 4: Aniversariantes do Ano <span class="tag-v07">v07</span></span>
            <a href="index.html" class="btn btn-voltar">⬅ Voltar ao Menu</a>
        </div>
        
        <div class="barra-metricas">
            <span class="card-metrica" id="metricaTotal">🎂 Total de Aniversariantes: 0</span>
            <span class="card-metrica" id="metricaMesAtual">🎉 Aniversariantes deste Mês: 0</span>
        </div>

        <div class="campos-painel">
            <div class="campo-grupo">
                <label>Ano:</label>
                <input type="text" id="anoInputAniver" value="2026" oninput="sincronizarCabecalhosAniver()">
            </div>
            <div class="campo-grupo">
                <label>Área / Gerência:</label>
                <input type="text" id="areaInputAniver" placeholder="Operação / Logística" oninput="sincronizarCabecalhosAniver()">
            </div>
        </div>
        <div class="campo-grupo">
            <label>Importação Rápida de Nomes (Qualquer formato: NOME 10/DEZ ou NOME - 10/12):</label>
            <textarea id="importarTextoAniver" placeholder="Cole aqui seus nomes... O sistema distribui e organiza do dia 01 ao dia 31 automaticamente!"></textarea>
        </div>
        <div class="botoes-painel">
            <button type="button" class="btn btn-pink" onclick="distribuirNomesImportados()">⚡ Distribuir & Ordenar nos Meses</button>
            <button type="button" class="btn btn-ordenar" onclick="ordenarAniversariosPorDia(true)">📅 Reordenar por Dia</button>
            <button type="button" class="btn btn-salvar" onclick="salvarTudoAniver()">💾 Salvar</button>
            <button type="button" class="btn btn-carregar" onclick="carregarTudoAniver()">📂 Carregar</button>
            <button type="button" class="btn btn-exportar" onclick="exportarBackupJSON()">⬇️ Backup</button>
            <button type="button" class="btn btn-exportar" onclick="document.getElementById('arquivoBackupAniver').click()">⬆️ Restaurar</button>
            <button type="button" class="btn btn-limpar" onclick="limparTudoAniver()">Limpar</button>
            <button type="button" class="btn btn-imprimir" onclick="window.print()">🖨️ Imprimir (A4)</button>
        </div>
    </div>

    <div id="contentorFolhasAniver"></div>

    <script>
        const MESES_ANO = [
            "JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO",
            "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"
        ];

        const MAPA_MESES_TEXTO = {
            "JAN": 1, "JANEIRO": 1, "01": 1,
            "FEV": 2, "FEVEREIRO": 2, "02": 2,
            "MAR": 3, "MARCO": 3, "MARÇO": 3, "03": 3,
            "ABR": 4, "ABRIL": 4, "04": 4,
            "MAI": 5, "MAIO": 5, "05": 5,
            "JUN": 6, "JUNHO": 6, "06": 6,
            "JUL": 7, "JULHO": 7, "07": 7,
            "AGO": 8, "AGOSTO": 8, "08": 8,
            "SET": 9, "SETEMBRO": 9, "09": 9,
            "OUT": 10, "OUTUBRO": 10, "10": 10,
            "NOV": 11, "NOVEMBRO": 11, "11": 11,
            "DEZ": 12, "DEZEMBRO": 12, "12": 12
        };

        const DADOS_INICIAIS = {
            "JANEIRO": ["MARIANA PEREIRA CRUZ - 11/01", "RICARDO GONCALVES DE MELLO LEITE - 13/01", "JOAO SILVA RAMOS - 18/01", "ALFREDO AUGUSTO RAMOS NETO - 22/01"],
            "FEVEREIRO": ["MARCOS AURELIO CATALLARES MATTOS - 01/02", "VANDERSON TEIXEIRA - 04/02", "BRUNO RICARDO - 07/02", "GABRIEL CARNEIRO - 07/02"],
            "MARÇO": ["GLEIVSTON SILVA MENDES - 22/03", "REINALDO DO NASCIMENTO MOUREIRA - 26/03"],
            "ABRIL": ["CAMILA MAGALHAES GONCALVES - 27/04"],
            "MAIO": ["LEONAM MOTA PEIXOTO - 22/05", "LUCAS BRAGA - 29/05"],
            "JUNHO": ["ROBSON DE SOUZA MENDONCA - 04/06", "PAULO HENRIQUE - 08/06", "PAULO HENRIQUE FIRMIANO DE PAIVA - 08/06", "LUIZ CARLOS DOS SANTOS - 15/06"],
            "JULHO": ["BRUNO GOMES FIDELIS - 02/07", "ATMISTO SILVA - 20/07", "ATMISTO ALEXANDRE MUNIZ DA SILVA - 20/07", "GIOVANA CORREA DA SILVA - 30/07"],
            "AGOSTO": ["CAIO HENRIQUE - 06/08", "PABLO MESQUITA - 25/08", "DAVID MARCELO DELGADO DOS SANTOS - 26/08"],
            "SETEMBRO": ["CLAUDIO ALVES - 16/09", "PABLO GOMES DO COUTO - 25/09"],
            "OUTUBRO": [],
            "NOVEMBRO": ["DOMINIQUE SILVA - 02/11", "DOMINIQUE WENDOS DA SILVA - 02/11", "SAINT CLAIR DA CONCEICAO LOPES - 03/11", "RICHARD SILVA - 24/11"],
            "DEZEMBRO": ["EMERSON RIBEIRO DOS SANTOS - 04/12", "AMANDA FERNANDA VASCONCELOS - 10/12", "ALLAN SOUZA DE CARVALHO - 15/12", "TITO DACAL - 27/12"]
        };

        function mostrarToast(msg) {
            const toast = document.getElementById('toastNotificacao');
            toast.innerText = msg;
            toast.classList.add('ativo');
            setTimeout(() => { toast.classList.remove('ativo'); }, 2600);
        }

        function obterIndiceMesAtual() {
            return new Date().getMonth();
        }

        function sincronizarCabecalhosAniver() {
            const ano = document.getElementById('anoInputAniver').value || '2026';
            const area = document.getElementById('areaInputAniver').value || '---';

            document.querySelectorAll('#contentorFolhasAniver .folha-a4').forEach(f => {
                const elAno = f.querySelector('.val-ano');
                const elArea = f.querySelector('.val-area');
                if (elAno) elAno.innerText = ano;
                if (elArea) elArea.innerText = area;
            });
        }

        function atualizarMetricas() {
            const dados = capturarDadosAtuais();
            let total = 0;
            const mesAtualNome = MESES_ANO[obterIndiceMesAtual()];
            let totalMesAtual = dados[mesAtualNome] ? dados[mesAtualNome].length : 0;

            for (let m in dados) {
                total += dados[m].length;
            }

            document.getElementById('metricaTotal').innerText = `🎂 Total de Aniversariantes: ${total}`;
            document.getElementById('metricaMesAtual').innerText = `🎉 Aniversariantes de ${mesAtualNome}: ${totalMesAtual}`;
        }

        function criarBlocoMes(mesNome, itens = []) {
            const ehMesAtual = (mesNome === MESES_ANO[obterIndiceMesAtual()]);
            const classeDestaque = ehMesAtual ? 'mes-atual-destaque' : '';
            const tagMes = ehMesAtual ? ' ★' : '';

            let totalLinhas = Math.max(itens.length, 1);
            let linhasHTML = '';

            for (let i = 0; i < totalLinhas; i++) {
                let nome = '';
                let data = '';
                if (itens[i]) {
                    const [n, d] = itens[i].split('-');
                    nome = (n || '').trim();
                    data = (d || '').trim();
                }

                const ehPrimeira = (i === 0);
                const tdMes = ehPrimeira ? `<td class="td-mes-nome" rowspan="${totalLinhas + 1}">📅 ${mesNome}${tagMes}</td>` : '';

                linhasHTML += `
                    <tr>
                        ${tdMes}
                        <td class="col-nome-aniver" contenteditable="true" onblur="atualizarMetricas()">${nome}</td>
                        <td class="col-data-aniver" contenteditable="true" placeholder="DD/MM" onblur="atualizarMetricas()">${data}</td>
                        <td class="col-acoes-aniver">
                            <div class="botoes-acoes">
                                <button type="button" class="btn-acao btn-wpp" onclick="copiarMensagemParabens(this)" title="Copiar Parabéns">💬</button>
                                <button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaAbaixo(this)" title="Nova Linha">➕</button>
                                <button type="button" class="btn-acao btn-lixeira" onclick="limparOuRemoverLinha(this)" title="Remover">✕</button>
                            </div>
                        </td>
                    </tr>
                `;
            }

            linhasHTML += `
                <tr class="tr-linha-em-branco">
                    <td class="col-nome-aniver" contenteditable="true" onblur="atualizarMetricas()" placeholder="Nome..."></td>
                    <td class="col-data-aniver" contenteditable="true" placeholder="DD/MM" onblur="atualizarMetricas()"></td>
                    <td class="col-acoes-aniver">
                        <div class="botoes-acoes">
                            <button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaAbaixo(this)" title="Nova Linha">➕</button>
                        </div>
                    </td>
                </tr>
            `;

            return `
                <div class="bloco-mes ${classeDestaque}" data-mes="${mesNome}">
                    <table class="tabela-mes">
                        <tbody>${linhasHTML}</tbody>
                    </table>
                </div>
            `;
        }

        function copiarMensagemParabens(btn) {
            const tr = btn.closest('tr');
            const nome = tr.querySelector('.col-nome-aniver').innerText.trim();
            if(!nome) {
                mostrarToast('Sem nome nesta linha para parabenizar.');
                return;
            }
            const [primeiroNome] = nome.split(' ');
            const msg = `🎉 Parabéns, ${primeiroNome}! Que seu novo ciclo seja de muita saúde, paz e conquistas. Grande abraço de toda a equipe Vale! 🎂✨`;
            navigator.clipboard.writeText(msg).then(() => {
                mostrarToast(`Mensagem copiada para parabenizar ${primeiroNome}!`);
            });
        }

        function adicionarLinhaAbaixo(btn) {
            const tr = btn.closest('tr');
            const tbody = tr.closest('tbody');
            const tdMes = tbody.querySelector('.td-mes-nome');
            
            if (tdMes) {
                let atual = parseInt(tdMes.getAttribute('rowspan') || '2', 10);
                tdMes.setAttribute('rowspan', atual + 1);
            }

            const nova = document.createElement('tr');
            nova.innerHTML = `
                <td class="col-nome-aniver" contenteditable="true" onblur="atualizarMetricas()"></td>
                <td class="col-data-aniver" contenteditable="true" placeholder="DD/MM" onblur="atualizarMetricas()"></td>
                <td class="col-acoes-aniver">
                    <div class="botoes-acoes">
                        <button type="button" class="btn-acao btn-wpp" onclick="copiarMensagemParabens(this)" title="Copiar Parabéns">💬</button>
                        <button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaAbaixo(this)" title="Nova Linha">➕</button>
                        <button type="button" class="btn-acao btn-lixeira" onclick="limparOuRemoverLinha(this)" title="Remover">✕</button>
                    </div>
                </td>
            `;
            tr.after(nova);
            nova.querySelector('.col-nome-aniver').focus();
        }

        function limparOuRemoverLinha(btn) {
            const tr = btn.closest('tr');
            const tbody = tr.closest('tbody');
            const totalLinhas = tbody.querySelectorAll('tr').length;
            const tdMes = tbody.querySelector('.td-mes-nome');

            if (totalLinhas > 2) {
                if (tdMes && !tr.contains(tdMes)) {
                    let atual = parseInt(tdMes.getAttribute('rowspan') || '2', 10);
                    tdMes.setAttribute('rowspan', atual - 1);
                }
                tr.remove();
            } else {
                tr.querySelector('.col-nome-aniver').innerText = '';
                tr.querySelector('.col-data-aniver').innerText = '';
            }
            atualizarMetricas();
        }

        function criarEstruturaFolhaAniver(dadosObj) {
            let blocosHTML = '';
            MESES_ANO.forEach(m => {
                blocosHTML += criarBlocoMes(m, dadosObj[m] || []);
            });

            const anoAtual = document.getElementById('anoInputAniver').value || '2026';
            const areaAtual = document.getElementById('areaInputAniver').value || '---';

            const f = document.createElement('div'); 
            f.className = 'folha-a4';
            f.innerHTML = `
                <table class="cabecalho-container">
                    <tr>
                        <td class="logo-box">VALE</td>
                        <td class="titulo-box">🎂 CRONOGRAMA ANUAL DE ANIVERSÁRIOS DA EQUIPE</td>
                        <td class="meta-box">
                            <strong>Ano:</strong> <span class="val-ano">${anoAtual}</span><br>
                            <span><strong>Página:</strong> 01 / 01</span>
                        </td>
                    </tr>
                </table>
                <table class="info-aniver-bar">
                    <tr>
                        <td><strong>Área / Gerência:</strong> <span class="val-area campo-editavel" contenteditable="true">${areaAtual}</span></td>
                    </tr>
                </table>
                <div class="contentor-blocos">${blocosHTML}</div>`;
            return f;
        }

        function capturarDadosAtuais() {
            let obj = {};
            document.querySelectorAll('.bloco-mes').forEach(bloco => {
                let mes = bloco.getAttribute('data-mes');
                let itens = [];
                bloco.querySelectorAll('tbody tr').forEach(tr => {
                    let nome = tr.querySelector('.col-nome-aniver') ? tr.querySelector('.col-nome-aniver').innerText.trim() : '';
                    let data = tr.querySelector('.col-data-aniver') ? tr.querySelector('.col-data-aniver').innerText.trim() : '';
                    if(nome !== "") {
                        itens.push(nome + " - " + data);
                    }
                });
                obj[mes] = itens;
            });
            return obj;
        }

        function ordenarObjeto(dados) {
            for (let mes in dados) {
                dados[mes].sort((a, b) => {
                    const [, dataA = ''] = a.split('-');
                    const [, dataB = ''] = b.split('-');
                    const [diaAStr = '99'] = dataA.trim().split('/');
                    const [diaBStr = '99'] = dataB.trim().split('/');
                    const diaA = parseInt(diaAStr, 10) || 99;
                    const diaB = parseInt(diaBStr, 10) || 99;
                    return diaA - diaB;
                });
            }
            return dados;
        }

        function ordenarAniversariosPorDia(mostrarMsg = false) {
            let dados = capturarDadosAtuais();
            dados = ordenarObjeto(dados);
            renderizarComDados(dados);
            if (mostrarMsg) mostrarToast('Aniversários organizados por dia com sucesso!');
        }

        function distribuirNomesImportados() {
            const texto = document.getElementById('importarTextoAniver').value;
            if(!texto.trim()) {
                mostrarToast('Cole os nomes na caixa de texto primeiro!');
                return;
            }
            const linhas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let dados = capturarDadosAtuais();

            let adicionados = 0;

            linhas.forEach(linha => {
                const regexData = /(\d{1,2})\/([A-Za-z0-9]+)$/;
                const match = linha.match(regexData);

                if (match) {
                    const dia = match[1].padStart(2, '0');
                    const mesTexto = match[2].toUpperCase().trim();
                    let nome = linha.substring(0, match.index).replace(/[-–—]\s*$/, '').trim().toUpperCase();

                    let mesNum = null;
                    if (MAPA_MESES_TEXTO[mesTexto]) {
                        mesNum = MAPA_MESES_TEXTO[mesTexto];
                    } else {
                        const parsed = parseInt(mesTexto, 10);
                        if (parsed >= 1 && parsed <= 12) mesNum = parsed;
                    }

                    if (mesNum && nome) {
                        const mesNome = MESES_ANO[mesNum - 1];
                        const dataFormatada = `${dia}/${String(mesNum).padStart(2, '0')}`;
                        if (!dados[mesNome]) dados[mesNome] = [];

                        const jaExiste = dados[mesNome].some(item => item.startsWith(nome));
                        if (!jaExiste) {
                            dados[mesNome].push(`${nome} - ${dataFormatada}`);
                            adicionados++;
                        }
                    }
                }
            });

            dados = ordenarObjeto(dados);

            document.getElementById('importarTextoAniver').value = '';
            renderizarComDados(dados);
            mostrarToast(`🎉 SUCESSO! ${adicionados} aniversariante(s) distribuído(s) e ordenados!`);
        }

        function renderizarComDados(dados) {
            const box = document.getElementById('contentorFolhasAniver');
            box.innerHTML = '';
            box.appendChild(criarEstruturaFolhaAniver(dados));
            sincronizarCabecalhosAniver();
            atualizarMetricas();
        }

        function salvarTudoAniver() { 
            const backup = {
                ano: document.getElementById('anoInputAniver').value,
                area: document.getElementById('areaInputAniver').value,
                dados: capturarDadosAtuais()
            };
            localStorage.setItem('valeaniversarios_v07', JSON.stringify(backup)); 
            mostrarToast('Aniversários salvos com sucesso!'); 
        }

        function carregarTudoAniver() { 
            const s = localStorage.getItem('valeaniversarios_v07'); 
            if(s) { 
                const res = JSON.parse(s);
                if(res.ano) document.getElementById('anoInputAniver').value = res.ano;
                if(res.area) document.getElementById('areaInputAniver').value = res.area;
                renderizarComDados(res.dados || {});
                mostrarToast('Dados carregados com sucesso!'); 
            } else {
                mostrarToast('Nenhum dado salvo encontrado.');
            }
        }

        function exportarBackupJSON() {
            const backup = {
                ano: document.getElementById('anoInputAniver').value,
                area: document.getElementById('areaInputAniver').value,
                dados: capturarDadosAtuais()
            };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_aniversarios_${document.getElementById('anoInputAniver').value || '2026'}.json`;
            a.click();
            URL.revokeObjectURL(url);
            mostrarToast('Backup exportado com sucesso!');
        }

        function processarArquivoBackup(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const dados = JSON.parse(e.target.result);
                    if(dados.ano) document.getElementById('anoInputAniver').value = dados.ano;
                    if(dados.area) document.getElementById('areaInputAniver').value = dados.area;
                    renderizarComDados(dados.dados || {});
                    mostrarToast('Backup restaurado com sucesso!');
                } catch(err) {
                    mostrarToast('Erro ao ler arquivo de backup.');
                }
            };
            reader.readAsText(file);
            input.value = '';
        }

        function limparTudoAniver() { 
            let vazio = {};
            MESES_ANO.forEach(m => vazio[m] = []);
            renderizarComDados(vazio);
            mostrarToast('Todos os meses foram limpos.');
        }

        window.onload = function() { 
            let base = ordenarObjeto(DADOS_INICIAIS);
            renderizarComDados(base); 
        };
    </script>
</body>
</html>
