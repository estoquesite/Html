<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Módulo 4 - Aniversariantes da Equipa | Portal Vale v07</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #fff0f5; color: #1e293b; min-height: 100vh; padding: 16px; }

/* PAINEL DE CONTROLO */
.painel-controle { background: #ffffff; padding: 18px 22px; margin: 0 auto 16px auto; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(219, 39, 119, 0.1); border: 1px solid #fbcfe8; max-width: 900px; }
.topo-modulo-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; border-bottom: 2px solid #db2777; padding-bottom: 8px; }
.badge-modulo { background: linear-gradient(135deg, #db2777, #be185d); color: #fff; font-size: 11.5px; font-weight: 800; padding: 5px 12px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
.tag-v07 { background-color: #f59e0b; color: #fff; font-weight: 800; font-size: 10px; padding: 2px 7px; border-radius: 4px; margin-left: 6px; }

.campos-painel { display: grid; gap: 12px; margin-bottom: 12px; grid-template-columns: 200px 1fr; }
.campo-grupo label { display: block; font-weight: 700; margin-bottom: 4px; font-size: 10px; color: #9d174d; text-transform: uppercase; }
.painel-controle input[type="text"] { width: 100%; font-family: inherit; font-size: 12px; padding: 8px 10px; border: 1px solid #f472b6; border-radius: 6px; background: #fff1f2; outline: none; }

.botoes-painel { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.btn { cursor: pointer; padding: 7px 14px; font-size: 11px; font-weight: 700; border: none; border-radius: 6px; color: #fff; display: inline-flex; align-items: center; gap: 5px; }
.btn-pink { background-color: #db2777; } 
.btn-add-folha { background-color: #7c3aed; }
.btn-salvar { background-color: #2563eb; } 
.btn-carregar { background-color: #0284c7; } 
.btn-limpar { background-color: #fdf2f8; color: #9d174d; border: 1px solid #f472b6; } 
.btn-voltar { background-color: #475569; text-decoration: none; } 
.btn-imprimir { background-color: #0f172a; margin-left: auto; }

/* FOLHA A4 VERTICAL COMPACTA */
.folha-a4 { width: 100%; max-width: 900px; background: #fff; padding: 14px 20px; margin: 0 auto 20px auto; box-shadow: 0 10px 30px rgba(219, 39, 119, 0.08); border-radius: 12px; border: 1px solid #f472b6; position: relative; }

.barra-controle-folha { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #fff1f2; padding: 6px 10px; border: 1px solid #fbcfe8; border-radius: 6px; }
.btn-remover-folha { background: #fff; color: #ef4444; border: 1px solid #fca5a5; border-radius: 4px; font-size: 9px; font-weight: 700; padding: 3px 8px; cursor: pointer; }

/* CABEÇALHO COMPACTO */
.cabecalho-aniver { display: flex; align-items: center; justify-content: space-between; border: 1.5px solid #db2777; background: #fff1f2; margin-bottom: 10px; border-radius: 6px; overflow: hidden; }
.cab-logo { width: 100px; background: #db2777; color: #fff; font-weight: 900; font-size: 14px; text-align: center; padding: 6px; letter-spacing: 1px; }
.cab-titulo { flex-grow: 1; text-align: center; font-weight: 800; font-size: 10.5px; text-transform: uppercase; color: #831843; padding: 0 10px; }
.cab-meta { width: 120px; font-size: 8px; padding: 4px 8px; text-align: left; background: #fff; border-left: 1.5px solid #db2777; line-height: 1.2; }

/* BLOCOS VERTICAIS COM PREVENÇÃO DE CORTE */
.bloco-mes { margin-bottom: 8px; border: 1.2px solid #db2777; border-radius: 5px; overflow: hidden; page-break-inside: avoid; break-inside: avoid; }
.bloco-mes-titulo { background-color: #db2777; color: #fff; font-weight: 800; font-size: 9px; text-transform: uppercase; padding: 3px 8px; display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.5px; }

table.tabela-mes { width: 100%; border-collapse: collapse; }
table.tabela-mes th, table.tabela-mes td { border: 1px solid #f472b6; text-align: center; vertical-align: middle; font-size: 9px; height: 23px; padding: 2px 6px; }
table.tabela-mes th { background-color: #fdf2f8; color: #831843; font-weight: 700; font-size: 8.5px; text-transform: uppercase; }
table.tabela-mes tbody tr:nth-child(even) { background-color: #fff1f2; }

.col-nome-aniver { text-align: left !important; font-weight: 700; text-transform: uppercase; padding-left: 10px; }
.col-data-aniver { width: 120px; font-weight: 700; background: #fff; }
.col-acoes-aniver { width: 60px; }

.botoes-acoes { display: flex; align-items: center; justify-content: center; gap: 4px; opacity: 0.3; transition: opacity 0.2s; }
tr:hover .botoes-acoes { opacity: 1; }
.btn-acao { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; padding: 2px 4px; font-size: 8.5px; }
.btn-mais-linha { color: #10b981; border-color: #6ee7b7; font-weight: 900; }
.btn-lixeira { color: #ef4444; border-color: #fca5a5; }

/* IMPRESSÃO LIMPA E PROIBIÇÃO DE CORTE EM MEIO DE BLOCOS */
@media print {
    @page { size: A4 portrait; margin: 0mm; }
    html, body { background: #fff !important; width: 210mm; height: 297mm; margin: 0 !important; padding: 8mm !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .painel-controle, .botoes-acoes, .barra-controle-folha, .btn-acoes-bloco, .col-acoes-aniver, th:last-child { display: none !important; }
    .folha-a4 { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
    .bloco-mes { page-break-inside: avoid; break-inside: avoid; }
    .bloco-mes-titulo { background-color: #db2777 !important; color: #fff !important; }
    table.tabela-mes th { background-color: #fdf2f8 !important; color: #831843 !important; }
}
</style>
</head>
<body>

    <div class="painel-controle">
        <div class="topo-modulo-info">
            <span class="badge-modulo">Módulo 4: Aniversariantes do Ano <span class="tag-v07">v07</span></span>
            <a href="index.html" class="btn btn-voltar">⬅ Voltar ao Menu</a>
        </div>
        <div class="campos-painel">
            <div class="campo-grupo"><label>Ano do Cronograma:</label><input type="text" id="anoInputAniver" value="2026" oninput="atualizarAnoTitulo()"></div>
        </div>
        <div class="botoes-painel">
            <button type="button" class="btn btn-pink" onclick="gerarEstruturaAniversarios()">Restaurar Meses Padrão</button>
            <button type="button" class="btn btn-add-folha" onclick="adicionarFolhaAniver()">📄➕ Folha Extra</button>
            <button type="button" class="btn btn-salvar" onclick="salvarTudoAniver()">💾 Guardar</button>
            <button type="button" class="btn btn-carregar" onclick="carregarTudoAniver()">📂 Carregar</button>
            <button type="button" class="btn btn-limpar" onclick="limparTudoAniver()">Limpar</button>
            <button type="button" class="btn btn-imprimir" onclick="window.print()">🖨️ Imprimir</button>
        </div>
    </div>

    <div id="contentorFolhasAniver"></div>

    <script>
        const DADOS_INICIAIS_A = {
            "JANEIRO": ["MARIANA PEREIRA CRUZ - 11/01", "RICARDO GONCALVES DE MELLO LEITE - 13/01", "JOAO SILVA RAMOS - 18/01", "ALFREDO AUGUSTO RAMOS NETO - 22/01"],
            "FEVEREIRO": ["MARCOS AURELIO CATALLARES MATTOS - 01/02", "VANDERSON TEIXEIRA - 04/02", "BRUNO RICARDO - 07/02", "GABRIEL CARNEIRO - 07/02"],
            "MARÇO": ["GLEIVSTON SILVA MENDES - 22/03"],
            "JUNHO": ["ROBSON DE SOUZA MENDONCA - 04/06", "PAULO HENRIQUE - 08/06"],
            "JULHO": ["BRUNO GOMES FIDELIS - 02/07", "ATMISTO SILVA - 20/07"],
            "AGOSTO": ["CAIO HENRIQUE - 06/08", "PABLO MESQUITA - 25/08", "DAVID MARCELO DELGADO DOS SANTOS - 26/08"],
            "NOVEMBRO": ["DOMINIQUE SILVA - 02/11", "RICHARD SILVA - 24/11"],
            "DEZEMBRO": ["EMERSON RIBEIRO DOS SANTOS - 04/12", "ALLAN SOUZA DE CARVALHO - 15/12", "TITO DACAL - 27/12"]
        };

        function atualizarAnoTitulo() {
            const ano = document.getElementById('anoInputAniver').value;
            document.querySelectorAll('.titulo-ano-txt').forEach(el => el.innerText = ano);
        }

        function criarBlocoMes(mesNome, itens) {
            let linhas = '';
            if(!itens || itens.length === 0) itens = [" - "];
            
            itens.forEach(item => {
                let partes = item.split('-');
                let nome = partes[0] ? partes[0].trim() : '';
                let data = partes[1] ? partes[1].trim() : '';
                if(nome === "-") nome = "";
                linhas += `<tr>` +
                    `<td class="col-nome-aniver" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()">${nome}</td>` +
                    `<td class="col-data-aniver" contenteditable="true">${data}</td>` +
                    `<td class="col-acoes-aniver"><div class="botoes-acoes"><button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaBloco(this)" title="Adicionar">➕</button><button type="button" class="btn-acao btn-lixeira" onclick="removerLinhaBloco(this)" title="Apagar">🗑️</button></div></td>` +
                `</tr>`;
            });

            return `<div class="bloco-mes" data-mes="${mesNome}">
                <div class="bloco-mes-titulo">
                    <span>📅 ${mesNome}</span>
                    <div class="btn-acoes-bloco" style="display:flex; gap:4px;">
                        <button type="button" onclick="adicionarLinhaPorCabecalho(this)" title="Adicionar linha" style="background:#fff; color:#db2777; border:none; padding:1px 4px; border-radius:3px; font-weight:800; cursor:pointer; font-size:8px;">➕</button>
                        <button type="button" onclick="removerBlocoMes(this)" title="Remover mês" style="background:#fee2e2; color:#ef4444; border:none; padding:1px 4px; border-radius:3px; font-weight:800; cursor:pointer; font-size:8px;">✕</button>
                    </div>
                </div>
                <table class="tabela-mes">
                    <thead><tr><th>Nome do Colaborador</th><th>Data de Aniversário</th><th class="col-acoes-aniver">Ações</th></tr></thead>
                    <tbody>${linhas}</tbody>
                </table>
            </div>`;
        }

        function adicionarLinhaBloco(btn) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="col-nome-aniver" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()"></td>` +
                           `<td class="col-data-aniver" contenteditable="true"></td>` +
                           `<td class="col-acoes-aniver"><div class="botoes-acoes"><button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaBloco(this)" title="Adicionar">➕</button><button type="button" class="btn-acao btn-lixeira" onclick="removerLinhaBloco(this)" title="Apagar">🗑️</button></div></td>`;
            btn.closest('tr').after(tr);
        }

        function adicionarLinhaPorCabecalho(btn) {
            const tbody = btn.closest('.bloco-mes').querySelector('tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="col-nome-aniver" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()"></td>` +
                           `<td class="col-data-aniver" contenteditable="true"></td>` +
                           `<td class="col-acoes-aniver"><div class="botoes-acoes"><button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaBloco(this)" title="Adicionar">➕</button><button type="button" class="btn-acao btn-lixeira" onclick="removerLinhaBloco(this)" title="Apagar">🗑️</button></div></td>`;
            tbody.appendChild(tr);
        }

        function removerLinhaBloco(btn) {
            const tr = btn.closest('tr');
            const tbody = tr.parentNode;
            if(tbody.querySelectorAll('tr').length > 1) tr.remove();
            else {
                tr.querySelector('.col-nome-aniver').innerText = '';
                tr.querySelector('.col-data-aniver').innerText = '';
            }
        }

        function removerBlocoMes(btn) { btn.closest('.bloco-mes').remove(); }

        function criarEstruturaFolhaAniver(dadosObj) {
            let blocosHTML = '';
            for(let m in dadosObj) {
                blocosHTML += criarBlocoMes(m, dadosObj[m]);
            }
            const anoAtual = document.getElementById('anoInputAniver').value;
            const f = document.createElement('div'); f.className = 'folha-a4';
            f.innerHTML = `
                <div class="barra-controle-folha">
                    <div class="grupo-acoes-linhas"><span><strong>Cronograma de Aniversários</strong></span></div>
                    <button type="button" class="btn-remover-folha" onclick="removerFolhaAniver(this)">Remover Folha ✕</button>
                </div>
                <div class="cabecalho-aniver">
                    <div class="cab-logo">VALE</div>
                    <div class="cab-titulo">🎂 CRONOGRAMA DE ANIVERSÁRIOS DA EQUIPA - <span class="titulo-ano-txt">${anoAtual}</span></div>
                    <div class="cab-meta"><span class="indicador-folha"><strong>Página:</strong> 01 / 01</span></div>
                </div>
                <div class="contentor-blocos">${blocosHTML}</div>`;
            return f;
        }

        function atualizarPaginacaoAniver() { 
            const f = document.querySelectorAll('#contentorFolhasAniver .folha-a4'); 
            f.forEach((folha, idx) => { 
                const ind = folha.querySelector('.indicador-folha'); 
                if(ind) ind.innerHTML = `<strong>Página:</strong> 0${idx+1} / 0${f.length}`; 
            }); 
        }

        function adicionarFolhaAniver() { 
            document.getElementById('contentorFolhasAniver').appendChild(criarEstruturaFolhaAniver({})); 
            atualizarPaginacaoAniver(); 
        }

        function removerFolhaAniver(btn) {
            const folhas = document.querySelectorAll('#contentorFolhasAniver .folha-a4');
            if(folhas.length > 1) {
                btn.closest('.folha-a4').remove();
                atualizarPaginacaoAniver();
            }
        }

        function gerarEstruturaAniversarios() {
            const box = document.getElementById('contentorFolhasAniver'); box.innerHTML = '';
            box.appendChild(criarEstruturaFolhaAniver(DADOS_INICIAIS_A));
            atualizarPaginacaoAniver();
        }

        function capturarDadosAtuais() {
            let obj = {};
            document.querySelectorAll('.bloco-mes').forEach(bloco => {
                let mes = bloco.getAttribute('data-mes');
                let itens = [];
                bloco.querySelectorAll('tbody tr').forEach(tr => {
                    let nome = tr.querySelector('.col-nome-aniver').innerText.trim();
                    let data = tr.querySelector('.col-data-aniver').innerText.trim();
                    if(nome !== "") itens.push(nome + " - " + data);
                });
                if(itens.length > 0) obj[mes] = itens;
            });
            return obj;
        }

        function salvarTudoAniver() { 
            let dados = capturarDadosAtuais();
            localStorage.setItem('valeaniversarios_v07', JSON.stringify({dados, ano: document.getElementById('anoInputAniver').value})); 
            alert('Aniversários Guardados com sucesso! (v07)'); 
        }

        function carregarTudoAniver() { 
            const s = localStorage.getItem('valeaniversarios_v07'); 
            if(s) { 
                let res = JSON.parse(s);
                if(res.ano) document.getElementById('anoInputAniver').value = res.ano;
                const box = document.getElementById('contentorFolhasAniver'); box.innerHTML = '';
                box.appendChild(criarEstruturaFolhaAniver(res.dados || res));
                atualizarPaginacaoAniver();
                alert('Aniversários Carregados!'); 
            } else {
                alert('Nenhum dado guardado encontrado.');
            }
        }

        function limparTudoAniver() { 
            document.getElementById('contentorFolhasAniver').innerHTML = ''; 
            box = document.getElementById('contentorFolhasAniver');
            box.appendChild(criarEstruturaFolhaAniver({"JANEIRO": []}));
            atualizarPaginacaoAniver();
        }

        window.onload = function() { gerarEstruturaAniversarios(); };
    </script>
</body>
</html>
