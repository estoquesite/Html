<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadros de Gestão à Vista</title>
<style id="estilo">
*{box-sizing:border-box}
body{margin:0;background:#8a8f94;font-family:Arial,Helvetica,sans-serif;color:#222}
button{font-family:inherit}
.bar{position:sticky;top:0;z-index:9;background:#222;color:#fff;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.bar button,.tb button,.tools button{padding:5px 10px;border:0;border-radius:4px;background:#e8e8e8;cursor:pointer;font-weight:bold;font-size:12px}
.bar button.ok{background:#2e9e4f;color:#fff}
.bar label{display:flex;align-items:center;gap:4px}
.bar input[type=color]{width:32px;height:26px;padding:0;border:1px solid #888;background:none;cursor:pointer}
.bar .sep{width:1px;height:22px;background:#666}
#info{color:#9fd3ff}
.wrap{width:297mm;margin:14px auto}
.tb{background:#222;color:#fff;padding:6px 10px;border-radius:6px 6px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.tb .gap{flex:1}
.sheet{width:297mm;height:210mm;background:#fff;padding:12mm 14mm;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 10px #0006}
table{width:100%;border-collapse:separate;border-spacing:0;flex:1;table-layout:fixed}
th{font-size:14px;padding:6px;border:2px solid #333;background:#eceeee;text-align:center}
td{padding:4px 8px;font-size:15px;vertical-align:middle;text-align:center;border:2px solid #333}
[contenteditable]{outline:none;min-height:1.2em;word-break:break-word;text-align:center}
[contenteditable]:focus{outline:1px dashed #888}
.sel{outline:3px solid #1e88e5!important;outline-offset:-3px}
.st{width:44px;height:44px;border-radius:50%;border:2px solid #333;background:#fff;cursor:pointer;display:block;margin:auto;padding:0}
.st.r{background:#e0393e}.st.y{background:#f4c20d}.st.g{background:#2e9e4f}.st.b{background:#2f6fd0}.st.p{background:#f7c6cc}
.sheet.c .st{width:28px;height:28px}.sheet.c td{padding:2px 8px}
.title{font-size:22px;font-weight:bold;padding:10px 14px;text-align:center;border:2px solid #333;border-bottom:0;background:#2b6b5a;color:#fff}
.meta{display:flex;justify-content:center;gap:30px;font-size:12px;padding:4px 14px;border:2px solid #333;border-bottom:0;text-align:center}
.meta span{min-width:70px;display:inline-block;border-bottom:1px solid #666}
.bands{flex:1;display:flex;flex-direction:column;gap:0}
.band{flex:1;display:flex;gap:8px;padding:6px 8px;border:2px solid #333;border-top-width:0;align-items:center;min-height:0}
.boxes{display:flex;gap:6px;flex:0 1 auto;min-width:0;align-self:stretch}
.box{border:1px solid #333;border-radius:16px;padding:5px 10px;width:36mm;min-width:20mm;flex:0 1 36mm;display:flex;flex-direction:column;overflow:hidden;text-align:center;background:#dde6ee}
.bl{font-size:12px;font-weight:bold}
.bv{flex:1;font-size:15px;color:#1a2a8a}
.free{flex:1;align-self:stretch;font-size:13px;padding:4px 6px;overflow:hidden;font-family:"Comic Sans MS","Segoe Print",cursive}
.side{width:36mm;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.band .st{width:30px;height:30px;margin:0}
.lbl{font-weight:bold;font-size:14px}
.tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
@media print{
 @page{size:A4 landscape;margin:0}
 body{background:#fff}
 .bar,.tb,.tools{display:none!important}
 .wrap{margin:0}
 .sheet{box-shadow:none;page-break-after:always}
 .sel{outline:none!important}
 body.um .wrap:not(.alvo){display:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
  <strong>Quadros de Gestão à Vista</strong>
  <span class="sep"></span>
  <button id="bUndo">↶ Desfazer</button><button id="bRedo">↷ Refazer</button>
  <span class="sep"></span>
  <button id="bPrint">🖨 Imprimir tudo</button><button id="bSave">💾 Salvar tudo no computador</button><button id="bReset">Restaurar modelo</button>
  <span class="sep"></span>
  <label>Fundo <input type="color" id="cFundo" value="#ffe08a"></label><button class="ok" id="okFundo">OK</button>
  <label>Texto <input type="color" id="cTexto" value="#000000"></label><button class="ok" id="okTexto">OK</button>
  <button id="bLimpa">Sem cor</button>
  <button id="bLinha">Pintar linha toda</button>
  <button id="bColuna">Pintar coluna toda</button>
  <button id="bTudo">Pintar quadro todo</button>
  <span id="info">Clique em qualquer quadrado para selecioná-lo e escolher as cores.</span>
</div>
<div id="app"></div>

<script id="codigo">
const EST=window.__ESTADO__||null;
const KEY=EST?'quadros_'+EST.id:'quadros_gestao_visual_v4';
const ST=['','r','y','g','b','p'];
const SEL='td,th,.box,.band,.free,.title,.meta,.lbl';
const app=document.getElementById('app'),info=document.getElementById('info');
const $=id=>document.getElementById(id);
let sel=null,ativo=null,timer=null;
const H=new Map();

const E=(t='')=>`<div contenteditable="true">${t}</div>`;
const stBtn=`<button class="st" data-s="" title="Clique para mudar o status"></button>`;
function tabela(cols,rows){
  let h='<table><thead><tr>'+cols.map(c=>`<th style="width:${c[1]}%">${E(c[0])}</th>`).join('')+'</tr></thead><tbody>';
  for(let i=0;i<rows;i++)h+='<tr>'+cols.map(c=>`<td>${c[2]?stBtn:E()}</td>`).join('')+'</tr>';
  return h+'</tbody></table>';
}
const C4=(a,b,c,d)=>[[a,46,0],[b,22,0],[c,17,0],[d,15,1]];
const rowBtns='<button data-a="addrow">+ linha</button><button data-a="delrow">− linha</button>';
const tbBase='<button data-a="undo">↶ Desfazer</button><button data-a="redo">↷ Refazer</button><button data-a="print">🖨 Imprimir</button><button data-a="save">💾 Salvar no computador</button>';
function folha(cls,extra,html){
  const w=document.createElement('div');w.className='wrap';
  w.innerHTML=`<div class="tb">${extra}<span class="gap"></span>${tbBase}</div><section class="sheet ${cls}">${html}</section>`;
  app.appendChild(w);
}
const T=t=>`<div class="title">${E(t)}</div>`;
function montar(){
  app.innerHTML='';
  folha('',rowBtns,T('Pendências de Atendimentos')+tabela(C4('Ação','Responsável','Vencimento','Status'),7));
  folha('',rowBtns,T('Ações Pendentes')+tabela(C4('Ação','Responsável','Vencimento','Status'),7));
  folha('',rowBtns,T('Pendências de Atendimentos')+tabela(C4('Ação','Responsável','Vencimento','Status'),7));
  folha('c',rowBtns,T('Ações Pendentes')+`<div class="meta"><div>% Aderência Mês Anterior: <span contenteditable="true"></span></div><div>Data Atualiz.: <span contenteditable="true"></span></div></div>`+
    tabela([['Treinamentos',32,0],['ID',14,0],['Data Limite',16,0],['Colaboradores',24,0],['Status',14,1]],12));
  const box=t=>`<div class="box"><div class="bl" contenteditable="true">${t}</div><div class="bv" contenteditable="true"></div></div>`;
  const niv=['Risco Muito Alto','Risco Alto','Risco Médio','Risco Baixo','Risco Eliminado'];
  folha('',' ',T('Matriz de Risco (ART - Análise de Risco de Tarefa)')+`<div class="bands">`+
    niv.map(n=>`<div class="band"><div class="boxes">${box('Condição Inicial')}${box('Condição Atual')}</div><div class="free" contenteditable="true"></div>
    <div class="side"><div class="tools"><button data-a="selband">🎨 faixa</button><button data-a="addbox">+ caixa</button><button data-a="delbox">− caixa</button></div>${stBtn}<div class="lbl" contenteditable="true">${n}</div></div></div>`).join('')+'</div>');
  folha('',rowBtns,T('Plano de Ação')+tabela(C4('Ação','Responsável','Data','Status'),7));
  corFaixas();
}

const COR=['#e0393e','#f29b3a','#f7e94a','#3c9d4e','#2f6fd0'];
function corFaixas(){
  document.querySelectorAll('.bands').forEach(b=>b.querySelectorAll('.band').forEach((f,i)=>{
    if(!f.style.background&&!f.style.backgroundColor)f.style.background=COR[i%5];
  }));
}
/* ---------- persistência e histórico ---------- */
function limpo(el,outer){
  const c=el.cloneNode(true);
  c.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
  return outer?c.outerHTML:c.innerHTML;
}
function salvar(){try{localStorage.setItem(KEY,limpo(app))}catch(e){}}
function snapInit(){H.clear();app.querySelectorAll('.wrap').forEach(w=>H.set(w,{p:[limpo(w)],i:0}))}
function snap(w){
  const h=H.get(w);if(!h)return;
  const s=limpo(w);if(s===h.p[h.i])return;
  h.p=h.p.slice(0,h.i+1);h.p.push(s);
  if(h.p.length>60)h.p.shift();
  h.i=h.p.length-1;
}
function mudou(w){salvar();if(!w)return;clearTimeout(timer);timer=setTimeout(()=>snap(w),500)}
function mover(w,d){
  if(!w)return;snap(w);
  const h=H.get(w);if(!h)return;
  const n=h.i+d;if(n<0||n>=h.p.length)return;
  h.i=n;w.innerHTML=h.p[n];selecionar(null);salvar();
}

/* ---------- seleção e cores ---------- */
function selecionar(el){
  if(sel)sel.classList.remove('sel');
  sel=el;
  if(el){el.classList.add('sel');info.textContent='Quadrado selecionado: escolha a cor e clique em OK.'}
  else info.textContent='Clique em qualquer quadrado para selecioná-lo e escolher as cores.';
}
function pinta(prop,v){
  if(!sel){info.textContent='Primeiro clique em um quadrado.';return}
  sel.style[prop]=v;mudou(sel.closest('.wrap'));
}
const fundo=()=>$('cFundo').value,texto=()=>$('cTexto').value;
$('cFundo').addEventListener('input',()=>pinta('background',fundo()));
$('cTexto').addEventListener('input',()=>pinta('color',texto()));
$('okFundo').onclick=()=>pinta('background',fundo());
$('okTexto').onclick=()=>pinta('color',texto());
$('bLimpa').onclick=()=>{if(!sel)return;sel.style.background='';sel.style.color='';mudou(sel.closest('.wrap'))};
$('bLinha').onclick=()=>{
  if(!sel)return;const tr=sel.closest('tr');if(!tr)return;
  tr.querySelectorAll('td,th').forEach(c=>c.style.background=fundo());mudou(sel.closest('.wrap'));
};
$('bColuna').onclick=()=>{
  if(!sel)return;const cell=sel.closest('td,th'),tb=sel.closest('table');if(!cell||!tb)return;
  const i=[...cell.parentElement.children].indexOf(cell);
  tb.querySelectorAll('tr').forEach(r=>{if(r.children[i])r.children[i].style.background=fundo()});
  mudou(sel.closest('.wrap'));
};
$('bTudo').onclick=()=>{
  if(!sel)return;const w=sel.closest('.wrap');if(!w)return;
  w.querySelectorAll('td,th,.band').forEach(c=>c.style.background=fundo());mudou(w);
};
$('bUndo').onclick=()=>mover(ativo,-1);
$('bRedo').onclick=()=>mover(ativo,1);
$('bPrint').onclick=()=>window.print();
$('bSave').onclick=()=>baixar([...app.querySelectorAll('.wrap')],'quadros-gestao-visual');
$('bReset').onclick=()=>{
  if(!confirm('Voltar ao modelo original? Todo o conteúdo e as cores serão apagados.'))return;
  try{localStorage.removeItem(KEY)}catch(e){}
  selecionar(null);montar();snapInit();
};

/* ---------- imprimir / salvar ---------- */
function imprimirUm(w){document.body.classList.add('um');w.classList.add('alvo');window.print()}
window.addEventListener('afterprint',()=>{document.body.classList.remove('um');document.querySelectorAll('.alvo').forEach(x=>x.classList.remove('alvo'))});
function baixar(lista,nome){
  const clone=document.documentElement.cloneNode(true);
  const a=clone.querySelector('#app');
  const html=lista.map(w=>limpo(w,true)).join('');
  a.innerHTML='';
  const old=clone.querySelector('#estado');if(old)old.remove();
  const s=document.createElement('script');s.id='estado';
  s.textContent='window.__ESTADO__='+JSON.stringify({id:Date.now(),html:html}).replace(/</g,'\\u003c')+';';
  clone.querySelector('head').prepend(s);
  const blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html'});
  const l=document.createElement('a');
  l.href=URL.createObjectURL(blob);l.download=nome+'.html';
  document.body.appendChild(l);l.click();l.remove();
  setTimeout(()=>URL.revokeObjectURL(l.href),2000);
}

/* ---------- eventos da área de folhas ---------- */
app.addEventListener('input',e=>mudou(e.target.closest('.wrap')));
app.addEventListener('paste',e=>{
  if(e.target.closest('[contenteditable]')){
    e.preventDefault();
    document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));
  }
});
app.addEventListener('focusin',e=>{
  const w=e.target.closest('.wrap');if(w)ativo=w;
  if(e.target.closest('.sheet')){const el=e.target.closest(SEL);if(el)selecionar(el)}
});
app.addEventListener('click',e=>{
  const w=e.target.closest('.wrap');if(w)ativo=w;
  const b=e.target.closest('button');
  if(e.target.closest('.sheet')&&!(b&&b.dataset.a)){const el=e.target.closest(SEL);if(el)selecionar(el)}
  if(!b||!w)return;
  if(b.classList.contains('st')){
    b.dataset.s=ST[(ST.indexOf(b.dataset.s)+1)%ST.length];b.className='st '+b.dataset.s;mudou(w);return;
  }
  const a=b.dataset.a;if(!a)return;
  const sh=w.querySelector('.sheet');
  if(a==='undo')return mover(w,-1);
  if(a==='redo')return mover(w,1);
  if(a==='print')return imprimirUm(w);
  if(a==='save'){
    const t=(sh.querySelector('[contenteditable]').textContent||'quadro').trim().replace(/[^\wÀ-ÿ -]/g,'').replace(/\s+/g,'-').toLowerCase();
    return baixar([w],t||'quadro');
  }
  if(a==='addrow'||a==='delrow'){
    const tb=sh.querySelector('tbody'),rs=tb.querySelectorAll('tr');
    if(a==='addrow'){
      const c=rs[rs.length-1].cloneNode(true);
      c.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
      c.querySelectorAll('[contenteditable]').forEach(x=>x.innerHTML='');
      c.querySelectorAll('.st').forEach(x=>{x.dataset.s='';x.className='st'});
      tb.appendChild(c);
    }else if(rs.length>1){if(sel&&rs[rs.length-1].contains(sel))selecionar(null);rs[rs.length-1].remove()}
  }
  if(a==='addbox'||a==='delbox'){
    const bx=b.closest('.band').querySelector('.boxes');
    if(a==='addbox'){
      const d=document.createElement('div');d.className='box';
      d.innerHTML='<div class="bl" contenteditable="true">Nova condição</div><div class="bv" contenteditable="true"></div>';
      bx.appendChild(d);
    }else if(bx.children.length>1)bx.lastElementChild.remove();
  }
  if(a==='selband')selecionar(b.closest('.band'));
  mudou(w);
});

/* ---------- início ---------- */
(function(){
  let s=null;try{s=localStorage.getItem(KEY)}catch(e){}
  if(!s&&EST)s=EST.html;
  if(s)app.innerHTML=s;else montar();
  corFaixas();snapInit();
})();
</script>
</body>
</html>
