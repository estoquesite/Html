<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 8 - Gestão Otimizada de FDS | Portal Vale</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        .uppercase-input { text-transform: uppercase; }

        @keyframes neonDelicado {
            0%, 100% { border-color: #06b6d4; box-shadow: 0 0 8px rgba(6, 182, 212, 0.5); }
            50% { border-color: #3b82f6; box-shadow: 0 0 3px rgba(59, 130, 246, 0.3); }
        }
        .neon-pulsante { animation: neonDelicado 2s infinite alternate ease-in-out; border-width: 1.5px !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-4 sm:p-6 transition-colors duration-200">

    <div class="max-w-7xl mx-auto space-y-5">

        <!-- CABEÇALHO -->
        <header class="flex flex-wrap justify-between items-center bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-cyan-50 dark:bg-cyan-950/60 text-cyan-600 dark:text-cyan-400 rounded-2xl flex items-center justify-center text-2xl font-black shadow-inner">
                    📄
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded bg-cyan-100 dark:bg-cyan-900 text-cyan-700 dark:text-cyan-300">Módulo 8</span>
                        <h1 class="text-base sm:text-lg font-black text-slate-900 dark:text-white uppercase tracking-wide">Gestão Otimizada de FDS</h1>
                    </div>
                    <div class="flex items-center gap-2 mt-0.5">
                        <p class="text-xs text-slate-500 dark:text-slate-400">Portal Vale + Leitura por IA & Nuvem Supabase</p>
                        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        <span class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400">Nuvem Conectada</span>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <a href="index.html" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1">
                    ⬅ Menu Principal
                </a>
                <button onclick="carregarDoSupabase()" class="bg-cyan-600 hover:bg-cyan-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition shadow-sm flex items-center gap-1 cursor-pointer">
                    🔄 Sincronizar
                </button>
            </div>
        </header>

        <!-- AVISO DE STATUS -->
        <div id="alertaSistema" class="hidden p-3 rounded-xl text-xs font-bold text-center transition-all"></div>

        <!-- PAINEL DE CADASTRO OTIMIZADO -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-2">
                <span class="text-xs font-black text-cyan-900 dark:text-cyan-300 uppercase flex items-center gap-1.5">
                    <span>⚡</span> Reconhecimento por Foto e Cadastro Direto
                </span>
                <span class="text-[10px] font-bold text-slate-400">Leitura ágil</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <label class="flex items-center justify-center gap-3 bg-purple-600 hover:bg-purple-700 text-white font-black py-3 px-4 rounded-2xl shadow-md cursor-pointer transition active:scale-95 text-xs">
                    <span class="text-xl">📸</span>
                    <div class="text-left">
                        <span class="block">TIRAR FOTO PARA RECONHECER PRODUTO</span>
                        <span class="block text-[10px] font-normal text-purple-200">A IA lê o nome e fabricante na hora</span>
                    </div>
                    <input type="file" id="inputCameraIa" accept="image/*" capture="environment" class="hidden" onchange="analisarFotoComIa(this.files[0])">
                </label>

                <label class="flex items-center justify-center gap-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 px-4 rounded-2xl shadow-md cursor-pointer transition active:scale-95 text-xs">
                    <span class="text-xl">🖼️</span>
                    <div class="text-left">
                        <span class="block">ESCOLHER FOTO DA GALERIA</span>
                        <span class="block text-[10px] font-normal text-indigo-200">Selecionar print ou imagem salva</span>
                    </div>
                    <input type="file" id="inputGaleriaIa" accept="image/*" class="hidden" onchange="analisarFotoComIa(this.files[0])">
                </label>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-12 gap-3 items-end pt-2">
                <div class="md:col-span-4">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nome do Produto</label>
                    <input type="text" id="inputProduto" placeholder="EX: DEVCON PLASTIC STEEL..." class="uppercase-input neon-pulsante w-full text-xs p-2.5 rounded-xl outline-none bg-white dark:bg-slate-900 dark:text-white font-bold">
                </div>

                <div class="md:col-span-4">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Fabricante</label>
                    <input type="text" id="inputFabricante" placeholder="EX: VONDER, WEG..." class="uppercase-input w-full text-xs p-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white font-bold outline-none">
                </div>

                <div class="md:col-span-4">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Link Direto da FDS (PDF)</label>
                    <input type="text" id="inputLink" placeholder="Cole o link oficial do PDF..." class="w-full text-xs p-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white font-bold outline-none">
                </div>

                <div class="md:col-span-12 flex justify-end gap-2 pt-2">
                    <button type="button" onclick="pesquisarWebFds()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-xl text-xs transition shadow-md flex items-center gap-1.5 cursor-pointer">
                        <span>🌐</span> <span>Pesquisar FDS na Web</span>
                    </button>
                    <button type="button" onclick="salvarFdsSistema()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2.5 px-6 rounded-xl text-xs transition shadow-md flex items-center gap-1.5 cursor-pointer">
                        <span>💾</span> <span>Salvar FDS na Nuvem</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- LISTA DE FDS CADASTRADAS (COMPACTA) -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold uppercase text-slate-700 dark:text-slate-300">
                    📚 Fichas de Dados de Segurança (FDS) Cadastradas
                </h3>
                <span id="labelContadorFds" class="text-[11px] text-slate-400 font-bold">0 DOCUMENTOS</span>
            </div>

            <div id="gridFds" class="space-y-2"></div>
        </div>

    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modalEdicao" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 w-full max-w-lg rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-xs font-black uppercase text-cyan-600">✏️ Editar FDS</h3>
                <button onclick="fecharModalEdicao()" class="text-slate-400 font-black">✕</button>
            </div>
            <input type="hidden" id="editId">
            <div class="space-y-3 text-xs">
                <input type="text" id="editProduto" class="uppercase-input w-full p-2.5 bg-slate-50 dark:bg-slate-900 border rounded-xl font-bold">
                <input type="text" id="editFabricante" class="uppercase-input w-full p-2.5 bg-slate-50 dark:bg-slate-900 border rounded-xl font-bold">
                <input type="text" id="editLink" class="w-full p-2.5 bg-slate-50 dark:bg-slate-900 border rounded-xl">
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onclick="fecharModalEdicao()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">Cancelar</button>
                <button type="button" onclick="guardarEdicaoModal()" class="px-5 py-2 bg-cyan-600 text-white rounded-xl text-xs font-black">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://gloxtswcksbczinpwtzu.supabase.co";
        const SUPABASE_KEY = "sb_publishable_0kEiqthWKZZwjM120wQIYw_Hba7qeLc";
        let supabaseClient = null;
        let listaFds = [];

        window.addEventListener('DOMContentLoaded', () => {
            carregarFdsLocal();
            if (window.supabase) {
                try {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    carregarDoSupabase();
                } catch(e) {}
            }
        });

        function mostrarAviso(msg, tipo = "sucesso") {
            const el = document.getElementById('alertaSistema');
            el.innerText = msg;
            el.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-rose-100', 'text-rose-800');
            el.classList.add(tipo === "sucesso" ? 'bg-emerald-100' : 'bg-rose-100', tipo === "sucesso" ? 'text-emerald-800' : 'text-rose-800');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }

        async function carregarDoSupabase() {
            if (!supabaseClient) return;
            try {
                const { data } = await supabaseClient.from('fds_corporativas').select('*').order('id', { ascending: false });
                if (data) {
                    listaFds = data.map(remoto => ({
                        id: remoto.id,
                        produto: remoto.produto,
                        fabricante: remoto.fabricante || 'NÃO INFORMADO',
                        linkPdf: remoto.link || '',
                        dataRegistro: remoto.data_registro || new Date().toLocaleDateString('pt-BR')
                    }));
                    salvarFdsLocal();
                    renderizarCardsFds();
                    mostrarAviso("✅ FDS sincronizadas com a nuvem!");
                }
            } catch (err) {
                carregarFdsLocal();
            }
        }

        async function analisarFotoComIa(file) {
            if (!file) return;
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert("⚠️ Chave da IA (Gemini) não configurada! Vá ao Módulo 7 para configurar sua chave de API.");
                return;
            }

            mostrarAviso("🤖 IA lendo a foto para identificar o produto...", "sucesso");

            try {
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Analise esta foto de um produto químico ou embalagem. Retorne APENAS um JSON estrito no formato: {\"produto\": \"NOME\", \"fabricante\": \"FABRICANTE\"}. Se não encontrar, deixe em branco." },
                                { inlineData: { mimeType: file.type, data: base64Data } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const textoResposta = data.candidates[0].content.parts[0].text;
                    const jsonLimpo = textoResposta.replace(/```json/g, '').replace(/```/g, '').trim();
                    const resultado = JSON.parse(jsonLimpo);

                    if (resultado.produto) document.getElementById('inputProduto').value = resultado.produto.toUpperCase();
                    if (resultado.fabricante) document.getElementById('inputFabricante').value = resultado.fabricante.toUpperCase();
                }

                mostrarAviso("✅ Produto reconhecido com sucesso!");
            } catch (err) {
                mostrarAviso("ℹ️ Preencha o nome do produto manualmente.");
            }
        }

        function pesquisarWebFds() {
            const produto = document.getElementById('inputProduto').value.trim();
            const fabricante = document.getElementById('inputFabricante').value.trim();
            if (!produto) {
                alert("Digite o nome do produto para pesquisar!");
                document.getElementById('inputProduto').focus();
                return;
            }
            const query = encodeURIComponent(`FDS ${produto} ${fabricante} pdf`);
            window.open(`https://www.google.com/search?q=${query}`, '_blank');
            mostrarAviso(`🌐 Pesquisando FDS para: ${produto}`);
        }

        async function salvarFdsSistema() {
            const produto = document.getElementById('inputProduto').value.trim().toUpperCase();
            const fabricante = document.getElementById('inputFabricante').value.trim().toUpperCase();
            const linkPdf = document.getElementById('inputLink').value.trim();

            if (!produto) {
                alert("Por favor, informe o nome do produto!");
                document.getElementById('inputProduto').focus();
                return;
            }

            const novoItem = {
                id: Date.now(),
                produto,
                fabricante: fabricante || "NÃO INFORMADO",
                linkPdf: linkPdf || "#",
                dataRegistro: new Date().toLocaleDateString('pt-BR')
            };

            listaFds.push(novoItem);
            salvarFdsLocal();
            renderizarCardsFds();
            mostrarAviso(`✅ FDS do produto "${produto}" salva!`);

            document.getElementById('inputProduto').value = '';
            document.getElementById('inputFabricante').value = '';
            document.getElementById('inputLink').value = '';

            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('fds_corporativas').insert([{
                        produto: novoItem.produto,
                        fabricante: novoItem.fabricante,
                        link: novoItem.linkPdf,
                        data_registro: novoItem.dataRegistro
                    }]).select();
                    if (data && data[0]) {
                        novoItem.id = data[0].id;
                        salvarFdsLocal();
                    }
                } catch(e) {}
            }
        }

        function renderizarCardsFds() {
            const grid = document.getElementById('gridFds');
            grid.innerHTML = '';

            if (listaFds.length === 0) {
                grid.innerHTML = `<div class="text-center py-6 text-slate-400 italic text-xs">Nenhum documento cadastrado.</div>`;
                document.getElementById('labelContadorFds').innerText = `0 DOCUMENTOS`;
                return;
            }

            listaFds.forEach((item) => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 p-3 rounded-xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3 text-xs";
                
                card.innerHTML = `
                    <div class="flex items-center gap-3 w-full sm:w-auto truncate">
                        <span class="text-lg">📄</span>
                        <div class="truncate">
                            <h4 class="font-black text-slate-900 dark:text-white uppercase truncate">${item.produto}</h4>
                            <p class="text-[10px] text-slate-500 uppercase font-semibold">Fabricante: ${item.fabricante}</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-shrink-0">
                        <a href="${item.linkPdf}" target="_blank" class="bg-cyan-50 hover:bg-cyan-100 text-cyan-700 font-bold py-1.5 px-3 rounded-lg text-[11px] text-center">Abrir PDF ↗</a>
                        <button onclick="abrirModalEdicao('${item.id}')" class="text-cyan-600 hover:text-cyan-800 font-bold p-1.5 cursor-pointer" title="Editar">✏️</button>
                        <button onclick="removerFds(${item.id})" class="text-rose-500 hover:text-rose-700 font-bold p-1.5 cursor-pointer" title="Excluir">✕</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('labelContadorFds').innerText = `${listaFds.length} DOCUMENTO(S)`;
        }

        function abrirModalEdicao(id) {
            const item = listaFds.find(f => String(f.id) === String(id));
            if (!item) return;
            document.getElementById('editId').value = item.id;
            document.getElementById('editProduto').value = item.produto;
            document.getElementById('editFabricante').value = item.fabricante;
            document.getElementById('editLink').value = item.linkPdf;
            document.getElementById('modalEdicao').classList.remove('hidden');
        }
        function fecharModalEdicao() { document.getElementById('modalEdicao').classList.add('hidden'); }

        async function guardarEdicaoModal() {
            const id = document.getElementById('editId').value;
            const produto = document.getElementById('editProduto').value.trim().toUpperCase();
            const fabricante = document.getElementById('editFabricante').value.trim().toUpperCase();
            const linkPdf = document.getElementById('editLink').value.trim();

            const item = listaFds.find(f => String(f.id) === String(id));
            if (item) {
                item.produto = produto;
                item.fabricante = fabricante;
                item.linkPdf = linkPdf;
                salvarFdsLocal();
                renderizarCardsFds();
                fecharModalEdicao();
                mostrarAviso("Registo atualizado com sucesso!");
                if (supabaseClient) {
                    try { await supabaseClient.from('fds_corporativas').update({ produto, fabricante, link: linkPdf }).eq('id', id); } catch(e){}
                }
            }
        }

        async function removerFds(id) {
            if (confirm("Deseja apagar este registro?")) {
                listaFds = listaFds.filter(f => String(f.id) !== String(id));
                salvarFdsLocal();
                renderizarCardsFds();
                if (supabaseClient) { try { await supabaseClient.from('fds_corporativas').delete().eq('id', id); } catch(e){} }
            }
        }

        function salvarFdsLocal() { localStorage.setItem('portal_vale_fds_base', JSON.stringify(listaFds)); }
        function carregarFdsLocal() {
            const s = localStorage.getItem('portal_vale_fds_base');
            if (s) { try { listaFds = JSON.parse(s); } catch(e){ listaFds = []; } }
            renderizarCardsFds();
        }
    </script>
</body>
</html>
