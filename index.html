<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 8 - Procura de FDS / FISPQ | Portal Vale</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        .uppercase-input { text-transform: uppercase; }

        @keyframes neonDelicado {
            0%, 100% {
                border-color: #38bdf8;
                box-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
            }
            50% {
                border-color: #818cf8;
                box-shadow: 0 0 2px rgba(129, 140, 248, 0.2);
            }
        }
        .neon-pulsante {
            animation: neonDelicado 2s infinite alternate ease-in-out;
            border-width: 1.5px !important;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-4 sm:p-6 transition-colors duration-200">

    <div class="max-w-7xl mx-auto space-y-5">

        <!-- CABEÇALHO -->
        <header class="flex flex-wrap justify-between items-center bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-cyan-50 dark:bg-cyan-950/60 text-cyan-600 dark:text-cyan-400 rounded-2xl flex items-center justify-center text-2xl font-black shadow-inner">
                    📄
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded bg-cyan-100 dark:bg-cyan-900 text-cyan-700 dark:text-cyan-300">Módulo 8</span>
                        <h1 class="text-base sm:text-lg font-black text-slate-900 dark:text-white uppercase tracking-wide">Procura e Gestão de FDS / FISPQ</h1>
                    </div>
                    <div class="flex items-center gap-2 mt-0.5">
                        <p class="text-xs text-slate-500 dark:text-slate-400">Portal Vale + Procura Instantânea na Web</p>
                        <span class="inline-block w-1.5 h-1.5 rounded-full bg-cyan-500"></span>
                        <span class="text-[10px] font-bold text-cyan-600 dark:text-cyan-400">Módulo Ativo</span>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <a href="index.html" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1">
                    ⬅ Menu Principal
                </a>
            </div>
        </header>

        <!-- AVISO DE STATUS -->
        <div id="alertaSistema" class="hidden p-3 rounded-xl text-xs font-bold text-center transition-all"></div>

        <!-- BARRA DE FILTRO E PESQUISA DE FDS -->
        <div class="bg-slate-100 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 p-3.5 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <span class="text-base">🔍</span>
                <span class="text-xs font-black uppercase text-slate-700 dark:text-slate-300 whitespace-nowrap">Filtrar FDS Cadastradas:</span>
            </div>
            
            <div class="flex flex-1 items-center gap-2 w-full">
                <div class="relative w-full">
                    <input type="text" id="inputFiltroFds" oninput="renderizarCardsFds()" placeholder="Pesquisar por nome do produto ou fabricante..." class="uppercase-input w-full text-xs pl-8 pr-7 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl outline-none focus:border-cyan-500 dark:text-white font-bold">
                    <span class="absolute left-2.5 top-2 text-slate-400 text-xs">📄</span>
                </div>
            </div>
        </div>

        <!-- PAINEL DE PROCURA E CADASTRO DE FDS -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-2">
                <span class="text-xs font-black text-cyan-900 dark:text-cyan-300 uppercase flex items-center gap-1.5">
                    <span>🌐</span> Procurar FDS na Internet e Salvar
                </span>
                <span class="text-[10px] font-bold text-slate-400">Insira o produto para buscar</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-12 gap-3 items-end">
                <div class="md:col-span-3">
                    <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Nome do Produto</label>
                    <input type="text" id="fdsProduto" placeholder="EX: ACETONA..." class="uppercase-input neon-pulsante w-full text-xs p-2.5 rounded-xl outline-none bg-white dark:bg-slate-900 dark:text-white font-bold">
                </div>

                <div class="md:col-span-3">
                    <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Fabricante</label>
                    <input type="text" id="fdsFabricante" placeholder="EX: WEG, SHELL..." class="uppercase-input w-full text-xs p-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white font-bold outline-none">
                </div>

                <div class="md:col-span-3">
                    <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Link Direto da FDS (PDF)</label>
                    <input type="text" id="fdsLink" placeholder="Cole o link da FDS aqui..." class="w-full text-xs p-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white font-bold outline-none">
                </div>

                <div class="md:col-span-3">
                    <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Foto / Print do Produto</label>
                    <input type="file" id="fdsFoto" accept="image/*" class="w-full text-xs p-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white font-semibold">
                </div>

                <div class="md:col-span-12 flex justify-end gap-2 pt-2">
                    <button type="button" onclick="pesquisarFdsWeb()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-xl text-xs transition shadow-md flex items-center gap-1.5 cursor-pointer">
                        <span>🌐</span> <span>Procurar FDS na Web</span>
                    </button>
                    <button type="button" onclick="salvarFdsSistema()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2.5 px-6 rounded-xl text-xs transition shadow-md flex items-center gap-1.5 cursor-pointer">
                        <span>💾</span> <span>Salvar FDS no Sistema</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- LISTA DE FDS CADASTRADAS -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold uppercase text-slate-700 dark:text-slate-300">
                    📚 Fichas de Dados de Segurança (FDS) Cadastradas
                </h3>
                <span id="labelContadorFds" class="text-[11px] text-slate-400 font-bold">0 DOCUMENTOS</span>
            </div>

            <div id="gridFds" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

    </div>

    <!-- MODAL DE VISUALIZAÇÃO DE FOTO -->
    <div id="modalFoto" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden" onclick="fecharModalFoto()">
        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-2xl max-w-lg w-full space-y-3 relative" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-2">
                <h3 id="modalFotoTitulo" class="text-xs font-black uppercase text-cyan-600 dark:text-cyan-400">Foto do Produto</h3>
                <button onclick="fecharModalFoto()" class="text-slate-400 hover:text-slate-600 font-black text-sm">✕</button>
            </div>
            <div class="flex justify-center bg-slate-100 dark:bg-slate-900 p-2 rounded-xl">
                <img id="modalFotoImg" src="" alt="Produto" class="max-h-80 object-contain rounded-lg">
            </div>
        </div>
    </div>

    <script>
        let listaFds = [];

        window.addEventListener('DOMContentLoaded', () => {
            carregarFdsLocal();
        });

        function mostrarAviso(msg, tipo = "sucesso") {
            const el = document.getElementById('alertaSistema');
            el.innerText = msg;
            el.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-rose-100', 'text-rose-800');
            if (tipo === "sucesso") {
                el.classList.add('bg-emerald-100', 'text-emerald-800');
            } else {
                el.classList.add('bg-rose-100', 'text-rose-800');
            }
            setTimeout(() => el.classList.add('hidden'), 4000);
        }

        function pesquisarFdsWeb() {
            const produto = document.getElementById('fdsProduto').value.trim();
            if (!produto) {
                alert("Digite o nome do produto para procurar a FDS na internet!");
                document.getElementById('fdsProduto').focus();
                return;
            }
            const query = encodeURIComponent(`FDS FISPQ ${produto} pdf`);
            window.open(`https://www.google.com/search?q=${query}`, '_blank');
            mostrarAviso(`🌐 Procurando FDS para: ${produto}`);
        }

        async function salvarFdsSistema() {
            const produto = document.getElementById('fdsProduto').value.trim().toUpperCase();
            const fabricante = document.getElementById('fdsFabricante').value.trim().toUpperCase();
            const link = document.getElementById('fdsLink').value.trim();
            const inputFoto = document.getElementById('fdsFoto');

            if (!produto) {
                alert("Por favor, informe o nome do produto!");
                document.getElementById('fdsProduto').focus();
                return;
            }

            let fotoUrl = "";
            if (inputFoto.files && inputFoto.files[0]) {
                fotoUrl = URL.createObjectURL(inputFoto.files[0]);
            }

            const novoFds = {
                id: Date.now(),
                produto: produto,
                fabricante: fabricante || "NÃO INFORMADO",
                link: link,
                fotoUrl: fotoUrl,
                dataRegistro: new Date().toLocaleDateString('pt-BR')
            };

            listaFds.unshift(novoFds);
            salvarFdsLocal();
            renderizarCardsFds();
            mostrarAviso(`✅ FDS do produto "${produto}" salva com sucesso!`);

            document.getElementById('fdsProduto').value = '';
            document.getElementById('fdsFabricante').value = '';
            document.getElementById('fdsLink').value = '';
            inputFoto.value = '';
        }

        function renderizarCardsFds() {
            const grid = document.getElementById('gridFds');
            grid.innerHTML = '';

            const termo = document.getElementById('inputFiltroFds') ? document.getElementById('inputFiltroFds').value.trim().toUpperCase() : "";
            let listaExibicao = listaFds;

            if (termo) {
                listaExibicao = listaFds.filter(f => (f.produto || "").includes(termo) || (f.fabricante || "").includes(termo));
            }

            if (listaExibicao.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 italic text-xs">Nenhum documento encontrado.</div>`;
                document.getElementById('labelContadorFds').innerText = `0 DOCUMENTOS`;
                return;
            }

            listaExibicao.forEach((item) => {
                const card = document.createElement('div');
                card.className = "relative bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl shadow-sm space-y-3 flex flex-col justify-between";
                
                let miniaturaHTML = `
                    <div class="absolute right-3 top-3 w-12 h-12 bg-cyan-100 dark:bg-cyan-950 border border-cyan-300 dark:border-cyan-700 rounded-xl flex items-center justify-center shadow-sm overflow-hidden cursor-pointer hover:scale-105 transition" title="Sem foto" onclick="mostrarAviso('Nenhuma foto anexada para este item.')">
                        <span class="text-lg">📄</span>
                    </div>
                `;

                if (item.fotoUrl) {
                    miniaturaHTML = `
                        <div class="absolute right-3 top-3 w-14 h-14 bg-white dark:bg-slate-800 border-2 border-cyan-400 rounded-xl flex items-center justify-center shadow-md overflow-hidden cursor-pointer hover:scale-105 transition" title="Clique para ampliar a foto" onclick="abrirModalFoto('${item.fotoUrl}', '${item.produto}')">
                            <img src="${item.fotoUrl}" alt="Foto" class="w-full h-full object-cover">
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${miniaturaHTML}
                    <div class="pr-16 space-y-1">
                        <span class="text-[9px] font-bold text-slate-400 uppercase">Registo: ${item.dataRegistro}</span>
                        <h4 class="text-xs font-black text-slate-900 dark:text-white uppercase truncate" title="${item.produto}">${item.produto}</h4>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-semibold">Fabricante: ${item.fabricante}</p>
                    </div>

                    <div class="flex items-center gap-2 pt-2 border-t border-slate-200 dark:border-slate-700 text-xs">
                        ${item.link && item.link.startsWith('http') 
                            ? `<a href="${item.link}" target="_blank" class="flex-1 bg-cyan-50 hover:bg-cyan-100 text-cyan-700 dark:bg-cyan-950/60 dark:text-cyan-300 font-bold py-1.5 px-2 rounded-xl text-[11px] transition flex items-center justify-center gap-1">📥 Baixar / Ver FDS</a>` 
                            : '<span class="text-slate-400 text-[10px]">Sem link de FDS</span>'}
                        
                        <button onclick="removerFds(${item.id})" class="text-rose-500 hover:text-rose-700 font-bold p-1.5 cursor-pointer" title="Excluir">✕</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('labelContadorFds').innerText = `${listaExibicao.length} DOCUMENTO(S)`;
        }

        function abrirModalFoto(fotoUrl, produto) {
            if (!fotoUrl) return;
            document.getElementById('modalFotoTitulo').innerText = produto;
            document.getElementById('modalFotoImg').src = fotoUrl;
            document.getElementById('modalFoto').classList.remove('hidden');
        }

        function fecharModalFoto() {
            document.getElementById('modalFoto').classList.add('hidden');
        }

        function removerFds(id) {
            if (confirm("Deseja realmente apagar esta FDS do sistema?")) {
                listaFds = listaFds.filter(f => f.id !== id);
                salvarFdsLocal();
                renderizarCardsFds();
                mostrarAviso("Documento removido com sucesso!");
            }
        }

        function salvarFdsLocal() {
            localStorage.setItem('portal_vale_fds_base', JSON.stringify(listaFds));
        }

        function carregarFdsLocal() {
            const salvo = localStorage.getItem('portal_vale_fds_base');
            if (salvo) {
                try { listaFds = JSON.parse(salvo); } catch(e) { listaFds = []; }
            }
            renderizarCardsFds();
        }
    </script>
</body>
</html>
