<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo 10 - Troca dos Participantes FMDS | Portal Vale v05</title>
<style>
:root {
    --primary: #007e7a;
    --primary-dark: #005a57;
    --vale-green: #10b981;
    --vale-dark-gray: #475569;
    --vale-orange: #f59e0b;
    --vale-blue: #3b82f6;
    --slate-900: #0f172a;
    --slate-700: #334155;
    --slate-600: #475569;
    --slate-300: #cbd5e1;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
    --slate-50: #f8fafc;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
    background: #f8fafc; 
    color: #000; 
    min-height: 100vh; 
    padding: 12px; 
}

/* NOTIFICAÇÃO TOAST */
#toastNotificacao {
    position: fixed; 
    bottom: 24px; 
    right: 24px; 
    background: var(--slate-900); 
    color: #fff;
    padding: 10px 18px; 
    border-radius: 6px; 
    font-size: 11.5px; 
    font-weight: 600;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.25); 
    opacity: 0; 
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease; 
    transform: translateY(12px); 
    z-index: 9999;
}
#toastNotificacao.ativo { opacity: 1; transform: translateY(0); }

/* PAINEL DE CONTROLE */
.painel-controle { 
    background: #ffffff; 
    padding: 16px 20px; 
    margin: 0 auto 14px auto; 
    border-radius: 12px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
    border: 1px solid var(--slate-300); 
    max-width: 960px; 
}
.topo-modulo-info { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    margin-bottom: 10px; 
    border-bottom: 2px solid var(--primary); 
    padding-bottom: 6px; 
}
.badge-modulo { 
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
    color: #fff; 
    font-size: 11.5px; 
    font-weight: 800; 
    padding: 5px 12px; 
    border-radius: 6px; 
    text-transform: uppercase; 
    letter-spacing: 0.8px; 
}
.tag-v05 { 
    background-color: var(--accent); 
    color: #fff; 
    font-weight: 800; 
    font-size: 10px; 
    padding: 2px 7px; 
    border-radius: 4px; 
    margin-left: 6px; 
}

.campos-painel { 
    display: grid; 
    gap: 10px; 
    margin-bottom: 10px; 
    grid-template-columns: 1fr 1.5fr; 
}
.campo-grupo label { 
    display: block; 
    font-weight: 700; 
    margin-bottom: 3px; 
    font-size: 10px; 
    color: var(--slate-700); 
    text-transform: uppercase; 
}
.painel-controle input[type="text"] { 
    width: 100%; 
    font-family: inherit; 
    font-size: 11.5px; 
    padding: 7px 10px; 
    border: 1px solid var(--slate-300); 
    border-radius: 6px; 
    background: #fff; 
    outline: none; 
}
.painel-controle textarea { 
    width: 100%; 
    height: 60px; 
    font-family: inherit; 
    font-size: 11px; 
    padding: 7px 10px; 
    border: 1px solid var(--slate-300); 
    border-radius: 6px; 
    resize: vertical; 
    text-transform: uppercase; 
    background: #fff; 
    outline: none; 
}

.botoes-painel { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.btn { 
    cursor: pointer; 
    padding: 7px 14px; 
    font-size: 11px; 
    font-weight: 700; 
    border: none; 
    border-radius: 6px; 
    color: #fff; 
    display: inline-flex; 
    align-items: center; 
    gap: 5px; 
}
.btn:hover { filter: brightness(1.08); }

.btn-verde { background-color: var(--primary); } 
.btn-salvar { background-color: #2563eb; } 
.btn-carregar { background-color: #0891b2; } 
.btn-voltar { background-color: var(--slate-600); text-decoration: none; } 
.btn-imprimir { background-color: var(--slate-900); margin-left: auto; }

/* FOLHA A4 RETRATO PREENCHENDO DE PONTA A PONTA */
.folha-a4 { 
    width: 100%; 
    max-width: 960px; 
    background: #fff; 
    padding: 12px 16px; 
    margin: 0 auto 20px auto; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
    border-radius: 8px; 
    border: 1.5px solid #000; 
}

/* CABEÇALHO PADRÃO VALE */
.cabecalho-container, .info-bar, table.tabela-fmds { 
    width: 100%; 
    border-collapse: collapse; 
    border: 2px solid #000; 
    margin-bottom: 4px; 
    table-layout: fixed; 
}
.cabecalho-container td, .info-bar td { 
    border: 1.5px solid #000; 
    padding: 3px 6px; 
    vertical-align: middle; 
    text-align: center; 
}
.logo-box { 
    width: 85px; 
    font-weight: 900; 
    font-size: 15px; 
    color: #007e7a; 
    letter-spacing: 1.5px; 
}
.titulo-box { 
    font-size: 11px; 
    font-weight: 900; 
    text-transform: uppercase; 
    color: #000; 
    padding: 0 8px; 
}
.meta-box { 
    width: 120px; 
    font-size: 8px; 
    text-align: left !important; 
    padding-left: 6px !important; 
    line-height: 1.3; 
    font-weight: 700;
}

.info-bar { font-size: 8px; font-weight: 700; }
.info-bar td { text-align: left; padding: 2px 6px; }

/* TABELA FMDS SEM A COLUNA DSS */
table.tabela-fmds th, table.tabela-fmds td { 
    border: 1.5px solid #000; 
    text-align: center; 
    vertical-align: middle; 
    font-size: 9px; 
    height: 29px; 
    padding: 2px 4px; 
}
table.tabela-fmds th { 
    color: #fff; 
    font-weight: 900; 
    text-transform: uppercase; 
    font-size: 8.5px; 
    letter-spacing: 0.3px;
}

/* CORES DOS PILARES */
.th-header-base { background-color: var(--primary) !important; }
.th-ssma { background-color: #10b981 !important; } /* Verde */
.th-pessoas { background-color: #475569 !important; } /* Cinza Escuro */
.th-prod { background-color: #f59e0b !important; } /* Laranja / Âmbar */
.th-qual { background-color: #3b82f6 !important; } /* Azul */

table.tabela-fmds tbody tr { background-color: #fff; }

.col-nome-part { text-align: left !important; font-weight: 700; text-transform: uppercase; padding-left: 8px !important; width: 260px; outline: none; }
.col-celula-fmds { outline: none; font-weight: 600; }
.col-acoes { width: 35px; }

.botoes-acoes { display: flex; align-items: center; justify-content: center; gap: 2px; opacity: 0.3; }
tr:hover .botoes-acoes { opacity: 1; }
.btn-acao { background: #fff; border: 1px solid #cbd5e1; border-radius: 3px; cursor: pointer; padding: 1px 3px; font-size: 8px; }

/* IMPRESSÃO A4 RETRATO */
@media print {
    @page { size: A4 portrait; margin: 3mm 4mm !important; }
    body { background: #fff !important; margin: 0 !important; padding: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .painel-controle, .botoes-acoes, .barra-controle-folha, .col-acoes, th.th-acoes, #toastNotificacao { display: none !important; }
    .folha-a4 { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
    table.tabela-fmds th.th-header-base { background-color: var(--primary) !important; color: #fff !important; }
    table.tabela-fmds th.th-ssma { background-color: #10b981 !important; color: #fff !important; }
    table.tabela-fmds th.th-pessoas { background-color: #475569 !important; color: #fff !important; }
    table.tabela-fmds th.th-prod { background-color: #f59e0b !important; color: #fff !important; }
    table.tabela-fmds th.th-qual { background-color: #3b82f6 !important; color: #fff !important; }
}
</style>
</head>
<body>

    <div id="toastNotificacao">Mensagem</div>

    <div class="painel-controle">
        <div class="topo-modulo-info">
            <span class="badge-modulo">Módulo 10: Troca dos Participantes FMDS <span class="tag-v05">v05</span></span>
            <a href="index.html" class="btn btn-voltar">⬅ Voltar ao Menu</a>
        </div>
        <div class="campos-painel">
            <div class="campo-grupo">
                <label>Ano:</label>
                <input type="text" id="anoInputFmds" value="2026" oninput="sincronizarCabecalhosFmds()">
            </div>
            <div class="campo-grupo">
                <label>Área / Setor:</label>
                <input type="text" id="areaInputFmds" placeholder="Operação / Manutenção" oninput="sincronizarCabecalhosFmds()">
            </div>
        </div>
        <div class="campo-grupo">
            <label>Lista de Participantes (Um por linha - exatos 24 preenchem a folha inteira):</label>
            <textarea id="nomesInputFmds" placeholder="COLE OS NOMES AQUI..." oninput="atualizarNomesFmds()"></textarea>
        </div>
        <div class="botoes-painel">
            <button type="button" class="btn btn-verde" onclick="atualizarNomesFmds()">⚡ Gerar / Atualizar Tabela</button>
            <button type="button" class="btn btn-salvar" onclick="salvarTudoFmds()">💾 Salvar</button>
            <button type="button" class="btn btn-carregar" onclick="carregarTudoFmds()">📂 Carregar</button>
            <button type="button" class="btn btn-imprimir" onclick="window.print()">🖨️ Imprimir</button>
        </div>
    </div>

    <div id="contentorFolhaFmds"></div>

    <script>
        function mostrarToast(msg) {
            const toast = document.getElementById('toastNotificacao');
            toast.innerText = msg;
            toast.classList.add('ativo');
            setTimeout(() => { toast.classList.remove('ativo'); }, 2600);
        }

        function sincronizarCabecalhosFmds() {
            const ano = document.getElementById('anoInputFmds').value || '2026';
            const area = document.getElementById('areaInputFmds').value || '---';
            const elAno = document.querySelector('.val-ano');
            const elArea = document.querySelector('.val-area');
            if(elAno) elAno.innerText = ano;
            if(elArea) elArea.innerText = area;
        }

        function criarEstruturaFmds(nomesArr) {
            let linhas = '';
            const listaPadrao = [
                "ALFREDO AUGUSTO RAMOS NETO", "ALLAN SOUZA DE CARVALHO", "ATMISTO SILVA", "ANDRÉ", 
                "BIANCA MEDEIROS", "BRUNO GOMES FIDELIS", "BRUNO RICARDO", "CAIO FELIX", 
                "CAIO HENRIQUE", "DAVID MARCELO DELGADO DOS SANTOS", "DOMINIQUE SILVA", "EDUARDO SILVA", 
                "EMERSON RIBEIRO DOS SANTOS", "GABRIEL CARNEIRO", "GLEIVSTON SILVA MENDES", "HUMBERTO EXALTACAO DA SILVA", 
                "MARCOS AURELIO CAVALLARES MATTOS", "MARIANA PEREIRA CRUZ", "PABLO MESQUITA", "PAULO HENRIQUE", 
                "RICHARD SILVA", "RICARDO GONCALVES DE MELLO LEITE", "ROBSON DE SOUZA MENDONCA", "TITO DACAL"
            ];
            const lista = nomesArr.length > 0 ? nomesArr : listaPadrao;

            lista.forEach((nome) => {
                linhas += `<tr>
                    <td class="col-nome-part" contenteditable="true">${nome.toUpperCase()}</td>
                    <td class="col-celula-fmds" contenteditable="true"></td>
                    <td class="col-celula-fmds" contenteditable="true"></td>
                    <td class="col-celula-fmds" contenteditable="true"></td>
                    <td class="col-celula-fmds" contenteditable="true"></td>
                    <td class="col-acoes th-acoes"><div class="botoes-acoes"><button type="button" class="btn-acao" onclick="this.closest('tr').remove()">✕</button></div></td>
                </tr>`;
            });

            const ano = document.getElementById('anoInputFmds').value || '2026';
            const area = document.getElementById('areaInputFmds').value || '---';

            const div = document.createElement('div');
            div.className = 'folha-a4';
            div.innerHTML = `
                <table class="cabecalho-container">
                    <tr>
                        <td class="logo-box">VALE</td>
                        <td class="titulo-box">CONTROLE / TROCA DOS PARTICIPANTES FMDS</td>
                        <td class="meta-box">
                            <strong>Ano:</strong> <span class="val-ano">${ano}</span><br>
                            <span><strong>Página:</strong> 01 / 01</span>
                        </td>
                    </tr>
                </table>
                <table class="info-bar">
                    <tr>
                        <td><strong>Área / Setor:</strong> <span class="val-area campo-editavel" contenteditable="true">${area}</span></td>
                    </tr>
                </table>
                <table class="tabela-fmds">
                    <thead>
                        <tr>
                            <th style="width:260px;" class="th-header-base">PARTICIPANTES</th>
                            <th class="th-ssma">SSMA</th>
                            <th class="th-pessoas">PESSOAS</th>
                            <th class="th-prod">PRODUTIVIDADE</th>
                            <th class="th-qual">QUALIDADE</th>
                            <th class="col-acoes th-acoes th-header-base">AÇÃO</th>
                        </tr>
                    </thead>
                    <tbody>${linhas}</tbody>
                </table>`;
            return div;
        }

        function atualizarNomesFmds() {
            const txt = document.getElementById('nomesInputFmds').value.trim();
            const nomes = txt ? txt.split('\n').map(n => n.trim()).filter(n => n.length > 0) : [];
            const box = document.getElementById('contentorFolhaFmds');
            box.innerHTML = '';
            box.appendChild(criarEstruturaFmds(nomes));
            mostrarToast('Tabela de participantes gerada!');
        }

        function salvarTudoFmds() {
            let nomes = [];
            document.querySelectorAll('.col-nome-part').forEach(td => {
                if(td.innerText.trim()) nomes.push(td.innerText.trim());
            });
            const dados = {
                ano: document.getElementById('anoInputFmds').value,
                area: document.getElementById('areaInputFmds').value,
                nomes: nomes
            };
            localStorage.setItem('valefmds_v05', JSON.stringify(dados));
            mostrarToast('Dados salvos com sucesso!');
        }

        function carregarTudoFmds() {
            const s = localStorage.getItem('valefmds_v05');
            if(s) {
                const res = JSON.parse(s);
                if(res.ano) document.getElementById('anoInputFmds').value = res.ano;
                if(res.area) document.getElementById('areaInputFmds').value = res.area;
                if(res.nomes) {
                    document.getElementById('nomesInputFmds').value = res.nomes.join('\n');
                    atualizarNomesFmds();
                }
                mostrarToast('Dados carregados com sucesso!');
            } else {
                mostrarToast('Nenhum dado salvo encontrado.');
            }
        }

        window.onload = function() {
            atualizarNomesFmds();
        };
    </script>
</body>
</html>
