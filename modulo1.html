<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo 1 - DDS & Emociograma | Portal Vale v03</title>
<style>
:root{--primary:#007e7a;--primary-dark:#005a57;--primary-light:#e6f4f4;--accent:#f59e0b;--danger:#ef4444;--success:#10b981;--s900:#0f172a;--s700:#334155;--s600:#475569;--s200:#e2e8f0;--s100:#f1f5f9;--s50:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#edf2f7;color:var(--s900);min-height:100vh;padding:14px}
#toastNotificacao{position:fixed;bottom:24px;right:24px;background:var(--s900);color:#fff;padding:10px 18px;border-radius:6px;font-size:12px;font-weight:600;box-shadow:0 10px 25px -5px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.25s;transform:translateY(12px);z-index:9999}
#toastNotificacao.ativo{opacity:1;transform:none}
.painel-controle{background:#fff;padding:16px 20px;margin:0 auto 16px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.04);border:1px solid var(--s200);max-width:1120px}
.topo-modulo-info{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;border-bottom:2px solid var(--primary);padding-bottom:8px;gap:8px;flex-wrap:wrap}
.badge-modulo{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:11px;font-weight:800;padding:5px 12px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.tag-v02{background:var(--accent);color:#fff;font-weight:800;font-size:9.5px;padding:2px 6px;border-radius:4px;margin-left:6px}
.campos-painel{display:grid;gap:12px;margin-bottom:10px;grid-template-columns:2fr 1fr 1fr}
.campo-grupo label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px;font-size:10.5px;color:var(--s600);text-transform:uppercase}
.painel-controle input[type=text],.painel-controle textarea{width:100%;font-family:inherit;font-size:12px;padding:7px 10px;border:1px solid #cbd5e1;border-radius:6px;background:var(--s50);outline:none;transition:.2s}
.painel-controle textarea{height:90px;resize:vertical;text-transform:uppercase}
.painel-controle input:focus,.painel-controle textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(0,126,122,.12)}
.contador-colaboradores{font-size:10px;font-weight:700;color:var(--primary);text-transform:none}
.contador-colaboradores.aviso{color:var(--danger)}
.botoes-painel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{cursor:pointer;padding:7px 12px;font-size:11px;font-weight:700;border:none;border-radius:6px;color:#fff;display:inline-flex;align-items:center;gap:5px;transition:filter .15s,transform .05s;text-decoration:none}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn-verde{background:var(--success)}.btn-azul{background:var(--primary)}.btn-add-folha{background:#7c3aed}.btn-renumerar{background:#ea580c}.btn-salvar{background:#2563eb}.btn-carregar{background:#0284c7}.btn-exportar{background:#0891b2}
.btn-limpar{background:var(--s100);color:var(--s600);border:1px solid #cbd5e1}
.btn-voltar{background:var(--s600)}.btn-imprimir{background:var(--s900);margin-left:auto}
.dica{font-size:10px;color:var(--s600);margin-top:6px}
.rolagem{overflow-x:auto}
.folha-a4{width:100%;max-width:1120px;background:#fff;padding:12px 14px;margin:0 auto 16px;box-shadow:0 4px 18px rgba(0,0,0,.05);border-radius:8px;border:1px solid var(--s200)}
.folha-a4 .rolagem>table{min-width:900px}
.barra-controle-folha{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;background:var(--s50);padding:5px 10px;border:1px solid var(--s200);border-radius:5px;gap:6px;flex-wrap:wrap}
.grupo-acoes-linhas{display:flex;gap:6px}
.btn-linha-topo,.btn-remover-folha{border-radius:4px;font-size:10px;font-weight:700;padding:3px 8px;cursor:pointer;background:#fff}
.btn-linha-topo{border:1px solid var(--primary);color:var(--primary)}
.btn-remover-folha{color:var(--danger);border:1px solid #fca5a5}
.cabecalho-container,.info-dds,table.tabela-dds{width:100%;border-collapse:collapse;border:1.2px solid var(--s900);margin-bottom:3px;table-layout:fixed}
.cabecalho-container td,.info-dds td{border:1px solid var(--s700);padding:3px 6px;text-align:center;vertical-align:middle}
.logo-box{width:115px;font-weight:900;font-size:16px;color:var(--primary);letter-spacing:1.5px;background:var(--s50)}
.titulo-box{font-size:10.5px;font-weight:800;text-transform:uppercase}
.meta-box{width:130px;font-size:8.5px;text-align:left!important;padding-left:8px!important;background:var(--s50)}
.campo-editavel{outline:none;display:inline-block;min-width:25px;font-size:8.5px;font-weight:600}
table.tabela-dds th,table.tabela-dds td{border:1px solid var(--s700);text-align:center;vertical-align:middle}
table.tabela-dds th{background:var(--s50);font-weight:800}
table.tabela-dds tbody tr:nth-child(even){background:#fafbfc}
table.tabela-dds tbody tr:hover{background:#f0fafa}
table.tabela-dds td{height:21.5px;padding:1px 2px}
.tabela-dds .col-id{width:36px!important;background:var(--s100)!important;font-weight:800}
.col-id-container,.col-nome-container{display:flex;align-items:center;width:100%}
.col-id-container{justify-content:center}
.col-id-texto{outline:none;font-size:9px;font-weight:800;background:#e2e8f0;padding:1px 4px;border-radius:3px;width:100%;text-align:center}
.col-id-texto:focus{background:#fef3c7}
.tabela-dds .col-colaborador{width:240px!important;text-align:left}
.col-nome-container{justify-content:space-between;padding:0 4px;gap:4px}
.col-nome-texto{flex-grow:1;text-align:left;outline:none;white-space:nowrap;overflow:hidden;font-size:8.5px;font-weight:700;text-transform:uppercase;min-height:11px}
.col-nome-texto:focus,.col-rubrica:focus{background:#fef3c7}
.botoes-acoes{display:flex;gap:2px;opacity:.3;transition:opacity .2s}
tr:hover .botoes-acoes,tr:focus-within .botoes-acoes{opacity:1}
.btn-acao{background:var(--s100);border:1px solid #cbd5e1;border-radius:3px;cursor:pointer;padding:1px 3px;font-size:8px;line-height:1}
.btn-lixeira{color:var(--danger);border-color:#fca5a5}.btn-mais-linha{color:var(--success);border-color:#6ee7b7;font-weight:900}.btn-menos-linha{color:var(--accent);border-color:#fcd34d;font-weight:900}
.th-dia-semana{font-size:8.5px;font-weight:800;text-transform:uppercase;padding:3px 0;background:linear-gradient(180deg,var(--primary-light),#d8ecec)!important;color:var(--primary-dark)}
.btn-preencher-dia{margin-left:4px;font-size:9px;cursor:pointer;background:none;border:none;color:var(--primary-dark)}
.btn-preencher-dia:hover{color:var(--success)}
.th-sub{font-size:7.5px!important;font-weight:800;background:var(--s100)!important;padding:2px 0}
.col-como-estou{width:55px;min-width:55px;padding:1px!important}
.col-rubrica{width:45px;min-width:45px;outline:none;font-size:8.5px;background:#fff}
.grupo-carinhas{display:flex;align-items:center;justify-content:space-evenly;width:100%;gap:1px}
.carinha-item{display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none;line-height:1;padding:1px;border-radius:3px;outline:none}
.carinha-item:focus-visible{box-shadow:0 0 0 2px var(--primary)}
.carinha-num{font-size:6px;font-weight:800;color:var(--s600);margin-bottom:.5px}
.carinha-svg{width:11px;height:11px;display:block}
.c-verde .rosto{stroke:var(--success);stroke-width:2.2;fill:#ecfdf5}.c-verde .olho{fill:var(--success)}.c-verde .boca{stroke:var(--success);stroke-width:2.2;stroke-linecap:round;fill:none}
.c-amarela .rosto{stroke:var(--accent);stroke-width:2.2;fill:#fffbeb}.c-amarela .olho{fill:var(--accent)}.c-amarela .boca{stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;fill:none}
.c-vermelha .rosto{stroke:var(--danger);stroke-width:2.2;fill:#fef2f2}.c-vermelha .olho{fill:var(--danger)}.c-vermelha .boca{stroke:var(--danger);stroke-width:2.2;stroke-linecap:round;fill:none}
.carinha-item.selecionado-1{background:#d1fae5;outline:1.2px solid var(--success)}
.carinha-item.selecionado-2{background:#fef3c7;outline:1.2px solid var(--accent)}
.carinha-item.selecionado-3{background:#fee2e2;outline:1.2px solid var(--danger)}
.rodape-container{display:grid;grid-template-columns:140px 1.4fr 1.8fr;gap:6px;font-size:7.5px;line-height:1.25;margin-top:4px}
.box-legenda{border:1px solid #cbd5e1;padding:4px 6px;background:var(--s50);border-radius:5px}
.box-legenda h4{margin:0 0 2px;font-size:8px;font-weight:800;text-transform:uppercase;border-bottom:1px solid var(--s200);padding-bottom:2px;color:var(--primary-dark)}
.lista-legenda{list-style:none}.lista-legenda li{margin-bottom:1.5px}
@media(max-width:700px){.campos-painel{grid-template-columns:1fr}.btn-imprimir{margin-left:0}.rodape-container{grid-template-columns:1fr}}
@media print{
@page{size:A4 landscape;margin:3mm 4mm}
body{background:#fff!important;padding:0!important}
.painel-controle,.botoes-acoes,.barra-controle-folha,.btn-preencher-dia,#toastNotificacao{display:none!important}
.rolagem{overflow:visible}.folha-a4 .rolagem>table{min-width:0}
.folha-a4{box-shadow:none!important;border:none!important;width:100%!important;max-width:100%!important;padding:0!important;margin:0!important;break-after:page;page-break-after:always}
.folha-a4:last-child{break-after:auto;page-break-after:auto}
table.tabela-dds tbody tr:hover{background:inherit}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="toastNotificacao" role="status" aria-live="polite">Mensagem</div>
<input type="file" id="arquivoBackupDDS" style="display:none" accept=".json" onchange="processarArquivoBackup(this)">

<div class="painel-controle">
  <div class="topo-modulo-info">
    <span class="badge-modulo">Módulo 1: DDS & Emociograma <span class="tag-v02">v03</span></span>
    <a href="index.html" class="btn btn-voltar">⬅ Voltar ao Menu</a>
  </div>
  <div class="campos-painel">
    <div class="campo-grupo"><label for="periodoInputDDS">Período:</label><input type="text" id="periodoInputDDS" placeholder="21/09 a 25/09" oninput="sincronizarCabecalhos()"></div>
    <div class="campo-grupo"><label for="semanaInputDDS">Semana:</label><input type="text" id="semanaInputDDS" placeholder="38" inputmode="numeric" oninput="sincronizarCabecalhos()"></div>
    <div class="campo-grupo"><label for="anoInputDDS">Ano:</label><input type="text" id="anoInputDDS" value="2026" inputmode="numeric" oninput="sincronizarCabecalhos()"></div>
  </div>
  <div class="campo-grupo">
    <label for="nomesInputDDS"><span>Lista de Colaboradores (A-Z automático):</span><span id="contadorColaboradores" class="contador-colaboradores">0 colaboradores | 1 folha(s)</span></label>
    <textarea id="nomesInputDDS" oninput="atualizarContadorNomes()" placeholder="COLE OS NOMES AQUI (UM POR LINHA)..."></textarea>
  </div>
  <div class="botoes-painel">
    <button type="button" class="btn btn-verde" onclick="aplicarDadosDDS('verde')">Gerar c/ Carinha 1 (A-Z)</button>
    <button type="button" class="btn btn-azul" onclick="aplicarDadosDDS('limpo')">Gerar Limpo (A-Z)</button>
    <button type="button" class="btn btn-add-folha" onclick="adicionarFolhaManualDDS()">📄➕ Folha Extra</button>
    <button type="button" class="btn btn-renumerar" onclick="reordenarNumDDS(true)">🔢 Renumerar</button>
    <button type="button" class="btn btn-salvar" onclick="salvarTudoDDS()">💾 Salvar</button>
    <button type="button" class="btn btn-carregar" onclick="carregarTudoDDS()">📂 Carregar</button>
    <button type="button" class="btn btn-exportar" onclick="exportarBackupJSON()">⬇️ Backup</button>
    <button type="button" class="btn btn-exportar" onclick="document.getElementById('arquivoBackupDDS').click()">⬆️ Restaurar</button>
    <button type="button" class="btn btn-limpar" onclick="limparTudoDDS()">Limpar</button>
    <button type="button" class="btn btn-imprimir" onclick="window.print()">🖨️ Imprimir</button>
  </div>
  <p class="dica">💾 Salvamento automático ativo neste navegador. Use Backup para guardar um arquivo. Enter move para a linha de baixo.</p>
</div>

<div id="contentorFolhasDDS"></div>

<script>
const TOTAL_LINHAS_DDS = 24, CHAVE = 'valedds_v02';
const $ = id => document.getElementById(id);
const pad = n => n < 10 ? '0' + n : '' + n;
let _toast, _auto;

function mostrarToast(msg) {
  const t = $('toastNotificacao'); t.innerText = msg; t.classList.add('ativo');
  clearTimeout(_toast); _toast = setTimeout(() => t.classList.remove('ativo'), 2600);
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function sincronizarCabecalhos() {
  const v = { '.info-periodo': $('periodoInputDDS').value, '.info-semana': $('semanaInputDDS').value, '.info-ano': $('anoInputDDS').value };
  document.querySelectorAll('#contentorFolhasDDS .folha-a4').forEach(f => {
    for (const k in v) { const el = f.querySelector(k); if (el) el.innerText = v[k]; }
  });
  agendarAutoSave();
}

function lerNomes() {
  return $('nomesInputDDS').value.toUpperCase().split('\n').map(l => l.trim()).filter(Boolean);
}
function atualizarContadorNomes() {
  const ta = $('nomesInputDDS'), pos = ta.selectionStart;
  ta.value = ta.value.toUpperCase(); ta.setSelectionRange(pos, pos);
  const nomes = lerNomes(), total = nomes.length;
  const dup = total - new Set(nomes).size;
  const folhas = Math.max(1, Math.ceil(total / TOTAL_LINHAS_DDS));
  const c = $('contadorColaboradores');
  c.innerText = `${total} colaborador(es) | ${folhas} folha(s)` + (dup ? ` | ⚠ ${dup} repetido(s)` : '');
  c.classList.toggle('aviso', dup > 0);
}

function svgCarinha(tipo) {
  const boca = tipo === 1 ? '<path class="boca" d="M 9.5 18 C 12 23 20 23 22.5 18"/>'
             : tipo === 2 ? '<line class="boca" x1="10" y1="20" x2="22" y2="20"/>'
             : '<path class="boca" d="M 9.5 22 C 12 17 20 17 22.5 22"/>';
  return `<svg class="carinha-svg" viewBox="0 0 32 32"><circle class="rosto" cx="16" cy="16" r="14"/><circle class="olho" cx="11.5" cy="12.5" r="1.7"/><circle class="olho" cx="20.5" cy="12.5" r="1.7"/>${boca}</svg>`;
}
function gerarBlocoComoEstou(sel = null) {
  const cfg = [[1,'c-verde','Plenas condições'],[2,'c-amarela','Alterado'],[3,'c-vermelha','Sem condições']];
  return '<div class="grupo-carinhas">' + cfg.map(([n, cor, tit]) =>
    `<div class="carinha-item ${cor} ${sel === n ? 'selecionado-' + n : ''}" role="button" tabindex="0" onclick="alternarDestaque(this,${n})" title="${tit}"><span class="carinha-num">${n}</span>${svgCarinha(n)}</div>`
  ).join('') + '</div>';
}
function alternarDestaque(el, tipo) {
  const ja = el.classList.contains('selecionado-' + tipo);
  el.closest('.grupo-carinhas').querySelectorAll('.carinha-item').forEach(i => i.classList.remove('selecionado-1','selecionado-2','selecionado-3'));
  if (!ja) el.classList.add('selecionado-' + tipo);
}
function preencherColunaDia(botao, idx) {
  botao.closest('.folha-a4').querySelectorAll('.corpo-tabela-folha tr').forEach(tr => {
    const c = tr.querySelectorAll('.col-como-estou')[idx];
    const v = c && c.querySelector('.c-verde');
    if (v) { v.closest('.grupo-carinhas').querySelectorAll('.carinha-item').forEach(i => i.classList.remove('selecionado-1','selecionado-2','selecionado-3')); v.classList.add('selecionado-1'); }
  });
  mostrarToast('Coluna do dia preenchida com Carinha 1');
  agendarAutoSave();
}

function criarHTMLLinhaDDS(numStr, nome = '', val = null) {
  const dia = `<td class="col-como-estou">${gerarBlocoComoEstou(val)}</td><td class="col-rubrica" contenteditable="true" title="Rubrica"></td>`;
  return `<td class="col-id"><div class="col-id-container"><span class="col-id-texto" contenteditable="true" title="Editar número">${numStr}</span></div></td>
  <td class="col-colaborador"><div class="col-nome-container"><span class="col-nome-texto" contenteditable="true" oninput="this.innerText=this.innerText.toUpperCase()" title="Nome do colaborador">${esc(nome)}</span>
  <div class="botoes-acoes"><button type="button" class="btn-acao btn-mais-linha" onclick="adicionarLinhaAbaixoDDS(this)" title="Adicionar linha abaixo">➕</button><button type="button" class="btn-acao btn-menos-linha" onclick="removerLinhaAtualDDS(this)" title="Remover linha">➖</button><button type="button" class="btn-acao btn-lixeira" onclick="apagarLinhaDDS(this)" title="Apagar nome">🗑️</button></div></div></td>${dia.repeat(5)}`;
}

function apagarLinhaDDS(b) { b.closest('tr').querySelector('.col-nome-texto').innerText = ''; agendarAutoSave(); }

function reordenarNumDDS(notificar = false) {
  let n = 1;
  document.querySelectorAll('#contentorFolhasDDS .corpo-tabela-folha tr .col-id-texto').forEach(s => { s.innerText = pad(n++); });
  if (notificar) mostrarToast('Numeração sequencial atualizada (contínua entre folhas)');
  agendarAutoSave();
}
function adicionarLinhaAbaixoDDS(b) {
  const tr = b.closest('tr'), nova = document.createElement('tr');
  nova.innerHTML = criarHTMLLinhaDDS('00'); tr.after(nova); reordenarNumDDS();
}
function removerLinhaAtualDDS(b) {
  const tr = b.closest('tr');
  if (tr.parentNode.querySelectorAll('tr').length <= 1) return;
  tr.remove(); reordenarNumDDS();
}
function adicionarLinhaFimDDS(b) {
  const nova = document.createElement('tr'); nova.innerHTML = criarHTMLLinhaDDS('00');
  b.closest('.folha-a4').querySelector('.corpo-tabela-folha').appendChild(nova); reordenarNumDDS();
}
function removerLinhaFimDDS(b) {
  const l = b.closest('.folha-a4').querySelectorAll('.corpo-tabela-folha tr');
  if (l.length <= 1) return;
  l[l.length - 1].remove(); reordenarNumDDS();
}
function removerFolhaDDS(b) {
  if (document.querySelectorAll('#contentorFolhasDDS .folha-a4').length <= 1) { mostrarToast('Mantenha pelo menos uma folha.'); return; }
  if (!confirm('Remover esta folha e todos os dados dela?')) return;
  b.closest('.folha-a4').remove(); atualizarPaginacaoDDS(); reordenarNumDDS();
}

function criarEstruturaFolhaDDS(nomes, padrao, tot, offset = 0) {
  let linhas = '';
  for (let i = 0; i < tot; i++) linhas += `<tr>${criarHTMLLinhaDDS(pad(offset + i + 1), nomes[i] ? nomes[i].trim().toUpperCase() : '', padrao ? 1 : null)}</tr>`;
  const dias = ['Segunda','Terça','Quarta','Quinta','Sexta'];
  const f = document.createElement('div'); f.className = 'folha-a4';
  f.innerHTML = `
  <div class="barra-controle-folha">
    <div class="grupo-acoes-linhas"><button type="button" class="btn-linha-topo" onclick="adicionarLinhaFimDDS(this)">➕ Linha no Fim</button><button type="button" class="btn-linha-topo" onclick="removerLinhaFimDDS(this)">➖ Remover Última</button></div>
    <button type="button" class="btn-remover-folha" onclick="removerFolhaDDS(this)">Remover Folha ✕</button>
  </div>
  <div class="rolagem">
  <table class="cabecalho-container"><tr><td class="logo-box">VALE</td><td class="titulo-box">DIÁLOGO DIÁRIO DE SEGURANÇA (DDS) E EMOCIOGRAMA</td><td class="meta-box"><span class="indicador-folha"><strong>Folha:</strong> 01 / 01</span></td></tr></table>
  <table class="info-dds"><tr>
    <td><strong>Período:</strong> <span class="campo-editavel info-periodo" contenteditable="true">${esc($('periodoInputDDS').value)}</span></td>
    <td><strong>Semana:</strong> <span class="campo-editavel info-semana" contenteditable="true">${esc($('semanaInputDDS').value)}</span></td>
    <td><strong>Ano:</strong> <span class="campo-editavel info-ano" contenteditable="true">${esc($('anoInputDDS').value)}</span></td>
  </tr></table>
  <table class="tabela-dds"><thead>
    <tr><th rowspan="2" class="col-id">Nº</th><th rowspan="2" class="col-colaborador" style="padding-left:6px;text-align:left">Colaborador</th>
    ${dias.map((d, i) => `<th colspan="2" class="th-dia-semana">${d} <button type="button" class="btn-preencher-dia" onclick="preencherColunaDia(this,${i})" title="Preencher ${d} com 1">⚡</button></th>`).join('')}</tr>
    <tr>${'<th class="th-sub">Estou</th><th class="th-sub">Rub</th>'.repeat(5)}</tr>
  </thead><tbody class="corpo-tabela-folha">${linhas}</tbody></table>
  <div class="rodape-container">
    <div class="box-legenda"><h4>Legenda:</h4><ul class="lista-legenda"><li><strong>FE</strong> = Feriado</li><li><strong>AT</strong> = Atestado Médico</li><li><strong>CO</strong> = Compensação</li><li><strong>FA</strong> = Falta</li><li><strong>FR</strong> = Férias</li><li><strong>FO</strong> = Folga</li></ul></div>
    <div class="box-legenda"><h4>Ação tomada:</h4><ul class="lista-legenda"><li><strong>EST/SUP</strong> = Estratégia/Suprimentos</li><li><strong>ADM</strong> = Administrativo</li><li><strong>ENG</strong> = Engenharia</li><li><strong>EST</strong> = Estratégia</li><li><strong>OP</strong> = Operação</li><li><strong>HOFF</strong> = Home Office</li><li><strong>AE</strong> = Área Externa</li></ul></div>
    <div class="box-legenda"><h4>Emociograma:</h4><ul class="lista-legenda"><li><strong>1:</strong> Funcionário em plenas condições físicas e psicológicas de exercer suas funções.</li><li><strong>2:</strong> Funcionário com estado físico ou psicológico alterado, porém em condições de exercer suas atividades compatíveis com seu estado físico ou psicológico. Requer acompanhamento.</li><li><strong>3:</strong> Funcionário sem condições físicas ou psicológicas de exercer suas atividades compatíveis com sua área.</li></ul></div>
  </div></div>`;
  return f;
}

function atualizarPaginacaoDDS() {
  const f = document.querySelectorAll('#contentorFolhasDDS .folha-a4');
  f.forEach((folha, i) => {
    const ind = folha.querySelector('.indicador-folha');
    if (ind) ind.innerHTML = `<strong>Folha:</strong> ${pad(i + 1)} / ${pad(f.length)}`;
  });
}
function adicionarFolhaManualDDS() {
  const tot = document.querySelectorAll('#contentorFolhasDDS .corpo-tabela-folha tr').length;
  $('contentorFolhasDDS').appendChild(criarEstruturaFolhaDDS([], null, TOTAL_LINHAS_DDS, tot));
  atualizarPaginacaoDDS(); reordenarNumDDS();
}

function temDadosPreenchidos() {
  const box = $('contentorFolhasDDS');
  return [...box.querySelectorAll('.col-nome-texto,.col-rubrica')].some(e => e.innerText.trim()) || box.querySelector('.carinha-item[class*="selecionado-"]');
}
function aplicarDadosDDS(modo) {
  if (temDadosPreenchidos() && !confirm('Gerar novas folhas vai substituir o que já está preenchido. Continuar?')) return;
  const box = $('contentorFolhasDDS'); box.innerHTML = '';
  const nomes = lerNomes().sort((a, b) => a.localeCompare(b, 'pt-BR'));
  $('nomesInputDDS').value = nomes.join('\n'); atualizarContadorNomes();
  const blocos = [];
  if (!nomes.length) blocos.push([]); else for (let i = 0; i < nomes.length; i += TOTAL_LINHAS_DDS) blocos.push(nomes.slice(i, i + TOTAL_LINHAS_DDS));
  blocos.forEach((b, i) => box.appendChild(criarEstruturaFolhaDDS(b, modo === 'verde', TOTAL_LINHAS_DDS, i * TOTAL_LINHAS_DDS)));
  atualizarPaginacaoDDS(); reordenarNumDDS();
  mostrarToast('Folhas geradas em A-Z com sequência contínua');
}

function obterEstadoCompleto() {
  return { periodo: $('periodoInputDDS').value, semana: $('semanaInputDDS').value, ano: $('anoInputDDS').value, nomes: $('nomesInputDDS').value, html: $('contentorFolhasDDS').innerHTML };
}
function gravar(silencioso) {
  try { localStorage.setItem(CHAVE, JSON.stringify(obterEstadoCompleto())); if (!silencioso) mostrarToast('DDS salvo com sucesso!'); }
  catch (e) { mostrarToast('Não foi possível salvar. Use o Backup.'); }
}
function salvarTudoDDS() { gravar(false); }
function agendarAutoSave() { clearTimeout(_auto); _auto = setTimeout(() => gravar(true), 1200); }
function lerSalvo() { try { const s = localStorage.getItem(CHAVE); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function carregarTudoDDS() {
  const d = lerSalvo();
  if (!d) { mostrarToast('Nenhum dado salvo encontrado.'); return; }
  restaurarEstado(d); mostrarToast('Dados carregados com sucesso!');
}
function restaurarEstado(d) {
  if (d.periodo !== undefined) $('periodoInputDDS').value = d.periodo;
  if (d.semana !== undefined) $('semanaInputDDS').value = d.semana;
  if (d.ano !== undefined) $('anoInputDDS').value = d.ano;
  if (d.nomes !== undefined) $('nomesInputDDS').value = d.nomes;
  if (d.html !== undefined) $('contentorFolhasDDS').innerHTML = d.html;
  if (!document.querySelector('#contentorFolhasDDS .folha-a4')) adicionarFolhaManualDDS();
  atualizarContadorNomes(); atualizarPaginacaoDDS(); reordenarNumDDS();
}
function exportarBackupJSON() {
  const blob = new Blob([JSON.stringify(obterEstadoCompleto(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = `backup_dds_semana_${$('semanaInputDDS').value.trim() || 'atual'}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  mostrarToast('Backup exportado com sucesso!');
}
function processarArquivoBackup(input) {
  const file = input.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (typeof d !== 'object' || d === null || (d.html === undefined && d.nomes === undefined)) throw 0;
      restaurarEstado(d); mostrarToast('Backup restaurado com sucesso!');
    } catch (err) { mostrarToast('Arquivo de backup inválido.'); }
  };
  r.readAsText(file); input.value = '';
}
function limparTudoDDS() {
  if (!confirm('Apagar todas as folhas e nomes? Esta ação não pode ser desfeita (exporte um Backup antes se precisar).')) return;
  $('nomesInputDDS').value = '';
  $('contentorFolhasDDS').innerHTML = '';
  atualizarContadorNomes(); adicionarFolhaManualDDS();
  mostrarToast('Área resetada.');
}

/* Interações: colar texto puro, Enter desce, teclado nas carinhas, autosave */
const caixa = $('contentorFolhasDDS');
caixa.addEventListener('paste', e => {
  if (!e.target.isContentEditable) return;
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text').replace(/\s*\n\s*/g, ' ');
  document.execCommand('insertText', false, t);
});
caixa.addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList.contains('carinha-item') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.click(); return; }
  if (e.key === 'Enter' && t.isContentEditable) {
    e.preventDefault();
    const tr = t.closest('tr'), prox = tr && tr.nextElementSibling;
    if (prox) {
      const cls = ['col-nome-texto','col-id-texto','col-rubrica'].find(c => t.classList.contains(c));
      const alvo = cls && prox.querySelectorAll('.' + cls)[[...tr.querySelectorAll('.' + cls)].indexOf(t)];
      if (alvo) alvo.focus();
    } else t.blur();
  }
});
['input', 'click'].forEach(ev => caixa.addEventListener(ev, agendarAutoSave));
window.addEventListener('beforeunload', () => gravar(true));

window.onload = function () {
  const d = lerSalvo();
  if (d && d.html) { restaurarEstado(d); mostrarToast('Último trabalho recuperado.'); }
  else { adicionarFolhaManualDDS(); atualizarContadorNomes(); }
};
</script>
</body>
</html>
