<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de Participação DSSMA</title>
<style>
:root{--bg:#eef0f3;--bar:#fff;--tx:#1b2430;--bd:#cfd5dd;--ac:#1f4e79;--c:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--bar:#1e242c;--tx:#e6eaf0;--bd:#38414d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181e;--bar:#1e242c;--tx:#e6eaf0;--bd:#38414d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);border-bottom:1px solid var(--bd);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input,textarea{font:inherit}
.bar button,.sh-act button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;cursor:pointer}
.bar button:hover,.sh-act button:hover{border-color:var(--ac)}
.bar button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar label{display:flex;gap:4px;align-items:center}
.bar input,.bar select,.bar textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px}
.bar input[type=number]{width:56px}
.bar textarea{width:190px;height:34px;resize:vertical}
.bar input[type=color]{padding:0;width:34px;height:30px}
#msg{margin-left:auto;font-size:12px;opacity:.7}
#pages{padding:12px;display:flex;flex-direction:column;align-items:center;gap:14px}
.wrap{max-width:100%;overflow-x:auto}
.sheet{background:#fff;color:#000;width:1060px;padding:14px;box-shadow:0 1px 6px #0003;font-family:Arial,Helvetica,sans-serif}
.sh-act{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.sh-act button{background:#f3f4f6;color:#111;border-color:#ccc;padding:3px 8px;font-size:12px}
.top{display:flex;border:2px solid #000;border-bottom:0;height:112px}
.tt{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--tc,#2b6a68);margin-bottom:4px}.tt .ttl{flex:1;border:0;background:transparent;font:700 17px Arial;color:var(--tc,#2b6a68);padding:2px 0}.tt img{height:30px}
.emo{flex:1.5;padding:4px 8px;font:11px Arial;border-left:2px solid #000;color:#000}.emo u{font-weight:700;font-size:14px;display:block;margin-bottom:2px}.lg{display:flex;gap:6px;align-items:center}.lg p{margin:2px 0}.fcs{display:flex;flex-direction:column;align-items:center;font:8px/8px Arial}.fcs i{font-style:normal}.fcs svg{width:14px;height:14px}.seg+.seg{margin-top:14px}
.top textarea{flex:1;border:0;resize:none;padding:6px;font:700 17px Arial;background:transparent;color:#000;box-sizing:border-box}
.top textarea+textarea{border-left:2px solid #000}
.top textarea:first-child{flex:1.15}
table{border-collapse:collapse;width:100%;table-layout:fixed;border:2px solid #000}
th,td{border:1px solid #000;padding:0;height:24px;font-size:11px;text-align:center;font-weight:400}
thead{display:table-header-group}
tr{break-inside:avoid}
th.hd{font-weight:700;font-size:11px;border-top:2px solid #000}
th.vt{writing-mode:vertical-rl;transform:rotate(180deg)}
td.tc{height:32px;padding:0}
td.tc textarea{width:100%;height:100%;border:0;resize:none;font:11px Arial;box-sizing:border-box;padding:2px;background:transparent;color:#000}
.sw{display:flex;gap:4px}.sw button{width:22px;height:22px;border-radius:50%;padding:0!important}
.sheet.neon td.dt{box-shadow:0 0 10px 2px var(--dt),inset 0 0 8px #fff9;position:relative;z-index:1}
td.dt{background:var(--dt,#ffe600);font-weight:700}
td.dt{text-align:left;font-size:10px;height:28px;white-space:nowrap}
td.dt input{width:calc(100% - 52px);border:0;font:10px Arial;background:transparent;color:#000;padding:0}
td.lb{font-size:10px;height:20px}
td.n{font-size:10px;text-align:left;vertical-align:top;padding:1px 2px;width:22px}
td.nm{text-align:left}
td.nm input{width:100%;box-sizing:border-box;border:0;background:transparent;font:700 15px Arial;color:#000;padding:0 3px;height:100%}
td.mo{padding:0;user-select:none}.fc{display:flex;justify-content:space-around;align-items:flex-end;height:100%}.fc span{display:flex;flex-direction:column;align-items:center;cursor:pointer;font:8px/9px Arial;border-radius:4px;padding:0 1px}.fc span:hover{background:#eef5ff}.fc span.on{background:#ffe066;outline:1px solid #000}.fc svg{width:14px;height:14px}
td.mo:hover{background:#eef5ff}
td.ru input{width:100%;box-sizing:border-box;border:0;background:transparent;font:11px Arial;color:#000;text-align:center;height:100%}
td.ban{background:var(--c);color:#fff;font:700 13px Arial;height:22px}
td.ban input{width:100%;border:0;background:transparent;color:#fff;font:700 13px Arial;text-align:center}
td.x,th.x{width:20px;border:0!important;background:none}
td.x button{border:0;background:none;color:#b00;cursor:pointer;font-size:14px;padding:0}
.sh-foot{text-align:right;font-size:11px;color:#555;margin-top:4px}
@media print{
 @page{size:A4 landscape;margin:8mm}
 body{background:#fff}.bar,.sh-act,.x,.sh-foot,body::before{display:none!important}
 #pages{padding:0;gap:0;display:block}.wrap{overflow:visible}
 .sheet{width:100%;box-shadow:none;padding:0;break-after:page}
 .sheet:last-child{break-after:auto}
 td,th{height:6.4mm}td.tc{height:8.5mm}td.dt{height:7.4mm}td.lb{height:5.3mm}
 .top{height:31mm}.seg+.seg{break-before:page;margin-top:0}
 textarea,input{resize:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 td.mo:hover{background:none}
}
</style></head><body>
<div class="bar">
 <button class="p" onclick="window.print()">🖨 Imprimir</button>
 <button onclick="undo()">↶ Desfazer</button><button onclick="redo()">↷ Refazer</button>
 <textarea id="nn" placeholder="Nomes (um por linha)"></textarea>
 <button onclick="addNames()">+ Adicionar</button>
 <button onclick="addSheet()">+ Folha</button>
 <button onclick="renum()">Renumerar</button>
 <label>Cor <input type="color" id="cor" oninput="S.color=this.value;paint()" onchange="commit()"></label>
 <label>Linhas <input type="number" id="per" min="5" max="200" onchange="setPer(+this.value)"></label>
 <label>Aviso após linha <input type="number" id="ban" min="0" max="200" onchange="S.ban=+this.value;commit()"></label>
 <label>Tema <input id="tg" placeholder="Igual p/ todas as colunas" onchange="setTema(this.value)"></label>
 <label>Fundo Data/Turno <input type="color" id="dtc" oninput="S.dt=this.value;paint()" onchange="commit()"></label>
 <span class="sw"><button style="background:#39ff14" title="Verde neon" onclick="setDt('#39ff14')"></button><button style="background:#ff2bd6" title="Rosa neon" onclick="setDt('#ff2bd6')"></button><button style="background:#00f0ff" title="Ciano neon" onclick="setDt('#00f0ff')"></button><button style="background:#fff200" title="Amarelo neon" onclick="setDt('#fff200')"></button><button style="background:#ff6a00" title="Laranja neon" onclick="setDt('#ff6a00')"></button><button style="background:#fff" title="Sem cor" onclick="setDt('#ffffff')"></button></span>
 <label><input type="checkbox" id="neon" onchange="S.neon=this.checked;commit()"> Brilho neon</label>
 <label>Cor título <input type="color" id="tcc" oninput="S.tc=this.value;paint()" onchange="commit()"></label>
 <button onclick="document.getElementById('lg').click()">🖼 Logo</button><input type="file" id="lg" accept="image/*" hidden onchange="setLogo(this)">
 <button onclick="save()">💾 Salvar</button>
 <button onclick="document.getElementById('f').click()">📂 Carregar</button>
 <input type="file" id="f" accept=".json" hidden onchange="load_(this)">
 <button onclick="if(confirm('Apagar tudo e voltar ao modelo inicial?')){S=init();commit()}">Limpar tudo</button>
 <span id="msg"></span>
</div>
<div id="pages"></div>
<script>
const KEY='dssma_v2',NC=5;
const FACE=k=>`<svg viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="1.1"><circle cx="8" cy="8" r="6.8"/><circle cx="5.6" cy="6.4" r=".6" fill="#000"/><circle cx="10.4" cy="6.4" r=".6" fill="#000"/>${k==1?'<path d="M4.8 9.4q3.2 3 6.4 0"/>':k==2?'<path d="M5 10.4h6"/>':'<path d="M4.8 11.6q3.2-3 6.4 0"/>'}</svg>`;
const DEFT='Anexo 02 – Lista de participação em DSSMA para Público Operacional e Administrativo com Emociograma em meio físico';
const DEFB1='Supervisor: JOÃO PEDRO\nSupervisor: WILIAN\n\nTurma: G2';
function topBlock(si,s){const lg=(k,b,t)=>`<div class="lg"><span class="fcs"><i>${k}</i>${FACE(k)}</span><p><b>${b}</b> - ${t}</p></div>`;return `<div class="tt"><input class="ttl" value="${esc(S.title||DEFT)}" onchange="S.title=this.value;commit()">${S.logo?`<img src="${S.logo}">`:''}</div><div class="top"><textarea oninput="S.sheets[${si}].box1=this.value" onchange="commit()">${tx(s.box1)}</textarea><div class="emo"><u>EMOCIOGRAMA:</u>${lg(1,'Estou bem, normal','liberar o trabalhador para as suas atividades')}${lg(2,'Não me sinto bem','não escalar o trabalhador para fazer e/ou participar de serviço perigoso naquele dia')}${lg(3,'Estou péssimo','Não deverá ser escalado para qualquer tipo de atividade, até que seja solucionado o problema')}</div></div>`}
const faces=(si,ri,ci,m)=>`<div class="fc">`+[1,2,3].map(k=>`<span class="${m==k?'on':''}" onclick="mood(${si},${ri},${ci},${k})">${k}${FACE(k)}</span>`).join('')+`</div>`;
const E=()=>({n:'',m:Array(NC).fill(0),r:Array(NC).fill('')});
const sheet=(per,names=[])=>({box1:DEFB1,box2:'',cols:Array.from({length:NC},()=>({d:'',t:''})),rows:Array.from({length:Math.max(per,names.length)},(_,i)=>{const r=E();r.n=names[i]||'';return r})});
function init(){const nm='Alfredo,Allan Souza,André,Atmisto Silva,Bruno Fidelis,Bruno Ricardo,Diego,DIOGO,Dominique,Emerson,Gabriel,Gleivston,Isaque,João Silva Ramos,Juliana,Lucas Braga,Marcos,Mariana,Matheus Brito,Nilton cesar,Pablo,Paulo Henrique,Ricardo,Richard,Robson,Thiago,Wanderson,Willian'.split(',');
 return{dt:'#ffe600',neon:false,color:'#000000',per:78,ban:26,banTxt:'Por favor, vire a folha para realizar o preenchimento.',sheets:[sheet(78,nm)]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S&&S.sheets?S:init();
if(!S.mig){S.mig=1;S.title=S.title||DEFT;S.sheets.forEach(s=>{if(!s.box1)s.box1=DEFB1})}
let U=[],R=[],last=JSON.stringify(S);
const $=id=>document.getElementById(id);
function say(t){$('msg').textContent=t;setTimeout(()=>{if($('msg').textContent===t)$('msg').textContent=''},2800)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function commit(re=true){const cur=JSON.stringify(S);if(cur===last)return;U.push(last);if(U.length>100)U.shift();R=[];last=cur;persist();if(re)render()}
function undo(){if(!U.length)return say('Nada para desfazer');R.push(last);last=U.pop();S=JSON.parse(last);persist();render()}
function redo(){if(!R.length)return say('Nada para refazer');U.push(last);last=R.pop();S=JSON.parse(last);persist();render()}
function paint(){const st=document.documentElement.style;st.setProperty('--c',S.color);st.setProperty('--dt',S.dt||'#ffe600');st.setProperty('--tc',S.tc||'#2b6a68')}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const tx=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(){
 paint();$('cor').value=S.color;$('dtc').value=S.dt||'#ffe600';$('neon').checked=!!S.neon;$('tcc').value=S.tc||'#2b6a68';$('per').value=S.per;$('ban').value=S.ban;
 let h='';
 S.sheets.forEach((s,si)=>{
  const head=`<thead><tr><th class="hd" rowspan="3" style="width:22px">N°</th><th class="hd" rowspan="3" style="width:150px">NOME</th><th class="hd vt" rowspan="3" style="width:26px">TEMA</th>`+
   s.cols.map((c,ci)=>`<td class="tc" colspan="2"><textarea oninput="S.sheets[${si}].cols[${ci}].t=this.value" onchange="commit()">${tx(c.t)}</textarea></td>`).join('')+`<th class="x" rowspan="3"></th></tr><tr>`+
   s.cols.map((c,ci)=>`<td class="dt" colspan="2">Data / Turno: <input value="${esc(c.d)}" oninput="S.sheets[${si}].cols[${ci}].d=this.value" onchange="commit()"></td>`).join('')+`</tr><tr>`+
   s.cols.map(()=>'<td class="lb">Como estou</td><td class="lb">Rubrica</td>').join('')+`</tr></thead>`;
  const rowHtml=(r,ri)=>''+
   `<tr><td class="n">${ri+1}</td><td class="nm" colspan="2"><input value="${esc(r.n)}" oninput="S.sheets[${si}].rows[${ri}].n=this.value" onchange="commit(0)"></td>`+
   r.m.map((m,ci)=>`<td class="mo">${faces(si,ri,ci,m)}</td><td class="ru"><input value="${esc(r.r[ci])}" oninput="S.sheets[${si}].rows[${ri}].r[${ci}]=this.value" onchange="commit(0)"></td>`).join('')+
   `<td class="x"><button title="Remover linha" onclick="delRow(${si},${ri})">×</button></td></tr>`;
  const bn=`<tr><td class="ban" colspan="13"><input value="${esc(S.banTxt)}" oninput="S.banTxt=this.value" onchange="commit(0)"></td><td class="x"></td></tr>`;
  const cut=(S.ban>0&&S.ban<s.rows.length)?S.ban:s.rows.length;
  const top=topBlock(si,s);
  const tbl=(a,b,ban)=>`<table><colgroup><col style="width:2.2%"><col style="width:19.5%"><col style="width:5.8%">${'<col style="width:5.5%"><col style="width:9%">'.repeat(5)}<col class="x" style="width:20px"></colgroup>${head}<tbody>${s.rows.slice(a,b).map((r,i)=>rowHtml(r,a+i)).join('')}${ban?bn:''}</tbody></table>`;
  h+=`<div class="wrap"><div class="sheet${S.neon?' neon':''}"><div class="sh-act">
   <button onclick="dup(${si})">⧉ Duplicar folha</button><button onclick="mv(${si},-1)">↑</button><button onclick="mv(${si},1)">↓</button>
   <button onclick="sortS(${si})">A–Z</button><button onclick="clrMarks(${si})">Limpar marcas</button>
   <button onclick="addRow(${si})">+ Linha</button><button onclick="delSheet(${si})">🗑 Excluir folha</button></div>
   <div class="seg">${top}${tbl(0,cut,cut<s.rows.length)}</div>${cut<s.rows.length?`<div class="seg">${top}${tbl(cut,s.rows.length,false)}</div>`:''}<div class="sh-foot">Folha ${si+1} de ${S.sheets.length}</div></div></div>`;
 });
 $('pages').innerHTML=h;
}
function mood(si,ri,ci,k){const r=S.sheets[si].rows[ri];r.m[ci]=r.m[ci]===k?0:k;commit()}
function setDt(c){S.dt=c;commit()}
function setLogo(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;commit()};r.readAsDataURL(f);el.value=''}
function setTema(v){S.sheets.forEach(s=>s.cols.forEach(c=>c.t=v));commit()}
function addSheet(){S.sheets.push(sheet(S.per));commit();say('Folha adicionada')}
function dup(si){const c=JSON.parse(JSON.stringify(S.sheets[si]));c.cols.forEach(x=>x.d='');c.rows.forEach(r=>{r.m=Array(NC).fill(0);r.r=Array(NC).fill('')});S.sheets.splice(si+1,0,c);commit();say('Folha duplicada (nomes mantidos, marcas limpas)')}
function mv(si,d){const j=si+d;if(j<0||j>=S.sheets.length)return;[S.sheets[si],S.sheets[j]]=[S.sheets[j],S.sheets[si]];commit()}
function delSheet(si){if(S.sheets.length<2)return say('Mantenha ao menos uma folha');if(confirm('Excluir esta folha?')){S.sheets.splice(si,1);commit()}}
function clrMarks(si){const s=S.sheets[si];s.rows.forEach(r=>{r.m=Array(NC).fill(0);r.r=Array(NC).fill('')});s.cols.forEach(c=>{c.d='';c.t=''});commit()}
function sortS(si){const rows=S.sheets[si].rows,f=rows.filter(r=>r.n.trim()).sort((a,b)=>a.n.localeCompare(b.n,'pt',{sensitivity:'base'}));S.sheets[si].rows=f.concat(rows.filter(r=>!r.n.trim()));commit()}
function addRow(si){S.sheets[si].rows.push(E());commit()}
function delRow(si,ri){S.sheets[si].rows.splice(ri,1);commit()}
function addNames(){
 const list=$('nn').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!list.length)return say('Digite ao menos um nome');
 list.forEach(n=>{let r=null;for(const s of S.sheets){r=s.rows.find(x=>!x.n.trim());if(r)break}
  if(!r){const s=S.sheets[S.sheets.length-1];r=E();s.rows.push(r)}r.n=n});
 $('nn').value='';commit();say(list.length+' nome(s) adicionado(s)')}
function renum(){S.sheets.forEach(s=>{const f=s.rows.filter(r=>r.n.trim()),e=s.rows.filter(r=>!r.n.trim());s.rows=f.concat(e)});commit();say('Nomes reagrupados do 1 em diante, sem linhas vazias no meio')}
function setPer(n){if(n<5||n>200)return;S.per=n;S.sheets.forEach(s=>{while(s.rows.length<n)s.rows.push(E());while(s.rows.length>n&&!s.rows[s.rows.length-1].n.trim())s.rows.pop()});commit()}
function save(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='dssma_lista.json';a.click();say('Arquivo salvo')}
function load_(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.sheets||!d.sheets[0].cols)throw 0;S=d;commit();say('Lista carregada')}catch(e){say('Arquivo inválido')}};r.readAsText(f);el.value=''}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();undo()}});
render();
</script></body></html>
